# CI 门禁 —— 所有进 main 的 PR 必须跑绿
# 配套：《docs/code-review/代码审查流程.md》《代码审查标准.md》
# 测试策略见 backend/README.md「自动化测试与 CI」一节
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端：lint + 全量编译 + 离线单元/API 测试 + 覆盖率 ──────
  backend:
    name: Backend lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint (tests, enforced)
        run: ruff check tests
      - name: Ruff lint (app, advisory — 历史存量不阻断)
        continue-on-error: true
        run: ruff check app
      - name: Compile all
        run: python -m compileall -q app
      - name: Pytest (offline) + coverage
        run: pytest -q --cov=app --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  # ── 后端：真实 MySQL 5.6 联调（登录链路端到端）──────────────
  integration-db:
    name: Backend DB integration (MySQL 5.6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start MySQL 5.6
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "5.6"
          root-password: root
          user: wms
          password: wms
          database: wms
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: DB integration tests
        env:
          WMS_ENABLE_DB_TESTS: "1"
          DB_URL: mysql+pymysql://wms:wms@127.0.0.1:3306/wms?charset=utf8mb4
        run: pytest -q -m db

  # ── 前端：静态原型 Playwright 冒烟 ──────────────────────────
  e2e:
    name: Frontend prototype E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  # ── AI 网关：node lint（非阻断，仅提示）────────────────────
  ai-gateway:
    name: AI gateway node lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint
        run: |
          npm install --no-save eslint @eslint/js
          npx eslint . || echo "eslint not configured yet"
