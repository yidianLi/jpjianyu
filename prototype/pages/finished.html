<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成品管理 · 明细/登记/入库/退仓/交付</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>
:root{--ink:#13293f;--muted:#6b7d8f;--line:#dbe5ef;--blue:#1677c8;--navy:#0b4770}
*{box-sizing:border-box}
body{margin:0;background:#f2f6fa;color:var(--ink);font:13px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{padding:24px 24px 32px;max-width:1680px;margin:0 auto}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.h1{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.h1 h2{margin:0;font-size:19px;font-weight:800}
.h1 p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:1080px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(30,70,100,.035);overflow:hidden}
.pad{padding:12px 14px}
.mut{color:var(--muted)}.sm{font-size:11px}
.tblwrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{background:#f8fafc;color:#5f7488;font-weight:700;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid #eef3f8;white-space:nowrap;vertical-align:middle}
.t tr:hover td{background:#f7fbff}
.t .num{text-align:right}.qty-value,.qty-unit{display:inline-block}.qty-value{margin-right:4px}.qty-unit{color:#5f7488;font-weight:600}
.t thead th:nth-child(n+5):nth-child(-n+9){text-align:right}
.t th.column-center,.t td.column-center{text-align:center!important}
.t th:nth-child(5),.t td:nth-child(5){min-width:76px}.t th:nth-child(6),.t td:nth-child(6){min-width:88px}.t th:nth-child(7),.t td:nth-child(7),.t th:nth-child(8),.t td:nth-child(8),.t th:nth-child(9),.t td:nth-child(9){min-width:76px}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:12px;min-height:40px}
.f[readonly]{background:#f4f7fa;color:#5f7488}
.b{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-weight:700;font-size:12px;color:#31506b;min-height:36px}
.b:hover:not(:disabled){background:#eef6fd}
.b.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.b.danger{color:#b42318;border-color:#f0c8c4}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;border:1px solid transparent}
.g1{background:#eef2f6;color:#5b6f82;border-color:#dde5ec}
.g2{background:#e8f2fc;color:#125d97;border-color:#cbe2f6}
.g4{background:#e7f6ee;color:#116d4b;border-color:#c6e9d7}
.g5{background:#fdeceb;color:#a9271f;border-color:#f5cfcb}
.hd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#42586c}.fl.wide{grid-column:1/-1}
.fl i{color:#c0392b;font-style:normal;margin-left:2px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:16px;align-items:start}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#42586c;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.note{background:#f4f9fd;border:1px solid #d7e9f7;border-radius:10px;padding:11px 12px;font-size:12px;color:#3c5a72}
.link{color:var(--blue);font-weight:700;cursor:pointer}.link:hover{text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{min-height:82px;background:#fff;border:1px solid var(--line);border-left:4px solid #3b82f6;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.kpi:nth-child(2){border-left-color:#f59e0b}.kpi:nth-child(3){border-left-color:#ef4444}.kpi:nth-child(4){border-left-color:#10b981}
.kpi small{display:block;color:var(--muted);font-size:11px}.kpi b{display:block;font-size:20px;margin-top:3px;color:#0f4f82}
.subtab{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;color:#4d6479}
.subtab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.batch-row td{background:#eef6fd!important;border-top:1px solid #cfe4f5;border-bottom:1px solid #cfe4f5;color:#125d97;font-weight:800;padding:9px 10px}
.region-row td{background:#fafcff!important;color:#5f7488;font-weight:700;padding:7px 10px;border-bottom:1px solid #e8f0f6}
.batch-mark,.region-mark{display:inline-flex;align-items:center;gap:6px}.batch-mark i{color:#1677c8}
.hide{display:none!important}
.red{color:#b42318}.org{color:#96590a}.grn{color:#116d4b}
.mask{position:fixed;inset:0;background:rgba(11,45,72,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.dlg{background:#fff;border-radius:8px;width:min(860px,100%);max-height:90vh;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.x{border:0;background:transparent;font-size:20px;color:var(--muted)}
.errs{margin:0;padding-left:18px;color:#a9271f;font-size:12px;line-height:1.9}
@media(max-width:1100px){.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/flow.js"></script><script src="../assets/menu-config.js" defer></script><script src="../assets/nav.js" defer></script><script src="../assets/ai-gateway.js"></script><script src="../assets/doc-bridge.js"></script></head>

<div class="flex-1 min-w-0"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">成品管理 / <b class="text-slate-700" id="crumb">成品登记</b></header>

<div id="t" class="hide fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full"></div>
<script>
(function(){
/* ===== 成品账套（localStorage 全站唯一，key 保持兼容） ===== */
var FKEY='jm_finished_core_v1';
function fseed(){return {seq:{CP:208,RK:105,TC:11,JJ:104},
 stock:[{code:'CP-JK-001',name:'HD-JK-24秋 工装夹克',spec:'藏青',unit:'件',wh:'成品仓A',loc:'F01',batch:'CP2026091201',on:600,avail:600,qua:0,pending:0,src:'RK2026091201',at:'2026-09-12 09:00'},
 {code:'CP-JK-001',name:'HD-JK-24秋 工装夹克',spec:'藏青',unit:'件',wh:'成品仓B',loc:'F02',batch:'CP2026091205',on:300,avail:300,qua:0,pending:0,src:'RK2026091202',at:'2026-09-12 09:45'}],
 doc:[{no:'CP2026091208',type:'register',status:'已审批',date:'2026-09-12',customer:'恒达服饰',dept:'缝制一车间',wh:'成品仓A',loc:'F01',handler:'张建国',remark:'',files:2,lines:[{code:'CP-JK-001',name:'HD-JK-24秋 工装夹克',batch:'CP2026091201',qty:400,unit:'件',loc:'F01',region:'F01',price:0,barcode:'CP-CP2026091208-01'}],batchRegions:{CP2026091201:'F01'},activeBatch:'CP2026091201'},
 {no:'RK2026091201',type:'inbound',status:'已审批',date:'2026-09-12',customer:'恒达服饰',wh:'成品仓A',handler:'张建国',acceptor:'王芳',remark:'',src:'CP2026091208',files:0,lines:[{code:'CP-JK-001',name:'HD-JK-24秋 工装夹克',batch:'CP2026091201',qty_src:600,qty:600,unit:'件',loc:'F01',qc:'合格',price:0,barcode:'批次码 CP2026091201'}]},
 {no:'JJ2026091203',type:'deliver',status:'已审批',date:'2026-09-12',customer:'恒达服饰',handler:'张建国',recv:'恒达物流 · 陈司机',stime:'2026-09-12T10:30',sender:'刘强',remark:'',files:2,lines:[{code:'CP-JK-001',name:'HD-JK-24秋 工装夹克',batch:'CP2026091201',wh:'成品仓A',loc:'F01',qty:400,unit:'件'}]}],
 ledger:[{t:'2026-09-12 09:00',doc:'RK2026091201',biz:'成品入库',code:'CP-JK-001',batch:'CP2026091201',wh:'成品仓A',loc:'F01',qty:600,unit:'件',dir:'入',by:'张建国'}],
 audit:[],seq2:{BAR:2}};}
var FDB;try{FDB=JSON.parse(localStorage.getItem(FKEY)||'null')||fseed()}catch(e){FDB=fseed()}
if(!FDB.stock||!FDB.doc)FDB=fseed();
function fsave(){try{localStorage.setItem(FKEY,JSON.stringify(FDB))}catch(e){}}
/* ---- 老数据迁移：单行单据 -> lines[]，库存补 pending ---- */
function migrate(){
 var changed=false;
 FDB.stock.forEach(function(s){if(s.pending==null){s.pending=0;changed=true}if(s.qua==null){s.qua=0;changed=true}});
 FDB.doc.forEach(function(d){
  if(!d.lines){
   var base={code:d.code||'CP-JK-001',name:d.name||'HD-JK-24秋 工装夹克',batch:d.batch||'',qty:num(d.qty),unit:d.unit||'件',loc:d.loc||'F01',region:d.loc||'F01',price:0};
   if(d.type==='inbound'){base.qty_src=num(d.qty);base.qc='合格';base.barcode=''}
   if(d.type==='deliver'){base.wh=d.wh||'成品仓A'}
   if(d.type==='wreturn'){base.reason=d.reason||'质量问题'}
   d.lines=[base];changed=true;
  }
  if(d.type==='register'&&!d.batchRegions){d.batchRegions={};(d.lines||[]).forEach(function(l){if(l.batch)d.batchRegions[l.batch]=l.region||l.loc||d.loc||''});d.activeBatch=(d.lines[0]||{}).batch||'';changed=true}
  if(d.files==null){d.files=0;changed=true}
  if(!d.flow){d.flow={S1:0,S2:0,S3:0,S4:0,S5:0,S6:0,submitted:0,cur:'S1',done:0,hist:[]};changed=true}
 });
 if(changed)fsave();
}
/* ===== 工具 ===== */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function fmt(n){var x=Number(n)||0;return x.toLocaleString('zh-CN',{maximumFractionDigits:3})}
function fmtQty(v){return '<span class="qty-value">'+fmt(v)+'</span>'}
function num(v){var x=Number(v);return isFinite(x)?x:0}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function now(){var d=new Date();return today()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function toast(m,bad){var t=document.getElementById('t');t.textContent=m;t.style.background=bad?'#b42318':'#0f172a';t.classList.remove('hide');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.add('hide')},2600);try{if(window.Store)Store.toast(m)}catch(e){}}
function centerRelevantColumns(root,title){if(!root)return;var labels=['批次','批次 / 库区','来源单','操作人','操作','预警','最后变动'];if(String(title||'').indexOf('审批日志')===0)labels.push('说明');Array.prototype.forEach.call(root.querySelectorAll('table.t'),function(table){Array.prototype.forEach.call(table.querySelectorAll('thead th'),function(header,index){if(labels.indexOf(header.textContent.trim())<0)return;header.classList.add('column-center');Array.prototype.forEach.call(table.tBodies,function(body){Array.prototype.forEach.call(body.rows,function(row){if(row.cells[index])row.cells[index].classList.add('column-center')})})})})}
function dialog(title,body,foot){var r=document.getElementById('dlgRoot');document.getElementById('dlgTitle').textContent=title;document.getElementById('dlgBody').innerHTML=body;centerRelevantColumns(document.getElementById('dlgBody'),title);document.getElementById('dlgFoot').innerHTML=foot||'<button class="b" data-close>关闭</button>';r.classList.remove('hide')}
document.getElementById('dlgX').onclick=function(){document.getElementById('dlgRoot').classList.add('hide')};
document.getElementById('dlgRoot').addEventListener('click',function(e){if(e.target===this||e.target.closest('[data-close]'))this.classList.add('hide')});
function finTag(s){var m={'草稿':'g1','已保存':'g2','已审批':'g4','已作废':'g1'};return '<span class="tag '+(m[s]||'g1')+'">'+esc(s)+'</span>'}
function faudit(d,act,note){FDB.audit.unshift({t:now(),doc:d.no,act:act,by:d.handler||'—',note:note||''})}
/* ===== 库存/单据基础 ===== */
var FINISHED_CATALOG=[{code:'CP-JK-001',name:'HD-JK-24秋 工装夹克',spec:'藏青',unit:'件'}];
function fmat(code){var c=FINISHED_CATALOG.filter(function(x){return x.code===code})[0];return c||{code:code,name:code,spec:'',unit:'件'}}
function fstock(code,batch,wh,loc){return FDB.stock.filter(function(s){return s.code===code&&s.batch===batch&&s.wh===wh&&(!loc||s.loc===loc)})[0]}
function fstockOrNew(code,wh,loc,batch){var m=fmat(code),s=fstock(code,batch,wh,loc);if(!s){s={code:code,name:m.name,spec:m.spec||'',unit:m.unit||'件',wh:wh,loc:loc||'F01',batch:batch,on:0,avail:0,qua:0,pending:0,src:'',at:now()};FDB.stock.push(s)}if(loc)s.loc=loc;return s}
function nextFinBatch(code,wh){var base='CP'+today().replace(/-/g,'');var n=1,b;do{b=base+String(n++).padStart(3,'0')}while(FDB.stock.some(function(s){return s.code===code&&s.wh===wh&&s.batch===b}));return b}
function fnext(p){FDB.seq[p]=(FDB.seq[p]||100)+1;return p+today().replace(/-/g,'')+String(FDB.seq[p]).slice(-4)}
function docBy(no){return FDB.doc.filter(function(d){return d.no===no})[0]}
function finDocs(t){return FDB.doc.filter(function(d){return d.type===t})}
function pendingFin(){return FDB.doc.filter(function(d){return d.status==='已保存'||d.status==='已驳回'||d.status==='草稿'}).length}
function lineSum(lines){var q=0;(lines||[]).forEach(function(l){q+=num(l.qty)});return q}
function finAlert(s){if(num(s.qua)>0)return '隔离待处理';if(num(s.avail)<=0)return '无可用';return '正常'}
function finAlertTag(s){var a=finAlert(s);return '<span class="tag '+(a==='正常'?'g4':a==='隔离待处理'?'g5':'g2')+'">'+a+'</span>'}
/* 来源单：已审批入库/登记中同成品同批次的入账记录 */
function finSources(code,batch,wh,loc){
 var found=[];
 FDB.doc.forEach(function(d){
  if(d.status!=='已审批')return;
  if(d.type!=='inbound'&&d.type!=='register')return;
  (d.lines||[]).forEach(function(l){
   if(l.code!==code)return;
   if(batch&&String(l.batch||'')!==String(batch))return;
   if(wh&&d.wh&&d.wh!==wh&&!(d.type==='register'))return;
   found.push({no:d.no,type:d.type==='inbound'?'成品入库':'成品登记',date:d.date,qty:num(l.qty),batch:l.batch||'',loc:l.loc||d.loc||''});
  });
 });
 var g={};found.forEach(function(s){var k=s.no+'|'+s.batch;if(!g[k])g[k]=s;else g[k].qty+=s.qty});
 return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
}
/* ===== 路由 ===== */
var NAMES={detail:'成品管理 / 成品明细',register:'成品管理 / 成品登记',inbound:'成品管理 / 成品入库',wreturn:'成品管理 / 成品退仓',deliver:'成品管理 / 成品交付'};
function routeFin(){var v='';try{var u=new URLSearchParams(location.search);v=u.get('view')||u.get('tab')||''}catch(e){}
 if(v==='detail'||v==='register'||v==='inbound'||v==='wreturn'||v==='deliver')return v;
 if(v==='sign')return 'deliver';if(v===''||v==='finished')return 'register';if(v==='stock'||v==='onhand'||v==='ledger')return 'detail';
 var n=parseInt(v,10);if(!isNaN(n)){var m={1:'register',2:'detail',3:'inbound',4:'wreturn',5:'deliver'};if(m[n])return m[n]}
 return 'register'}
var VIEW=routeFin();
var queue='待办',kw='',curNo='';
window.finSetKw=function(v){kw=String(v||'')};
try{var _p=new URLSearchParams(location.search);if(_p.get('doc'))curNo=_p.get('doc')||''}catch(e){}
var deliverMode='list';
try{var _m=new URLSearchParams(location.search);if(_m.get('mode')==='new'||_m.get('mode')==='edit')deliverMode='edit'}catch(e){}
function notifyParent(){
 if(!/from=app/.test(location.search))return;
 var id={detail:'finishedDetail',register:'finishedRegister',inbound:'finishedInbound',wreturn:'finishedReturn',deliver:'finishedDeliver'}[VIEW];
 try{parent.postMessage({from:'wms-nav',page:id,view:VIEW,tab:VIEW},'*')}catch(e){}
}
/* ===== 成品明细（参考物料明细：按成品聚合 + 批次明细 + 来源单） ===== */
function renderDetail(){
 var q=(kw||'').toLowerCase();
 var rows=FDB.stock.slice().sort(function(a,b){return String(a.code).localeCompare(String(b.code))});
 if(q)rows=rows.filter(function(s){return (s.code+' '+(s.name||'')+' '+(s.batch||'')+' '+(s.wh||'')+' '+(s.loc||'')).toLowerCase().indexOf(q)>=0});
 var grouped={};rows.forEach(function(s){(grouped[s.code]||(grouped[s.code]=[])).push(s)});
 function uniq(a,k){var r=[];a.forEach(function(s){if(s[k]&&r.indexOf(s[k])<0)r.push(s[k])});return r}
 function tot(a,k){return a.reduce(function(x,s){return x+num(s[k])},0)}
 var body=Object.keys(grouped).map(function(code){
  var ss=grouped[code],m=fmat(code),first=ss[0];
  var batches=uniq(ss,'batch');
  var srcs=[];ss.forEach(function(s){finSources(s.code,s.batch,s.wh,s.loc).forEach(function(x){if(!srcs.some(function(y){return y.no===x.no&&y.batch===x.batch}))srcs.push(x)})});
  var ledn=FDB.ledger.filter(function(x){return x.code===code}).length;
  var last=uniq(ss,'at').sort().reverse()[0]||'—';
  var alert=ss.some(function(s){return num(s.qua)>0})?'隔离待处理':ss.some(function(s){return num(s.avail)<=0})?'无可用':'正常';
  return '<tr><td><b>'+esc(code)+'</b></td><td>'+esc(m.name)+'</td><td>'+esc(m.spec||first.spec||'—')+'</td>'
  +'<td><span class="link" onclick="finBatches(\''+esc(code)+'\')">共 '+batches.length+' 条</span></td>'
  +'<td class="num"><b>'+ss.length+'</b></td><td>'+esc(first.unit==='个'?'袋':'箱')+'</td>'
  +'<td class="num"><b>'+fmt(tot(ss,'on'))+'</b></td><td>'+esc(first.unit||'件')+'</td><td class="num grn"><b>'+fmt(tot(ss,'avail'))+'</b></td>'
  +'<td class="num '+(tot(ss,'qua')?'red':'')+'"><b>'+fmt(tot(ss,'qua'))+'</b></td><td class="num org">'+fmt(tot(ss,'pending'))+'</td>'
  +'<td>'+finAlertTag({qua:tot(ss,'qua'),avail:tot(ss,'avail')})+'</td><td class="num">'+ledn+'</td>'
  +'<td class="sm">'+(srcs.length?'<span class="link" onclick="finSourcesDlg(\''+esc(code)+'\')">共 '+srcs.length+' 张</span>':'<span class="mut">—</span>')+'</td>'
  +'<td class="sm mut">'+esc(last)+'</td>'
  +'<td><span class="link" onclick="finFlowDlg(\''+esc(code)+'\',\'\')">流水</span> <span class="link" onclick="goDeliverByCode(\''+esc(code)+'\')">交付</span></td></tr>';
 }).join('');
 var kpiKinds=Object.keys(grouped).length;
 var kpiQua=rows.reduce(function(a,s){return a+num(s.qua)},0);
 var kpiPend=rows.reduce(function(a,s){return a+num(s.pending)},0);
 document.getElementById('main').innerHTML=

function finValidate(d){
 var e=[];
 if(!d.lines||!d.lines.length)e.push('清单为空：请点击“添加清单”加入成品');
 (d.lines||[]).forEach(function(l,i){
  var n='第'+(i+1)+'行';
  if(!l.code)e.push(n+'：未选择成品');
  if(!(num(l.qty)>0))e.push(n+'：数量必须大于 0');
  if(d.type==='inbound'){
   if(!l.qc)e.push(n+'：请选择质检结论');
   if(l.qc==='不合格（转退仓）')e.push(n+'：不合格行不得入库，请到《成品退仓》建单');
   if(num(l.qty_src)>0&&num(l.qty)>num(l.qty_src))e.push(n+'：验收数量不能大于来料数量');
  }
  if(d.type==='wreturn'){
   if(!l.batch)e.push(n+'：批次号必填');
   var s=fstock(l.code,l.batch,d.wh||'成品仓A',null)||FDB.stock.filter(function(x){return x.code===l.code&&x.batch===l.batch})[0];
   if(!s)e.push(n+'：未找到该批次库存');
   else{
    if(d.ret_type==='可用转隔离'&&num(s.avail)<num(l.qty))e.push(n+'：可用 '+fmt(s.avail)+' 不足以退仓 '+fmt(l.qty));
    if((d.ret_type==='隔离报废'||d.ret_type==='隔离转可用')&&num(s.qua)<num(l.qty))e.push(n+'：隔离 '+fmt(s.qua)+' 不足以处置 '+fmt(l.qty));
   }
  }
  if(d.type==='deliver'){
   if(!l.batch)e.push(n+'：请选择有可用量的批次');
   var s3=FDB.stock.filter(function(x){return x.code===l.code&&x.batch===l.batch})[0];
   if(!s3)e.push(n+'：未找到该批次库存，请重新选择');
   else if(num(s3.avail)<num(l.qty))e.push(n+'：可用 '+fmt(s3.avail)+' 不足，本次 '+fmt(l.qty));
  }
 });
 if(d.type==='register'){if(!d.customer)e.push('单头「客户」必填');if(!d.date)e.push('单头「工单日期」必填')}
 if(d.type==='inbound'){
  if(num(d.lines.reduce(function(a,l){return a+(num(l.qty)!==num(l.qty_src)?1:0)},0))>0&&!String(d.remark||'').trim())e.push('验收数与来料数不一致，必须在便签备注填写差异原因');
 }
 if(d.type==='wreturn'){
  if(!d.src)e.push('必须选择原入库单号');
  else{
   var src=docBy(d.src);
   if(!src||src.type!=='inbound')e.push('原入库单 '+d.src+' 不存在或不是入库单');
   else if(src.status!=='已审批')e.push('原入库单未审批，不能退仓');
   else{
    (d.lines||[]).forEach(function(l,i){
     var acc=0;(src.lines||[]).forEach(function(x){if(x.code===l.code&&(!l.batch||x.batch===l.batch))acc+=num(x.qty)});
     var back=0;FDB.doc.forEach(function(o){if(o.type==='wreturn'&&o.status==='已审批'&&o.src===d.src&&o.no!==d.no)(o.lines||[]).forEach(function(x){if(x.code===l.code&&(!l.batch||x.batch===l.batch))back+=num(x.qty)})});
     if(num(l.qty)>acc-back)e.push('第'+(i+1)+'行超退拦截 · 原入库 '+fmt(acc)+'，已退 '+fmt(back)+'，本次最多可退 '+fmt(Math.max(0,acc-back)));
    });
   }
  }

 }
 if(d.type==='deliver'){

 }
 return e;
}

   var s=fstockOrNew(l.code,d.wh,l.loc||'F01',l.batch);
   s.on+=num(l.qty);s.at=now();s.src=d.no;
   if(l.qc==='待检'){s.pending+=num(l.qty);FDB.ledger.unshift({t:now(),doc:d.no,biz:'成品入库·待检',code:l.code,batch:l.batch,wh:d.wh,loc:s.loc,qty:num(l.qty),unit:l.unit,dir:'入',by:d.handler||'—'})}

   l.barcode='批次码 '+l.batch;

  if(d.batchRegions[b]||(d.lines||[]).some(function(l){return String(l.batch||'')===b})){toast('本单已存在批次 '+b,1);return}
  d.batchRegions[b]=r;d.activeBatch=b;
  var l=newFinLine(d,'','','');l.batch=b;l.region=r;l.loc=r;d.lines.push(l);
  faudit(d,'新建批次',b+' / '+r);fsave();document.getElementById('dlgRoot').classList.add('hide');render();toast('已新建批次 '+b);
 };
};
window.finPullReg=function(no){
 var d=docBy(no);if(!d||d.type!=='inbound')return;
 if(!d.src){toast('请先在单头选择关联登记单',1);return}
 var src=docBy(d.src);if(!src||src.type!=='register'){toast('登记单不存在：'+d.src,1);return}
 var n=0;(src.lines||[]).forEach(function(x){if(!x.code)return;d.lines.push({code:x.code,name:x.name||fmat(x.code).name,unit:x.unit||'件',batch:'',qty_src:num(x.qty),qty:num(x.qty),loc:x.loc||d.loc||'F01',region:x.region||x.loc||d.loc||'F01',price:0,qc:'合格',barcode:''});n++});
 if(!n){toast('登记单没有可带入的行',1);return}
 fsave();render();toast('已从 '+src.no+' 带入 '+n+' 行');
};
function finFlowKey(d){return d.type==='register'?'fin_register':d.type==='inbound'?'fin_inbound':d.type==='wreturn'?'fin_wreturn':'fin_deliver'}
function finFlowText(d){try{if(!window.ApproveFlow)return 'S1=1→S2=1→S6=1';ApproveFlow.ensureFlow(d,finFlowKey(d));return ApproveFlow.flowText(finFlowKey(d),d.flow)}catch(e){return ''}}
window.finSubmit=function(no){var d=docBy(no);if(!d)return;if(d.status==='已审批'){toast('已过账无需提交',1);return}
 if(d.status==='草稿')d.status='已保存';
 var r=ApproveFlow.submit(d,finFlowKey(d),d.handler||'经办人');if(!r.ok){toast(r.msg,1);return}
 faudit(d,'提交(S1=1)','');fsave();render();toast(d.no+' '+r.msg)};
window.finAudit=function(no){var d=docBy(no);if(!d)return;ApproveFlow.ensureFlow(d,finFlowKey(d));
 if(!d.flow.submitted){toast('请先点“提交”(S1=1) 后再审核',1);return}
 if(ApproveFlow.needPost(d,finFlowKey(d))){toast('各节点已通过，请点“仓管确认”完成过账');return}
 var nx=ApproveFlow.nextPending(finFlowKey(d),d.flow);if(!nx){toast('审批流已走完，请仓管确认',1);return}
 dialog('审核 · '+nx.k+'（'+nx.role+'）','<div class="note">当前进度：'+esc(ApproveFlow.flowText(finFlowKey(d),d.flow))+'</div><div class="hd" style="margin-top:10px"><label class="fl"><span>审批结论</span><select class="f" id="af_pass"><option value="1">通过</option><option value="0">驳回</option></select></label><label class="fl"><span>审批人/意见</span><input class="f" id="af_note" placeholder="如：张建国 · 同意"></label></div>','<button class="b" data-close>取消</button><button class="b pri" id="afDo">确定</button>');
 document.getElementById('afDo').onclick=function(){
  var ps=document.getElementById('af_pass').value==='1',nt=document.getElementById('af_note').value.trim();
  if(ps){var r=ApproveFlow.approve(d,finFlowKey(d),d.handler||'审批人',nx.role,true,nt);faudit(d,'审核通过('+nx.k+')',nt||nx.role);fsave();document.getElementById('dlgRoot').classList.add('hide');render();toast(d.no+' '+r.msg);return}
  ApproveFlow.approve(d,finFlowKey(d),d.handler||'审批人',nx.role,false,nt);faudit(d,'审核驳回('+nx.k+')',nt);fsave();document.getElementById('dlgRoot').classList.add('hide');render();toast(d.no+' 已驳回，退回经办人',1);
 };};
/* 成品后端同步:deliver直调签收;inbound走建WO+完工;register/wreturn本地(无后端对应口) */
function finLinesQty(d){return (d.lines||[]).reduce(function(n,l){return n+(Number(l.qty)||0);},0);}
function finFirstCode(d){var l=(d.lines||[])[0]||{};return l.code||'';}
function finSyncSrv(d){
 if(!window.WmsProduce)return Promise.resolve();
 if(d.type==='deliver')return WmsProduce.signDeliver(d.no,d.recv,d.stime,d.sender,'').then(function(){d.srv_signed=1;fsave();});
 if(d.type==='inbound'){
  var code=finFirstCode(d),qty=finLinesQty(d);
  if(!code||!qty)return Promise.reject(new Error('成品编码与数量必填'));
  return WmsProduce.bomVersion(code).then(function(ver){
   if(!ver)throw new Error(code+' 无启用BOM版本,先到基础资料建BOM');
   return WmsProduce.createWo(code,qty,ver,d.dept||'');
  }).then(function(wo){d.srv_wo=wo;fsave();return WmsProduce.finishWo(wo,qty,d.handler||'');})
  .then(function(rk){d.srv_rk=rk;fsave();});
 }
 return Promise.resolve();
}
window.finConfirm=function(no){var d=docBy(no);if(!d)return;ApproveFlow.ensureFlow(d,finFlowKey(d));
 if(!d.flow.submitted){toast('请先点“提交”(S1=1)',1);return}
 var left=ApproveFlow.nextPending(finFlowKey(d),d.flow);
 if(left&&left.k!=='S6'){toast('还有未审核节点：'+left.k+'('+left.role+')',1);return}
 if(d.status==='已审批'){toast('重复审批被拒绝（幂等保护）',1);return}
 var r=finPost(d);
 if(!r.ok){dialog('校验未通过：本单未过账','<ul class="errs">'+r.errors.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}
 d.flow.S6=1;d.flow.done=1;d.flow.cur='DONE';(d.flow.hist=d.flow.hist||[]).push({t:now(),act:'仓管确认(S6=1)',by:d.handler||'仓管员'});
 finSyncSrv(d).then(function(){
 d.status='已审批';faudit(d,'仓管确认·过账(S6=1)','工单完成');fsave();render();
 toast(d.no+(d.type==='register'?' 登记完成(S6=1)：条码已生成，未加库存':d.type==='inbound'?' 仓管确认完成(S6=1)：库存已增加'+(d.srv_rk?'（'+d.srv_rk+'）':''):d.type==='wreturn'?' 退仓完成(S6=1)':' 交付完成(S6=1，含签收存证)'))}).catch(function(e){toast('后端同步失败,本地未动:'+e.message,1);});};
window.finSave=function(no){var d=docBy(no);if(!d)return;if(d.status==='已审批'){toast('已过账无需保存');return}d.status='已保存';faudit(d,'保存待审批','');fsave();render();toast(d.no+' 已保存为待审批（登记单不加库存）')};
window.finApprove=function(no){
 var d=docBy(no);if(!d)return;
 if(d.status==='已审批'){toast('重复审批被拒绝（幂等保护）',1);return}
 var r=finPost(d);
 if(!r.ok){dialog('校验未通过：本单未过账','<ul class="errs">'+r.errors.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><div class="note" style="margin-top:12px">过账是原子操作：任何一行不通过，整单不写流水、不改库存。</div>');return}
 finSyncSrv(d).then(function(){
 d.status='已审批';fsave();render();
 toast(d.no+(d.type==='register'?' 登记完成：条码已生成，未加库存，下一步请到成品入库':d.type==='inbound'?' 审批入账：库存已增加'+(d.srv_rk?'（'+d.srv_rk+'）':''):d.type==='wreturn'?' 退仓完成':' 交付完成（含签收存证）'));}).catch(function(e){toast('后端同步失败,本地未动:'+e.message,1);});
};
window.finVoid=function(no){var d=docBy(no);if(!d||d.status==='已审批'){toast('已审批单据不可作废',1);return}d.status='已作废';faudit(d,'作废','');fsave();if(d.type==='deliver'){deliverMode='list';curNo=''}else curNo='';render();toast('已作废：'+no)};
window.finPrint=function(no){toast('已推送成品单 '+no+' 到打印队列')};
window.finFile=function(no){var d=docBy(no);if(!d)return;d.files=(d.files||0)+1;faudit(d,'上传附件','');fsave();render();toast('附件已上传，计入单据附件数量')};
window.finLog=function(no){var ls=FDB.audit.filter(function(a){return a.doc===no});dialog('审批日志 · '+no,'<div class="tblwrap"><table class="t"><thead><tr><th>时间</th><th>动作</th><th>操作人</th><th>说明</th></tr></thead><tbody>'+(ls.map(function(a){return '<tr><td>'+esc(a.t)+'</td><td>'+esc(a.act)+'</td><td>'+esc(a.by)+'</td><td>'+esc(a.note)+'</td></tr>'}).join('')||'<tr><td colspan="4" class="mut">暂无日志</td></tr>')+'</tbody></table></div>')};
/* ===== 启动 ===== */
migrate();
if(deliverMode==='edit'&&!curNo&&VIEW==='deliver'){var _nd=blankFinDoc('deliver');FDB.doc.unshift(_nd);fsave();curNo=_nd.no}
render();
})();
</script></body></html>
