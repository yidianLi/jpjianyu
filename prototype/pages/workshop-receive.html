<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车间管理 · 车间接收</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>dialog::backdrop{background:rgba(15,23,42,.42)}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/nav.js"></script></head><body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">车间管理 / <b class="text-slate-700">车间接收</b></header><main class="p-6 space-y-4"><div class="flex justify-between items-center flex-wrap gap-2"><div><h1 class="text-xl font-extrabold">车间接收记录</h1><p class="text-xs text-slate-500">直送或领料到货后的接收确认，记录送达数量、实收数量和差异</p></div><button type="button" class="text-xs bg-blue-600 text-white px-4 py-2 rounded-lg font-bold" onclick="openReceive()">+ 新建接收</button></div><div class="card p-4"><div class="flex gap-2 text-xs flex-wrap"><input id="receiveSearch" aria-label="搜索接收记录" placeholder="搜索：单号 / 物料 / 车间" class="border rounded-lg px-3 py-2 w-64"><select id="receiveStatus" aria-label="接收状态筛选" class="border rounded-lg px-2 py-2"><option value="">全部状态</option><option>待接收</option><option>已接收</option><option>差异待处理</option></select></div><div class="overflow-x-auto"><table class="w-full min-w-[720px] text-xs mt-3"><thead><tr class="text-slate-400 text-left border-b"><th class="py-2">单号</th><th>物料/数量</th><th>送达/实收</th><th>车间</th><th>状态</th><th>操作</th></tr></thead><tbody id="receiveBody"><tr class="border-b hover:bg-blue-50"><td class="py-2 text-blue-700 font-bold">ZS2026091204</td><td>里布 800米</td><td>800 / —</td><td>裁剪车间</td><td><span class="bg-blue-100 text-blue-600 px-2 rounded-full">待接收</span></td><td><button type="button" class="text-blue-600 font-bold" onclick="receiveDone(this)">确认接收</button></td></tr><tr class="border-b hover:bg-blue-50"><td class="py-2 text-blue-700 font-bold">LY2026091108</td><td>牛津布 200米</td><td>200 / 195</td><td>缝制一车间</td><td><span class="bg-orange-100 text-orange-600 px-2 rounded-full">差异待处理</span></td><td><button type="button" class="text-blue-600 font-bold" onclick="toast('已打开差异处理')">处理差异</button></td></tr><tr class="hover:bg-blue-50"><td class="py-2 text-blue-700 font-bold">ZS2026091016</td><td>拉链 2000件</td><td>2000 / 2000</td><td>组装二车间</td><td><span class="bg-emerald-100 text-emerald-700 px-2 rounded-full">已接收</span></td><td><button type="button" class="text-slate-500" onclick="toast('已查看接收详情')">查看</button></td></tr></tbody></table></div></div></main></div></div><dialog id="receiveDialog" class="w-[min(560px,calc(100%-32px))] rounded-2xl p-0 shadow-2xl" aria-labelledby="receiveDialogTitle"><form id="receiveForm" class="bg-white" onsubmit="saveReceive(event)"><div class="flex items-start justify-between gap-4 px-5 py-4 border-b"><div><h2 id="receiveDialogTitle" class="text-base font-extrabold text-slate-800">新建接收登记</h2><p class="text-xs text-slate-400 mt-1">选择待接收单据，核对送达数量并填写实收数量</p></div><button type="button" onclick="closeReceive()" class="w-9 h-9 rounded-lg border text-slate-500" aria-label="关闭接收登记">×</button></div><div class="p-5 space-y-3 text-xs"><label class="block">待接收单据<select id="newReceiveDoc" class="mt-1 w-full border rounded-lg px-3 py-2.5" onchange="syncReceiveDoc()"><option value="zs1212">ZS2026091212 · 牛津布 1200米 · 缝制一车间</option><option value="zs1215">ZS2026091215 · 拉链 3000件 · 组装一车间</option><option value="zs1204">ZS2026091204 · 里布 800米 · 裁剪车间</option></select></label><div id="receiveDocInfo" class="bg-blue-50 border border-blue-100 text-blue-800 rounded-xl p-3" role="status">送达：牛津布 1200米 · 目标：缝制一车间</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label>实收数量<input id="receiveActual" type="number" min="0" step="0.001" value="1200" required class="mt-1 w-full border rounded-lg px-3 py-2.5"></label><label>接收人<input id="receivePerson" value="李小明" required class="mt-1 w-full border rounded-lg px-3 py-2.5"></label><label>接收时间<input id="receiveTime" type="datetime-local" value="2026-09-14T09:30" required class="mt-1 w-full border rounded-lg px-3 py-2.5"></label><label>备注<input id="receiveRemark" placeholder="选填" class="mt-1 w-full border rounded-lg px-3 py-2.5"></label></div><div id="receiveDifference" class="text-slate-500" aria-live="polite">实收与送达一致，将登记为“已接收”</div></div><div class="flex justify-end gap-2 px-5 py-4 border-t"><button type="button" onclick="closeReceive()" class="border rounded-lg px-4 py-2.5 text-xs">取消</button><button type="submit" class="bg-blue-600 text-white rounded-lg px-5 py-2.5 text-xs font-bold">确认接收并保存</button></div></form></dialog><div id="t" role="status" aria-live="polite" class="hidden fixed z-[70] bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full"></div><script>var receiveDocs={zs1212:{no:'ZS2026091212',material:'牛津布',qty:1200,unit:'米',workshop:'缝制一车间'},zs1215:{no:'ZS2026091215',material:'拉链',qty:3000,unit:'件',workshop:'组装一车间'},zs1204:{no:'ZS2026091204',material:'里布',qty:800,unit:'米',workshop:'裁剪车间'}};function toast(t){var d=document.getElementById('t');d.textContent=t;d.classList.remove('hidden');setTimeout(function(){d.classList.add('hidden')},2200)}function openReceive(){syncReceiveDoc();document.getElementById('receiveDialog').showModal();document.getElementById('newReceiveDoc').focus()}function closeReceive(){document.getElementById('receiveDialog').close()}function syncReceiveDoc(){var d=receiveDocs[document.getElementById('newReceiveDoc').value];document.getElementById('receiveActual').value=d.qty;document.getElementById('receiveDocInfo').textContent='送达：'+d.material+' '+d.qty+d.unit+' · 目标：'+d.workshop;updateDifference()}function updateDifference(){var d=receiveDocs[document.getElementById('newReceiveDoc').value],actual=Number(document.getElementById('receiveActual').value||0),diff=actual-d.qty,out=document.getElementById('receiveDifference');out.textContent=diff===0?'实收与送达一致，将登记为“已接收”':'存在差异 '+(diff>0?'+':'')+diff+d.unit+'，将登记为“差异待处理”';out.className=diff===0?'text-emerald-600':'text-orange-600'}function saveReceive(e){e.preventDefault();var d=receiveDocs[document.getElementById('newReceiveDoc').value],actual=Number(document.getElementById('receiveActual').value),diff=actual-d.qty,status=diff===0?'已接收':'差异待处理',statusClass=diff===0?'bg-emerald-100 text-emerald-700':'bg-orange-100 text-orange-600',rows=[].slice.call(document.querySelectorAll('#receiveBody tr')),row=rows.find(function(r){return r.cells[0].textContent.trim()===d.no;});var html='<td class="py-2 text-blue-700 font-bold">'+d.no+'</td><td>'+d.material+' '+d.qty+d.unit+'</td><td>'+d.qty+' / '+actual+'</td><td>'+d.workshop+'</td><td><span class="'+statusClass+' px-2 rounded-full">'+status+'</span></td><td><button type="button" class="text-slate-500" onclick="toast(\'已查看接收详情\')">查看</button></td>';if(row)row.innerHTML=html;else{row=document.createElement('tr');row.className='border-b hover:bg-blue-50';row.innerHTML=html;document.getElementById('receiveBody').prepend(row)}closeReceive();toast('接收记录已保存：'+d.no)}function receiveDone(b){b.textContent='已接收 ✓';b.className='text-emerald-600 font-bold';var row=b.closest('tr');row.querySelector('td:nth-child(3)').textContent='800 / 800';row.querySelector('td:nth-child(5)').innerHTML='<span class="bg-emerald-100 text-emerald-700 px-2 rounded-full">已接收</span>';toast('接收已确认，记录已保存')}document.getElementById('receiveActual').addEventListener('input',updateDifference);document.getElementById('receiveSearch').addEventListener('input',filterReceive);document.getElementById('receiveStatus').addEventListener('change',filterReceive);function filterReceive(){var q=document.getElementById('receiveSearch').value.trim(),s=document.getElementById('receiveStatus').value;document.querySelectorAll('#receiveBody tr').forEach(function(row){row.style.display=(!q||row.textContent.indexOf(q)>-1)&&(!s||row.textContent.indexOf(s)>-1)?'':'none';});}</script></body></html>
