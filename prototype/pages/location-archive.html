<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础资料 · 库区档案</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #cde8f7;border-radius:8px}.field{min-height:40px;border:1px solid #9bcbe7;border-radius:8px;padding:8px 10px;font-size:12px}.qr-img{width:48px;height:48px;border:1px solid #cde8f7;border-radius:5px;background:#fff}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script></head><body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">基础资料 / <b class="text-slate-700">库区档案</b></header><main class="p-6 space-y-4"><div class="flex justify-between gap-3 flex-wrap"><div><h1 class="text-xl font-extrabold">库区档案</h1><p class="text-xs text-slate-500">按仓库和库区维护库区编码、容量、二维码及启用状态</p></div><button class="bg-blue-600 text-white rounded-lg px-4 py-2 text-xs font-bold" onclick="addLocation()">+ 新增库区</button></div><div class="card p-4"><div class="flex gap-2 flex-wrap"><input id="q" class="field w-64" placeholder="搜索：库区编码 / 库区"><select id="warehouse" class="field"><option value="">全部仓库</option><option>外仓 WH-A</option><option>内仓1 WH-B</option><option>内仓2 WH-C</option></select><select id="status" class="field"><option value="">全部状态</option><option>启用</option><option>停用</option><option>草稿</option></select><span class="flex-1"></span><span id="count" class="text-xs text-slate-400 self-center"></span></div><div class="overflow-x-auto"><table class="w-full min-w-[820px] text-xs mt-3"><thead><tr class="text-left border-b"><th class="py-2">库区编码</th><th>仓库 / 库区</th><th>容量</th><th>库区二维码</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></div></main></div></div><div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full"></div><script>var rows=[['AQ-WHA-A05','外仓 WH-A','A-05区','240托','AQ-WHA-A05','启用'],['AQ-WHA-D01','外仓 WH-A','待检区D01','—','AQ-WHA-D01','启用'],['AQ-WHA-A06','外仓 WH-A','A-06区','200托','AQ-WHA-A06','草稿'],['AQ-WHB-B02','内仓1 WH-B','B-02区','180托','AQ-WHB-B02','启用']];function toast(s){var t=document.getElementById('t');t.textContent=s;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},1800)}function render(){var q=document.getElementById('q').value.trim(),wh=document.getElementById('warehouse').value,st=document.getElementById('status').value,list=rows.filter(function(r){return(!q||r.join(' ').indexOf(q)>-1)&&(!wh||r[1]===wh)&&(!st||r[5]===st)});document.getElementById('body').innerHTML=list.map(function(r){return'<tr class="border-b hover:bg-blue-50"><td class="py-2 font-bold text-blue-700">'+r[0]+'</td><td>'+r[1]+' · '+r[2]+'</td><td>'+r[3]+'</td><td><div class="flex items-center gap-2"><img class="qr-img" alt="二维码 '+r[4]+'" src="https://api.qrserver.com/v1/create-qr-code/?size=64x64&margin=3&data='+encodeURIComponent(r[4])+'"><span class="font-mono">'+r[4]+'</span></div></td><td>'+r[5]+'</td><td><button class="text-blue-600 font-bold" onclick="toast(\'查看 '+r[0]+'\')">详情</button> <button class="text-slate-500" onclick="toast(\'编辑 '+r[0]+'\')">编辑</button></td></tr>'}).join('');document.getElementById('count').textContent='共 '+list.length+' 个库区'}function addLocation(){rows.unshift(['AQ-WH'+'X-NEW-'+(rows.length+1),'外仓 WH-A','待选择','—','待生成','草稿']);render();toast('已新增库区草稿')}q.oninput=render;warehouse.onchange=render;status.onchange=render;render();</script></body></html>
