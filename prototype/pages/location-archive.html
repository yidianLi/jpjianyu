<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础资料 · 库区档案</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #cde8f7;border-radius:8px}.field{min-height:40px;border:1px solid #9bcbe7;border-radius:8px;padding:8px 10px;font-size:12px}.qr-img{width:48px;height:48px;border:1px solid #cde8f7;border-radius:5px;background:#fff}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script></head><body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">基础资料 / <b class="text-slate-700">库区档案</b></header><main class="p-6 space-y-4"><div class="flex justify-between gap-3 flex-wrap"><div><h1 class="text-xl font-extrabold">库区档案</h1><p class="text-xs text-slate-500">按仓库和库区维护库区编码、容量、二维码及启用状态</p></div><button class="bg-blue-600 text-white rounded-lg px-4 py-2 text-xs font-bold" onclick="addLocation()">+ 新增库区</button></div><div class="card p-4"><div class="flex gap-2 flex-wrap"><input id="q" class="field w-64" placeholder="搜索：库区编码 / 库区"><select id="warehouse" class="field"><option value="">全部仓库</option><option>外仓 WH-A</option><option>内仓1 WH-B</option><option>内仓2 WH-C</option></select><select id="status" class="field"><option value="">全部状态</option><option>启用</option><option>停用</option><option>草稿</option></select><span class="flex-1"></span><span id="count" class="text-xs text-slate-400 self-center"></span></div><div class="overflow-x-auto"><table class="w-full min-w-[820px] text-xs mt-3"><thead><tr class="text-left border-b"><th class="py-2">库区编码</th><th>仓库 / 库区</th><th>容量</th><th>库区二维码</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></div></main></div></div><div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full"></div><script src="../assets/ai-gateway.js"></script>
<script>var rows=[];var OFFLINE=false;var WHNAME={};
function toast(s){var t=document.getElementById('t');t.textContent=s;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},1800)}
function whTxt(code){return (WHNAME[code]?WHNAME[code]+' ':'')+code;}
function render(){var q=document.getElementById('q').value.trim(),wh=document.getElementById('warehouse').value,st=document.getElementById('status').value,list=rows.filter(function(r){return(!q||r.join(' ').indexOf(q)>-1)&&(!wh||r[1]===wh)&&(!st||r[5]===st)});document.getElementById('body').innerHTML=list.map(function(r){return'<tr class="border-b hover:bg-blue-50"><td class="py-2 font-bold text-blue-700">'+r[0]+'</td><td>'+r[1]+' · '+r[2]+'</td><td>'+r[3]+'</td><td><div class="flex items-center gap-2"><img class="qr-img" alt="二维码 '+r[4]+'" src="https://api.qrserver.com/v1/create-qr-code/?size=64x64&margin=3&data='+encodeURIComponent(r[4])+'"><span class="font-mono">'+r[4]+'</span></div></td><td>'+r[5]+'</td><td><button class="text-blue-600 font-bold" onclick="toast(\'查看 '+r[0]+'\')">详情</button> <button class="text-slate-500" onclick="toggleLoc(\''+r[0]+'\',\''+r[5]+'\')">'+(r[5]==='启用'?'停用':'启用')+'</button></td></tr>'}).join('')||'<tr><td colspan="6" class="text-center text-slate-400 py-6">'+(OFFLINE?'后端不可达,显示离线快照':'暂无库区档案')+'</td></tr>';document.getElementById('count').textContent='共 '+list.length+' 个库区'+(OFFLINE?'（离线）':'')}
function authH(){return {'Authorization':'Bearer '+(localStorage.getItem('wms_token')||'') };}
function pull(){if(!window.WmsAi){useCache();return;}
 window.WmsAi.ready.then(function(){
  return fetch(window.WmsAi.base+'/web/masters/warehouses?page_size=100',{headers:authH()});
 }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){
  ((j&&j.data)||[]).forEach(function(w){WHNAME[w.wh_code]=w.name||'';});
  return fetch(window.WmsAi.base+'/web/masters/locations?page_size=200',{headers:authH()});
 }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){
  var data=(j&&j.data)||[];
  rows=data.map(function(x){return [x.loc_code||'',whTxt(x.wh_code||''),x.zone_label||'',x.capacity||'—',x.qr_code||x.loc_code||'',(String(x.enabled)==='0'||x.status==='停用')?'停用':'启用'];});
  OFFLINE=false;
  try{localStorage.setItem('wms_cache_locations',JSON.stringify(rows));}catch(e){}
  render();
 }).catch(function(){useCache();});}
function useCache(){try{var c=JSON.parse(localStorage.getItem('wms_cache_locations')||'[]');if(c.length){rows=c;OFFLINE=true;}}catch(e){}render();}
function addLocation(){var code='AQ-NEW-'+(rows.length+1);
 if(!window.WmsAi){toast('后端未连接,仅本地草稿');rows.unshift([code,'外仓 WH-A','待选择','—','待生成','草稿']);render();return;}
 var wh=(Object.keys(WHNAME)[0]||'WH-A');
 window.WmsAi.ready.then(function(){
  return fetch(window.WmsAi.base+'/web/masters/locations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')},body:JSON.stringify({loc_code:code,wh_code:wh})});
 }).then(function(r){return r.json().then(function(j){if(!r.ok||j.code!==200)throw new Error(j.msg||('HTTP '+r.status));return j;});}).then(function(){toast('已新增库区'+code);pull();}).catch(function(e){toast('新增失败:'+e.message+'（需管理员）',1);});}
function toggleLoc(code,status){var en=status==='启用'?0:1;
 if(!window.WmsAi){toast('后端未连接',1);return;}
 window.WmsAi.ready.then(function(){
  return fetch(window.WmsAi.base+'/web/masters/locations/'+encodeURIComponent(code)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')},body:JSON.stringify({enabled:en})});
 }).then(function(r){return r.json().then(function(j){if(!r.ok||j.code!==200)throw new Error(j.msg||('HTTP '+r.status));return j;});}).then(function(){toast(code+(en?'已启用':'已停用'));pull();}).catch(function(e){toast('改状态失败:'+e.message,1);});}
q.oninput=render;warehouse.onchange=render;status.onchange=render;pull();</script></body></html>
