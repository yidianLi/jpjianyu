<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>报表中心 · 自定义报表构建器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{font-family:"PingFang SC","Microsoft YaHei",system-ui}
.card{background:#fff;border:1px solid #e5eaf2;border-radius:14px}
.field{width:100%;min-height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font-size:12px;background:#fff}
.field:focus{outline:3px solid rgba(37,99,235,.15);border-color:#2563eb}
.btn{min-height:36px;padding:6px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:12px;font-weight:700;color:#0f172a}
.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border:1px solid #e2e8f0;border-radius:8px}
.chk.on{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
table.grid{width:100%;font-size:12px;border-collapse:collapse}
table.grid th,table.grid td{border-bottom:1px solid #eef2f7;padding:6px 8px;text-align:left}
table.grid th{color:#64748b;font-weight:600;background:#f8fafc}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px}
</style>
<script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script>
</head>
<body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside>
<div class="flex-1 min-w-0"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">报表中心 / <b class="text-slate-700">自定义报表构建器</b><span class="ml-2 bg-blue-50 text-blue-700 px-2 py-1 rounded">选维度+指标+筛选+期间 · 白名单受控聚合 · 只读不改账</span></header>
<main class="p-6 space-y-4">
  <div class="flex justify-between items-center flex-wrap gap-3">
    <div><h1 class="text-xl font-extrabold">自定义报表</h1><p class="text-xs text-slate-500 mt-1">从库存现存 / 出入流水两类白名单数据源自由组合维度与指标，保存后可反复运行、生成报表实例</p></div>
    <div class="flex gap-2"><button type="button" id="refresh" class="btn">刷新</button><button type="button" id="newRpt" class="btn primary"><i class="fa-solid fa-plus mr-1"></i>新建自定义报表</button></div>
  </div>
  <div class="card p-4">
    <b class="text-sm">已保存的自定义报表 <span id="cnt" class="text-xs text-slate-400 font-normal"></span></b>
    <div class="overflow-x-auto"><table class="grid min-w-[860px] mt-2"><thead><tr><th>报表编码 / 名称</th><th>数据源</th><th>维度</th><th>指标</th><th>筛选</th><th>操作</th></tr></thead><tbody id="list"></tbody></table></div>
    <div id="empty" class="hidden py-8 text-center text-xs text-slate-400">还没有自定义报表，点右上角「新建自定义报表」开始配置</div>
  </div>
  <div class="card p-4">
    <b class="text-sm">运行结果</b>
    <div id="resMeta" class="text-xs text-slate-500 mt-1"></div>
    <div class="overflow-x-auto mt-2"><table class="grid min-w-[520px]" id="resTable"></table></div>
    <div id="resEmpty" class="py-6 text-center text-xs text-slate-400">暂无运行结果</div>
  </div>
</main></div></div>

<div id="dlg" class="hidden fixed inset-0 bg-black/40 flex items-start justify-center z-50 overflow-y-auto p-6">
 <div class="card w-[min(860px,100%)] p-5 mt-6">
  <div class="flex justify-between items-start"><div><h2 class="text-base font-extrabold" id="dlgTitle">新建自定义报表</h2><p class="text-[11px] text-slate-500 mt-1">维度=分组字段，指标=聚合列；聚合函数：求和/平均/最大/最小/计数</p></div>
  <button type="button" id="close" class="btn">关闭</button></div>
  <div class="grid grid-cols-2 gap-3 mt-3">
    <label class="text-xs font-semibold text-slate-600">报表名称*<input id="fName" class="field mt-1" placeholder="例如：外仓收发存按物料汇总"></label>
    <label class="text-xs font-semibold text-slate-600">数据源*<select id="fDataset" class="field mt-1"></select></label>
  </div>
  <div class="grid grid-cols-2 gap-3 mt-3">
    <div><div class="text-xs font-semibold text-slate-600 mb-1">维度（分组，可多选）</div><div id="dims" class="grid grid-cols-2 gap-1"></div></div>
    <div><div class="text-xs font-semibold text-slate-600 mb-1">指标（聚合，至少 1 个）</div><div id="mes" class="grid grid-cols-1 gap-1"></div></div>
  </div>
  <div class="grid grid-cols-3 gap-3 mt-3">
    <label class="text-xs font-semibold text-slate-600">仓库（逗号分隔，空=全部）<input id="fWh" class="field mt-1" placeholder="WH-A,WH-B"></label>
    <label class="text-xs font-semibold text-slate-600">物料编码关键字<input id="fMat" class="field mt-1" placeholder="留空=全部"></label>
    <label class="text-xs font-semibold text-slate-600">期间起<input id="fStart" type="date" class="field mt-1"></label>
    <label class="text-xs font-semibold text-slate-600">期间止<input id="fEnd" type="date" class="field mt-1"></label>
  </div>
  <p id="err" class="mt-2 min-h-4 text-xs text-red-600"></p>
  <div class="flex justify-end gap-2 mt-3"><button type="button" id="prev" class="btn">预览运行</button><button type="button" id="save" class="btn primary">保存报表</button></div>
 </div>
</div>
<div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full"></div>
<script>
(function(){
var META={}, LIST=[], EDIT=null;
function base(){ if(window.WmsAi&&window.WmsAi.base) return window.WmsAi.base; return localStorage.getItem('wms_api_base')||(location.protocol+'//'+location.host+'/api/v1'); }
function token(){ return localStorage.getItem('wms_token')||''; }
function api(path,opt){ opt=opt||{}; opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token()},opt.headers||{}); return fetch(base()+path,opt).then(function(r){ return r.json().then(function(j){ if(j.code!==200) throw new Error(j.msg||('HTTP '+r.status)); return j.data; }); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,e){ var t=document.getElementById('t'); t.textContent=m; t.style.background=e?'#dc2626':'#0f172a'; t.classList.remove('hidden'); clearTimeout(t.timer); t.timer=setTimeout(function(){t.classList.add('hidden')},2400); }
function dsDef(){ return META[document.getElementById('fDataset').value]||{dims:{},measures:{},has_date:false}; }
function renderDims(){
  var d=dsDef(), box=document.getElementById('dims'), keys=Object.keys(d.dims||{});
  if(!keys.length){ box.innerHTML='<div class="text-[11px] text-slate-400">该数据源无分组维度</div>'; return; }
  box.innerHTML=keys.map(function(k){ var on=(EDIT&&EDIT.defn&&EDIT.defn.dims||[]).indexOf(k)>=0?' on':''; return '<label class="chk'+on+'"><input type="checkbox" data-dim="'+esc(k)+'"'+(on?' checked':'')+'>'+esc(d.dims[k])+'</label>'; }).join('');
}
function renderMes(){
  var d=dsDef(), box=document.getElementById('mes'), keys=Object.keys(d.measures||{});
  var saved={}; ((EDIT&&EDIT.defn&&EDIT.defn.measures)||[]).forEach(function(m){ saved[m.col]=m.fn; });
  var html=keys.map(function(k){ var fn=saved[k]||'SUM'; return '<label class="chk"><input type="checkbox" data-mcol="'+esc(k)+'"'+(saved[k]?' checked':'')+'><span>'+esc(d.measures[k])+'</span><select data-mfn="'+esc(k)+'" class="ml-auto border rounded px-1 py-0.5 text-[11px]"><option value="SUM"'+(fn==='SUM'?' selected':'')+'>求和</option><option value="AVG"'+(fn==='AVG'?' selected':'')+'>平均</option><option value="MAX"'+(fn==='MAX'?' selected':'')+'>最大</option><option value="MIN"'+(fn==='MIN'?' selected':'')+'>最小</option></select></label>'; }).join('');
  var hasCount=(EDIT&&EDIT.defn&&EDIT.defn.measures||[]).some(function(m){return m.fn==='COUNT';});
  html+='<label class="chk'+(hasCount?' on':'')+'"><input type="checkbox" data-mcol="*"'+(hasCount?' checked':'')+'><span>记录笔数(COUNT)</span></label>';
  box.innerHTML=html;
}
function collect(){
  var dims=[]; document.querySelectorAll('#dims input[data-dim]').forEach(function(c){ if(c.checked) dims.push(c.dataset.dim); });
  var measures=[]; document.querySelectorAll('#mes input[data-mcol]').forEach(function(c){
    if(!c.checked) return; var col=c.dataset.mcol;
    if(col==='*'){ measures.push({fn:'COUNT',col:'*',label:'笔数'}); return; }
    var sel=document.querySelector('#mes select[data-mfn="'+col+'"]');
    measures.push({fn:sel?sel.value:'SUM',col:col,label:(dsDef().measures||{})[col]||col});
  });
  return { dataset:document.getElementById('fDataset').value, dims:dims, measures:measures,
    filters:{wh:(document.getElementById('fWh').value||'').split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean), material_code:(document.getElementById('fMat').value||'').trim()},
    start:document.getElementById('fStart').value||'', end:document.getElementById('fEnd').value||'' };
}
function showResult(data,title){
  var meta=document.getElementById('resMeta');
  document.getElementById('resEmpty').classList.toggle('hidden',!!(data&&data.rows&&data.rows.length));
  var tb=document.getElementById('resTable');
  if(!data||!data.rows||!data.rows.length){ tb.innerHTML=''; meta.textContent=title||''; return; }
  meta.textContent=(title||'')+' · 共 '+data.count+' 行';
  tb.innerHTML='<thead><tr>'+data.head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
    data.rows.map(function(r){ return '<tr>'+data.head.map(function(h){return '<td>'+esc(r[h])+'</td>';}).join('')+'</tr>'; }).join('')+'</tbody>';
}
function openDlg(rec){
  EDIT=rec||null;
  document.getElementById('dlgTitle').textContent=rec?('编辑：'+rec.name):'新建自定义报表';
  document.getElementById('fName').value=rec?rec.name:'';
  document.getElementById('fDataset').value=rec?rec.dataset:(Object.keys(META)[0]||'onhand');
  document.getElementById('fWh').value=rec&&rec.defn?(rec.defn.filters.wh||[]).join(','):'';
  document.getElementById('fMat').value=rec&&rec.defn?(rec.defn.filters.material_code||''):'';
  document.getElementById('fStart').value=rec&&rec.defn?(rec.defn.start||''):'';
  document.getElementById('fEnd').value=rec&&rec.defn?(rec.defn.end||''):'';
  document.getElementById('err').textContent='';
  renderDims(); renderMes();
  document.getElementById('dlg').classList.remove('hidden');
}
function closeDlg(){ document.getElementById('dlg').classList.add('hidden'); EDIT=null; }
function renderList(){
  var tb=document.getElementById('list');
  document.getElementById('cnt').textContent='共 '+LIST.length+' 个';
  document.getElementById('empty').classList.toggle('hidden',LIST.length>0);
  tb.innerHTML=LIST.map(function(r){
    var dn=(META[r.dataset]&&META[r.dataset].label)||r.dataset;
    var dims=((r.defn&&r.defn.dims)||[]).map(function(k){return (META[r.dataset]&&META[r.dataset].dims||{})[k]||k;}).join('、')||'—';
    var mes=((r.defn&&r.defn.measures)||[]).map(function(m){return m.label;}).join('、')||'—';
    var f=r.defn&&r.defn.filters||{}; var fs=[]; if((f.wh||[]).length) fs.push('仓库:'+f.wh.join('/')); if(f.material_code) fs.push('物料~'+f.material_code); if(r.defn&&r.defn.start) fs.push(r.defn.start+'~'+(r.defn.end||'今'));
    return '<tr class="hover:bg-blue-50"><td class="py-2"><b class="text-blue-700">'+esc(r.rpt_code)+'</b><br>'+esc(r.name)+'</td><td><span class="badge">'+esc(dn)+'</span></td><td>'+esc(dims)+'</td><td>'+esc(mes)+'</td><td>'+esc(fs.join(' · ')||'全部')+'</td>'+
      '<td class="whitespace-nowrap"><button type="button" class="text-blue-600 font-bold" data-run="'+esc(r.rpt_code)+'">运行</button> <button type="button" class="text-slate-600" data-edit="'+esc(r.rpt_code)+'">编辑</button> <button type="button" class="text-emerald-700" data-gen="'+esc(r.rpt_code)+'">生成实例</button> <button type="button" class="text-red-500" data-del="'+esc(r.rpt_code)+'">删除</button></td></tr>';
  }).join('');
  tb.querySelectorAll('[data-run]').forEach(function(b){ b.addEventListener('click',function(){ runSaved(b.dataset.run); }); });
  tb.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click',function(){ var rec=LIST.filter(function(x){return x.rpt_code===b.dataset.edit;})[0]; if(rec) openDlg(rec); }); });
  tb.querySelectorAll('[data-gen]').forEach(function(b){ b.addEventListener('click',function(){ genSaved(b.dataset.gen); }); });
  tb.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(){ delSaved(b.dataset.del); }); });
}
function loadMeta(){ return api('/web/custom_reports/meta').then(function(d){ META=d||{}; var sel=document.getElementById('fDataset'); sel.innerHTML=Object.keys(META).map(function(k){return '<option value="'+esc(k)+'">'+esc(META[k].label)+'</option>';}).join(''); }); }
function loadList(){ return api('/web/custom_reports').then(function(d){ LIST=d||[]; renderList(); }); }
function runSaved(code){ api('/web/custom_reports/'+encodeURIComponent(code)+'/run').then(function(d){ showResult(d,code); }).catch(function(e){ toast('运行失败:'+e.message,true); }); }
function genSaved(code){ api('/web/custom_reports/'+encodeURIComponent(code)+'/generate',{method:'POST',body:JSON.stringify({period:''})}).then(function(d){ toast('已生成报表实例 '+d.rpt_no+'（'+d.rows+' 行），状态：草稿'); }).catch(function(e){ toast('生成失败:'+e.message,true); }); }
function delSaved(code){ if(!confirm('删除自定义报表 '+code+' ?')) return; api('/web/custom_reports/'+encodeURIComponent(code),{method:'DELETE'}).then(function(){ toast('已删除'); loadList(); }).catch(function(e){ toast('删除失败:'+e.message,true); }); }
function doPreview(){
  var defn=collect(), err=document.getElementById('err');
  err.textContent='';
  if(!defn.measures.length){ err.textContent='请至少勾选一个指标'; return; }
  api('/web/custom_reports/run',{method:'POST',body:JSON.stringify({defn:defn})}).then(function(d){ showResult(d,'预览'); toast('预览完成 '+d.count+' 行'); }).catch(function(e){ err.textContent=e.message; });
}
function doSave(){
  var name=(document.getElementById('fName').value||'').trim(), err=document.getElementById('err');
  err.textContent='';
  if(!name){ err.textContent='请填写报表名称'; return; }
  var defn=collect();
  if(!defn.measures.length){ err.textContent='请至少勾选一个指标'; return; }
  var body={name:name,defn:defn}, p, method;
  if(EDIT){ p='/web/custom_reports/'+encodeURIComponent(EDIT.rpt_code); method='PUT'; }
  else { p='/web/custom_reports'; method='POST'; }
  api(p,{method:method,body:JSON.stringify(body)}).then(function(){ toast(EDIT?'已保存修改':'已保存自定义报表'); closeDlg(); loadList(); }).catch(function(e){ err.textContent=e.message; });
}
document.getElementById('fDataset').addEventListener('change',function(){ renderDims(); renderMes(); });
document.getElementById('newRpt').addEventListener('click',function(){ if(!Object.keys(META).length){ toast('后端未连接',true); return; } openDlg(null); });
document.getElementById('refresh').addEventListener('click',function(){ loadMeta().then(loadList); });
document.getElementById('close').addEventListener('click',closeDlg);
document.getElementById('prev').addEventListener('click',doPreview);
document.getElementById('save').addEventListener('click',doSave);
loadMeta().then(loadList).catch(function(e){ toast('加载失败:'+e.message,true); });
})();
</script></body></html>
