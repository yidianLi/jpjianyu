<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>报表中心 · 报表配置</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{font-family:"PingFang SC","Microsoft YaHei",system-ui}.card{background:#fff;border:1px solid #cde8f7;border-radius:8px}.field{width:100%;min-height:40px;border:1px solid #9bcbe7;border-radius:8px;padding:8px 10px;background:#fff;font-size:12px}.field:focus{outline:3px solid rgba(22,137,232,.18);border-color:#1689e8}.config-dialog{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(15,55,86,.38)}.config-dialog[hidden]{display:none}.config-panel{width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:10px;background:#f8fdff;box-shadow:0 24px 70px rgba(16,76,116,.25)}.config-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #cde8f7;background:rgba(248,253,255,.97)}.config-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field{display:grid;gap:5px;font-size:11px;font-weight:600;color:#4e7da1}.form-field.full{grid-column:1/-1}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice label{display:flex;align-items:center;gap:8px;min-height:44px;padding:9px 11px;border:1px solid #cde8f7;border-radius:8px;background:#fff;color:#16456f}.preview-sheet{border:1px solid #cde8f7;border-radius:8px;background:#fff;overflow:hidden}.preview-title{padding:14px 16px;background:#eaf7ff;border-bottom:1px solid #cde8f7}.preview-grid{display:grid;grid-template-columns:140px 1fr}.preview-grid dt,.preview-grid dd{margin:0;padding:10px 14px;border-bottom:1px solid #edf4f8;font-size:12px}.preview-grid dt{color:#648eaa;background:#fbfdff}.preview-grid dd{color:#16456f;font-weight:600}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{min-height:40px;padding:8px 14px;border:1px solid #cde8f7;border-radius:8px;background:#fff;color:#16456f;font-size:12px;font-weight:700}.btn.primary{border-color:#1689e8;background:#1689e8;color:#fff}.status{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px}.status.on{background:#dcfce7;color:#166534}.status.draft{background:#fef3c7;color:#92400e}@media(max-width:680px){.form-grid,.choice{grid-template-columns:1fr}.form-field.full{grid-column:auto}.preview-grid{grid-template-columns:1fr}.preview-grid dt{padding-bottom:2px;border-bottom:0}.preview-grid dd{padding-top:2px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}}
</style>
<script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/nav.js"></script>
</head>
<body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1 min-w-0"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">报表中心 / <b class="text-slate-700">报表配置</b></header>
<main class="p-6 space-y-4">
<div class="flex justify-between items-start flex-wrap gap-3"><div><h1 class="text-xl font-extrabold">报表配置工单</h1></div><button type="button" id="newConfig" class="btn primary"><i class="fa-solid fa-plus mr-1" aria-hidden="true"></i>新建报表配置</button></div>
<div class="card p-4"><div class="flex gap-2 text-xs flex-wrap"><input id="search" class="field max-w-72" placeholder="搜索：配置编号 / 报表名称"><select id="typeFilter" class="field max-w-36"><option value="">全部生成方式</option><option>自动</option><option>手动</option></select><select id="statusFilter" class="field max-w-36"><option value="">全部状态</option><option>已启用</option><option>草稿</option></select><span class="flex-1"></span><span id="count" class="self-center text-slate-400">共 4 项配置</span></div>
<div class="overflow-x-auto"><table class="w-full min-w-[900px] text-xs mt-3"><thead><tr class="text-left border-b"><th class="py-2">配置编号 / 报表名称</th><th>生成方式</th><th>生成条件</th><th>报表说明</th><th>状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody id="configBody"></tbody></table></div><div id="empty" class="hidden py-8 text-center text-xs text-slate-400">暂无匹配的报表配置</div></div>
</main></div></div>
<div id="configDialog" class="config-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="config-panel"><div class="config-head"><div><h2 id="dialogTitle" class="text-base font-bold text-[#16456f]">新建报表配置</h2><p id="dialogHint" class="mt-1 text-xs text-slate-500">填写配置后先预览，确认无误再创建</p></div><button type="button" id="closeDialog" class="btn" aria-label="关闭">关闭</button></div><div class="config-body">
<form id="configForm"><div class="form-grid"><label class="form-field">报表名称*<input id="reportName" class="field" placeholder="例如：外仓每日收发存日报"></label><label class="form-field">报表分类*<select id="reportCategory" class="field"><option>收发存汇总</option><option>客户物料余额</option><option>车间领退料流水</option><option>库存差异</option><option>库龄与呆滞</option><option>成品输出数量</option></select></label><fieldset class="form-field full"><legend>生成方式*</legend><div class="choice"><label><input type="radio" name="mode" value="自动" checked>自动生成</label><label><input type="radio" name="mode" value="手动">手动生成</label></div></fieldset><div id="autoConditions" class="form-field full"><span>自动生成条件*</span><div class="form-grid"><label class="form-field">生成周期<select id="cycle" class="field"><option>日报</option><option>周报</option><option>月报</option></select></label><label class="form-field">生成时间<input id="runTime" type="time" class="field" value="06:00"></label><label class="form-field">客户范围<select id="customer" class="field"><option>全部客户</option><option>恒达服饰</option><option>宏远纺织</option></select></label><label class="form-field">仓库范围<select id="warehouse" class="field"><option>全部仓库</option><option>外仓 WH-A</option><option>内仓1 WH-B</option><option>内仓2 WH-C</option></select></label></div></div><label class="form-field full">报表说明*<textarea id="description" class="field min-h-24" placeholder="说明报表用途、主要字段和统计口径"></textarea></label><label class="form-field full">参考内容<textarea id="reference" class="field min-h-20" placeholder="可填写参考报表名称、字段结构、统计规则或样例说明"></textarea></label></div><p id="formError" class="mt-3 min-h-5 text-xs text-red-600" role="alert"></p><div class="actions"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">预览配置</button></div></form>
<section id="preview" hidden><div class="preview-sheet"><div class="preview-title"><b id="previewName">报表配置预览</b><div class="mt-1 text-[11px] text-slate-500">此预览展示配置规则，不生成正式报表数据</div></div><dl class="preview-grid" id="previewFields"></dl></div><div class="mt-3 rounded-lg border border-blue-100 bg-blue-50 p-3 text-xs text-blue-700">确认创建后，该配置会进入工单列表；自动报表将按设定条件生成，手动报表由用户按需触发。</div><div class="actions"><button type="button" id="editConfig" class="btn">返回修改</button><button type="button" id="confirmConfig" class="btn primary">确认并新建</button></div></section>
</div></div></div>
<div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full" role="status" aria-live="polite"></div>
<script>
(function(){
var configs=[
['RP-CFG-001','每日收发存日报','自动','日报 · 06:00 · 全部客户 · 全部仓库','汇总每日入库、出库和结存','已启用','09-12 08:30'],
['RP-CFG-002','客户物料余额月报','自动','月报 · 次月1日 06:00 · 全部客户','按客户和物料单位统计月末余额','已启用','09-10 14:20'],
['RP-CFG-003','库存差异复核表','手动','按需生成','用于盘点差异复核与审计留档','已启用','09-09 16:40'],
['RP-CFG-004','成品输出分析','手动','按需生成','按客户、车间和成品分类查看输出量','草稿','09-08 10:15']
];
var dialog=document.getElementById('configDialog'),form=document.getElementById('configForm'),preview=document.getElementById('preview'),lastFocus=null,draft=null;
function esc(value){return String(value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function toast(msg){var t=document.getElementById('t');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t.timer);t.timer=setTimeout(function(){t.classList.add('hidden')},2200);}
function render(){var q=document.getElementById('search').value.trim().toLowerCase(),type=document.getElementById('typeFilter').value,status=document.getElementById('statusFilter').value;var rows=configs.filter(function(row){return (!q||row.join(' ').toLowerCase().indexOf(q)>-1)&&(!type||row[2]===type)&&(!status||row[5]===status);});document.getElementById('configBody').innerHTML=rows.map(function(row){return '<tr class="border-b hover:bg-blue-50"><td class="py-2"><b class="text-blue-700">'+esc(row[0])+'</b><br>'+esc(row[1])+'</td><td>'+esc(row[2])+'</td><td>'+esc(row[3])+'</td><td class="max-w-64">'+esc(row[4])+'</td><td><span class="status '+(row[5]==='已启用'?'on':'draft')+'">'+row[5]+'</span></td><td class="text-slate-400">'+row[6]+'</td><td><button type="button" class="text-blue-600 font-bold" data-preview="'+row[0]+'">预览</button> <button type="button" class="text-slate-500" data-edit="'+row[0]+'">修改</button></td></tr>';}).join('');document.getElementById('count').textContent='共 '+rows.length+' 项配置';document.getElementById('empty').classList.toggle('hidden',rows.length>0);document.querySelectorAll('[data-preview]').forEach(function(button){button.addEventListener('click',function(){toast('已打开 '+button.dataset.preview+' 配置预览');});});document.querySelectorAll('[data-edit]').forEach(function(button){button.addEventListener('click',function(){toast('已打开 '+button.dataset.edit+' 修改页面');});});}
function mode(){return form.querySelector('[name="mode"]:checked').value;}
function syncMode(){document.getElementById('autoConditions').hidden=mode()!=='自动';}
function open(){lastFocus=document.activeElement;form.reset();form.querySelector('[name="mode"][value="自动"]').checked=true;document.getElementById('runTime').value='06:00';document.getElementById('formError').textContent='';form.hidden=false;preview.hidden=true;syncMode();dialog.hidden=false;document.body.style.overflow='hidden';setTimeout(function(){document.getElementById('reportName').focus()},0);}
function close(){dialog.hidden=true;document.body.style.overflow='';if(lastFocus)lastFocus.focus();}
function collect(){var auto=mode()==='自动';return {name:document.getElementById('reportName').value.trim(),category:document.getElementById('reportCategory').value,mode:mode(),condition:auto?[document.getElementById('cycle').value,document.getElementById('runTime').value,document.getElementById('customer').value,document.getElementById('warehouse').value].join(' · '):'按需生成',description:document.getElementById('description').value.trim(),reference:document.getElementById('reference').value.trim()||'未填写参考'};}
form.addEventListener('submit',function(event){event.preventDefault();draft=collect();if(!draft.name||!draft.description){document.getElementById('formError').textContent='请填写报表名称和报表说明。';(!draft.name?document.getElementById('reportName'):document.getElementById('description')).focus();return;}document.getElementById('previewName').textContent=draft.name+' · 配置预览';document.getElementById('previewFields').innerHTML=[['报表分类',draft.category],['生成方式',draft.mode],['生成条件',draft.condition],['报表说明',draft.description],['参考内容',draft.reference]].map(function(item){return '<dt>'+esc(item[0])+'</dt><dd>'+esc(item[1])+'</dd>';}).join('');form.hidden=true;preview.hidden=false;document.getElementById('editConfig').focus();});
document.getElementById('confirmConfig').addEventListener('click',function(){if(!draft)return;var now=new Date(),id='RP-CFG-'+String(configs.length+1).padStart(3,'0'),time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');configs.unshift([id,draft.name,draft.mode,draft.condition,draft.description,'已启用','今日 '+time]);render();close();toast('报表配置 '+id+' 已创建');});
document.getElementById('editConfig').addEventListener('click',function(){preview.hidden=true;form.hidden=false;document.getElementById('reportName').focus();});
document.getElementById('newConfig').addEventListener('click',open);document.getElementById('closeDialog').addEventListener('click',close);document.querySelector('[data-close]').addEventListener('click',close);dialog.addEventListener('click',function(event){if(event.target===dialog)close();});document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!dialog.hidden)close();});form.querySelectorAll('[name="mode"]').forEach(function(control){control.addEventListener('change',syncMode);});['search','typeFilter','statusFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',render);document.getElementById(id).addEventListener('change',render);});render();
})();
</script></body></html>
