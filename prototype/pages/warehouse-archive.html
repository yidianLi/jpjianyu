<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础资料 · 仓库档案</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #cde8f7;border-radius:8px}.field{min-height:40px;border:1px solid #9bcbe7;border-radius:8px;padding:8px 10px;font-size:12px}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script></head><body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">基础资料 / <b class="text-slate-700">仓库档案</b></header><main class="p-6 space-y-4"><div class="flex justify-between gap-3 flex-wrap"><div><h1 class="text-xl font-extrabold">仓库档案</h1><p class="text-xs text-slate-500">维护仓库编码、名称、类型、负责人和启用状态</p></div><button class="bg-blue-600 text-white rounded-lg px-4 py-2 text-xs font-bold" onclick="addWarehouse()">+ 新增仓库</button></div><div class="card p-4"><div class="flex gap-2 flex-wrap"><input id="q" class="field w-64" placeholder="搜索：仓库编码 / 名称"><select id="status" class="field"><option value="">全部状态</option><option>启用</option><option>停用</option><option>草稿</option></select><span class="flex-1"></span><span id="count" class="text-xs text-slate-400 self-center"></span></div><div class="overflow-x-auto"><table class="w-full min-w-[760px] text-xs mt-3"><thead><tr class="text-left border-b"><th class="py-2">编码 / 名称</th><th>仓库类型</th><th>库区 / 库区</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></div></main></div></div><div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full"></div><script src="../assets/ai-gateway.js"></script>
<script>var rows=[];var OFFLINE=false;
function toast(s){var t=document.getElementById('t');t.textContent=s;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},1800)}
function render(){var q=document.getElementById('q').value.trim(),st=document.getElementById('status').value,list=rows.filter(function(r){return(!q||r.join(' ').indexOf(q)>-1)&&(!st||r[5]===st)});document.getElementById('body').innerHTML=list.map(function(r){return'<tr class="border-b hover:bg-blue-50"><td class="py-2"><b class="text-blue-700">'+r[0]+'</b> · '+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td><button class="text-blue-600 font-bold" onclick="toast(\'查看 '+r[0]+'\')">详情</button> <button class="text-slate-500" onclick="toggleWh(\''+r[0]+'\',\''+r[5]+'\')">'+(r[5]==='启用'?'停用':'启用')+'</button></td></tr>'}).join('')||'<tr><td colspan="6" class="text-center text-slate-400 py-6">'+(OFFLINE?'后端不可达,显示离线快照':'暂无仓库档案')+'</td></tr>';document.getElementById('count').textContent='共 '+list.length+' 个仓库'+(OFFLINE?'（离线）':'')}
function kindTxt(x){return (x.wh_type||'')+(x.stock_kind?' · '+x.stock_kind:'')}
function pull(){if(!window.WmsAi){useCache();return;}
 window.WmsAi.ready.then(function(){
  return fetch(window.WmsAi.base+'/web/masters/warehouses',{headers:{'Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')}});
 }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){
  var data=(j&&j.data)||[];
  rows=data.map(function(x){return [x.wh_code||'',x.name||'',kindTxt(x),'—',x.manager||'',(String(x.enabled)==='0'||x.status==='停用')?'停用':'启用'];});
  OFFLINE=false;
  try{localStorage.setItem('wms_cache_warehouses',JSON.stringify(rows));}catch(e){}
  render();
 }).catch(function(){useCache();});}
function useCache(){try{var c=JSON.parse(localStorage.getItem('wms_cache_warehouses')||'[]');if(c.length){rows=c;OFFLINE=true;}}catch(e){}render();}
function addWarehouse(){var code='WH-'+String.fromCharCode(65+rows.length),name='新建仓库';
 if(!window.WmsAi){toast('后端未连接,仅本地草稿');rows.unshift([code,name,'待选择','—','待填写','草稿']);render();return;}
 window.WmsAi.ready.then(function(){
  return fetch(window.WmsAi.base+'/web/masters/warehouses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')},body:JSON.stringify({wh_code:code,name:name})});
 }).then(function(r){return r.json().then(function(j){if(!r.ok||j.code!==200)throw new Error(j.msg||('HTTP '+r.status));return j;});}).then(function(){toast('已新增仓库'+code);pull();}).catch(function(e){toast('新增失败:'+e.message+'（需管理员）',1);});}
function toggleWh(code,status){var en=status==='启用'?0:1;
 if(!window.WmsAi){toast('后端未连接',1);return;}
 window.WmsAi.ready.then(function(){
  return fetch(window.WmsAi.base+'/web/masters/warehouses/'+encodeURIComponent(code)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')},body:JSON.stringify({enabled:en})});
 }).then(function(r){return r.json().then(function(j){if(!r.ok||j.code!==200)throw new Error(j.msg||('HTTP '+r.status));return j;});}).then(function(){toast(code+(en?'已启用':'已停用'));pull();}).catch(function(e){toast('改状态失败:'+e.message,1);});}
q.oninput=render;status.onchange=render;pull();</script></body></html>
