<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单据中心 · 设备扫码记录</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #e5eaf2;border-radius:14px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700}.tag-scan{background:#dcfce7;color:#047857}.tag-mobile{background:#e0e7ff;color:#4338ca}.tag-ok{background:#dcfce7;color:#047857}.tag-warn{background:#fef3c7;color:#b45309}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script></head><body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1 min-w-0"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">单据中心 / <b class="text-slate-700">设备扫码记录</b><span class="ml-2 bg-blue-50 text-blue-700 px-2 py-1 rounded">移动端扫码自动留痕 · 不直接修改库存</span></header><main class="p-6 space-y-4"><div class="flex justify-between items-center flex-wrap gap-2"><div><h1 class="text-xl font-extrabold">设备扫码记录</h1><p class="text-xs text-slate-500">查看 PDA、移动扫码设备产生的物料箱贴、库区码和单据码记录。</p></div><button type="button" onclick="toast('扫码记录已导出')" class="px-3 py-2 bg-white border rounded-lg text-xs">导出记录</button></div><section class="card p-4"><div class="flex gap-2 text-xs flex-wrap"><input id="scanSearch" placeholder="搜索：记录号 / 箱码 / 单号 / 物料" class="border rounded-lg px-3 py-2 w-72" oninput="filterScanLog()"><select id="scanTarget" class="border rounded-lg px-2 py-2" onchange="filterScanLog()"><option value="">全部扫码对象</option><option>物料箱贴</option><option>送货单</option><option>库区码</option></select><select id="scanResult" class="border rounded-lg px-2 py-2" onchange="filterScanLog()"><option value="">全部结果</option><option>识别成功</option><option>待复核</option><option>重复扫码</option></select><span id="scanCount" class="text-slate-400 self-center"></span></div><div class="overflow-x-auto"><table class="w-full text-xs mt-3 min-w-[900px]"><thead><tr class="text-slate-400 text-left border-b"><th class="py-2">记录号</th><th>扫码对象</th><th>来源设备</th><th>码值/关联内容</th><th>操作人</th><th>结果</th><th>时间</th><th>操作</th></tr></thead><tbody id="scanBody"><tr><td colspan="5" class="text-center text-slate-400 py-6">加载中…</td></tr></tbody></table></div><div id="scanEmpty" class="hidden text-center text-slate-400 text-xs py-8">暂无匹配扫码记录</div></section></main></div></div><div id="scanToast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full"></div><script>function toast(t){var d=document.getElementById('scanToast');d.textContent=t;d.classList.remove('hidden');clearTimeout(d._t);d._t=setTimeout(function(){d.classList.add('hidden')},2200)}function filterScanLog(){var q=(document.getElementById('scanSearch').value||'').trim().toLowerCase(),target=document.getElementById('scanTarget').value,result=document.getElementById('scanResult').value,rows=[].slice.call(document.querySelectorAll('#scanBody tr')),vis=0;rows.forEach(function(r){var ok=(!q||r.innerText.toLowerCase().indexOf(q)>-1)&&(!target||r.dataset.target===target)&&(!result||r.dataset.result===result);r.style.display=ok?'':'none';if(ok)vis++});document.getElementById('scanCount').textContent='共 '+vis+' 条记录';document.getElementById('scanEmpty').classList.toggle('hidden',vis>0)}function viewScan(btn){var row=btn.closest('tr');toast('扫码详情：'+row.cells[0].textContent.trim()+' · '+row.cells[3].textContent.trim())}filterScanLog();</script>
<script src="../assets/ai-gateway.js"></script>
<script>
/* 扫码真数据:拉scan_logs重建#scanBody,原筛选照用data属性,无数据保留静态 */
document.addEventListener('DOMContentLoaded', function(){
  if(!window.WmsAi) return;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  window.WmsAi.ready.then(function(){
    return fetch(window.WmsAi.base + '/system/scan_logs?page_size=100',
      {headers: {'Authorization': 'Bearer ' + (localStorage.getItem('wms_token') || '')}});
  }).then(function(r){ if(!r.ok) throw new Error('no backend'); return r.json(); })
  .then(function(j){
    var rows = (j && j.data) || [];
    if(!rows.length){var tb0=document.getElementById('scanBody');if(tb0)tb0.innerHTML='<tr><td colspan="5" class="text-center text-slate-400 py-6">暂无数据</td></tr>';return;}
    var tb = document.getElementById('scanBody');
    if(!tb) return;
    tb.innerHTML = rows.map(function(x){
      var at = String(x.at || '');
      return '<tr data-target="后端" data-result="' + esc(x.result) + '">'
        + '<td class="py-2 font-bold text-blue-700">SCAN' + esc(x.id) + '</td>'
        + '<td><span class="tag tag-scan">' + esc(x.doc_no || '扫码') + '</span></td>'
        + '<td>' + esc(x.device || '') + '</td>'
        + '<td>' + esc(x.code || '') + '</td>'
        + '<td>' + esc(x.by_user || '') + '</td>'
        + '<td><span class="tag tag-ok">' + esc(x.result || '') + '</span></td>'
        + '<td class="text-slate-400">' + esc(at.slice(5, 16).replace('T', ' ')) + '</td>'
        + '<td><button class="text-blue-600 font-bold" onclick="viewScan(this)">查看</button></td></tr>';
    }).join('');
    if(typeof filterScanLog === 'function') filterScanLog();
  }).catch(function(){var tb=document.getElementById('scanBody');if(tb)tb.innerHTML='<tr><td colspan="5" class="text-center text-slate-400 py-6">后端不可达</td></tr>';});
});
</script></body></html>
