<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>报表中心 · 打印模板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{font-family:"PingFang SC","Microsoft YaHei",system-ui}
.card{background:#fff;border:1px solid #cde8f7;border-radius:10px}
.field{width:100%;min-height:38px;border:1px solid #9bcbe7;border-radius:8px;padding:7px 10px;font-size:12px}
.field:focus{outline:3px solid rgba(22,137,232,.18);border-color:#1689e8}
.tpl.on{background:#eaf7ff;border-color:#1689e8}
.colrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #e2eef7;border-radius:8px;font-size:12px}
.colrow input[type=checkbox]{width:16px;height:16px}
.btn{min-height:36px;padding:7px 13px;border:1px solid #cde8f7;border-radius:8px;background:#fff;color:#16456f;font-size:12px;font-weight:700}
.btn.primary{border-color:#1689e8;background:#1689e8;color:#fff}
.btn.danger{color:#b91c1c;border-color:#fecaca}
table.pv{width:100%;border-collapse:collapse;font-size:12px}
table.pv th,table.pv td{border:1px solid #cde8f7;padding:6px 8px;text-align:left}
table.pv th{background:#eaf7ff;color:#16456f}
</style>
<script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/nav.js"></script><script src="../assets/ai-gateway.js"></script>
</head>
<body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside>
<div class="flex-1 min-w-0"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">报表中心 / <b class="text-slate-700">打印模板</b> <span class="ml-2 bg-blue-50 text-blue-700 px-2 py-1 rounded">打印报表可自定义修改 · 支持新增格式</span></header>
<main class="p-6 space-y-4">
<div class="flex justify-between items-center flex-wrap gap-3"><h1 class="text-xl font-extrabold">打印报表模板</h1><button class="btn primary" id="newTpl"><i class="fa-solid fa-plus mr-1"></i>新建模板</button></div>
<div class="grid grid-cols-12 gap-4">
  <div class="col-span-12 lg:col-span-4 card p-3">
    <div class="text-xs font-bold text-slate-500 mb-2">模板列表</div>
    <div id="tplList" class="space-y-2"></div>
  </div>
  <div class="col-span-12 lg:col-span-8 card p-4">
    <div class="grid grid-cols-2 gap-3">
      <label class="text-[11px] font-bold text-slate-500">模板名称<input id="f-name" class="field mt-1" placeholder="如：入库验收单"></label>
      <label class="text-[11px] font-bold text-slate-500">适用单据<select id="f-doc" class="field mt-1"><option value="RK">RK 物料入库</option><option value="LY">LY 物料领用</option><option value="DB">DB 调拨</option><option value="TL">TL 退料</option><option value="CP">CP 成品</option></select></label>
      <label class="text-[11px] font-bold text-slate-500 col-span-2">打印标题<input id="f-title" class="field mt-1" placeholder="如：物料入库验收单"></label>
      <label class="text-[11px] font-bold text-slate-500 col-span-2">表头说明<input id="f-header" class="field mt-1" placeholder="支持占位符 {wh}{loc}{at}{handler}"></label>
      <label class="text-[11px] font-bold text-slate-500 col-span-2">表脚说明<input id="f-footer" class="field mt-1" placeholder="签字栏等"></label>
    </div>
    <div class="mt-3 text-[11px] font-bold text-slate-500">列定义（勾选字段 · 可改显示名与宽度）</div>
    <div id="colBox" class="grid grid-cols-2 gap-2 mt-1"></div>
    <div class="flex gap-2 mt-3 flex-wrap">
      <button class="btn primary" id="saveTpl">保存模板</button>
      <button class="btn danger" id="delTpl">删除</button>
      <span class="flex-1"></span>
      <input id="pv-doc" class="field" style="max-width:200px" placeholder="预览用单号 如 RK100001">
      <button class="btn" id="pvBtn">预览</button>
      <button class="btn" id="expBtn">导出Excel</button>
    </div>
    <div id="pvBox" class="mt-3"></div>
  </div>
</div>
<div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full"></div>
</main></div></div>
<script>
var FIELDS=[["line_no","行号"],["material_code","物料编码"],["product_code","成品编码"],["batch_no","批次"],["qty","数量"],["unit","单位"],["loc","库位"],["o_loc","原库位"],["n_loc","新库位"],["o_qty","原数量"],["n_qty","新数量"],["qc_result","质检"],["reason","原因"],["bom_version","BOM版本"]];
var cur=null,tpls=[];
function toast(m){var d=document.getElementById('t');d.textContent=m;d.classList.remove('hidden');clearTimeout(d._t);d._t=setTimeout(function(){d.classList.add('hidden')},2200);}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')},opt.headers||{});return fetch(window.WmsAi.base+path,opt).then(function(r){return r.json().then(function(j){if(j.code!==200)throw new Error(j.msg||('HTTP '+r.status));return j.data;});});}
function renderList(){document.getElementById('tplList').innerHTML=tpls.map(function(t){return '<div class="tpl '+(cur&&cur.tpl_code===t.tpl_code?'on':'')+' card p-2 cursor-pointer" data-c="'+esc(t.tpl_code)+'"><b class="text-blue-700 text-xs">'+esc(t.name)+'</b> <span class="text-[11px] text-slate-400">'+esc(t.tpl_code)+' · '+esc(t.doc_type)+'</span><div class="text-[11px] text-slate-400 mt-1">'+esc(t.title)+'</div></div>';}).join('')||'<div class="text-xs text-slate-400">暂无模板</div>';document.querySelectorAll('[data-c]').forEach(function(el){el.addEventListener('click',function(){loadTpl(el.dataset.c)});});}
function renderCols(sel){var map={};(sel||[]).forEach(function(c){map[c.k]=c;});document.getElementById('colBox').innerHTML=FIELDS.map(function(f){var c=map[f[0]]||{};var on=!!map[f[0]];return '<div class="colrow"><input type="checkbox" data-k="'+f[0]+'"'+(on?' checked':'')+'><span style="flex:1">'+esc(f[1])+' <span class="text-slate-300">'+f[0]+'</span></span><input class="field" style="width:64px;min-height:30px" data-l="'+f[0]+'" placeholder="显示名" value="'+esc(c.label||'')+'"><input class="field" style="width:56px;min-height:30px" data-w="'+f[0]+'" type="number" value="'+(c.w||100)+'"></div>';}).join('');}
function fill(t){document.getElementById('f-name').value=t?t.name:'';document.getElementById('f-doc').value=t?t.doc_type:'RK';document.getElementById('f-title').value=t?t.title:'';document.getElementById('f-header').value=t?(t.header_note||''):'';document.getElementById('f-footer').value=t?(t.footer_note||''):'';renderCols(t?t.columns:[]);}
function loadTpl(code){cur=tpls.filter(function(x){return x.tpl_code===code;})[0]||null;fill(cur);renderList();document.getElementById('pvBox').innerHTML='';}
function newTpl(){cur={tpl_code:'',name:'',doc_type:'RK',title:'',header_note:'',footer_note:'',columns:[]};fill(cur);renderList();toast('新建模板：填好后点保存');}
function collectCols(){var out=[];document.querySelectorAll('#colBox input[type=checkbox]').forEach(function(cb){if(!cb.checked)return;var k=cb.dataset.k;var lb=document.querySelector('[data-l="'+k+'"]').value||k;var w=Number(document.querySelector('[data-w="'+k+'"]').value)||100;out.push({k:k,label:lb,w:w});});return out;}
function saveTpl(){if(!window.WmsAi){toast('后端未连接');return;}var body={name:document.getElementById('f-name').value.trim(),doc_type:document.getElementById('f-doc').value,title:document.getElementById('f-title').value.trim(),header_note:document.getElementById('f-header').value,footer_note:document.getElementById('f-footer').value,columns:collectCols(),enabled:true};if(!body.name){toast('请填模板名称');return;}if(!body.columns.length){toast('至少勾选一列');return;}var m=cur&&cur.tpl_code?'PUT':'POST';var p=cur&&cur.tpl_code?('/web/print_templates/'+cur.tpl_code):'/web/print_templates';api(p,{method:m,body:JSON.stringify(body)}).then(function(){toast('已保存');return api('/web/print_templates');}).then(function(d){tpls=d||[];renderList();if(!cur.tpl_code){loadTpl(tpls[tpls.length-1].tpl_code);}}).catch(function(e){toast('保存失败:'+e.message);});}
function delTpl(){if(!cur||!cur.tpl_code){toast('请先选择模板');return;}if(!confirm('删除模板 '+cur.tpl_code+' ?'))return;api('/web/print_templates/'+cur.tpl_code,{method:'DELETE'}).then(function(){toast('已删除');cur=null;fill(null);return api('/web/print_templates');}).then(function(d){tpls=d||[];renderList();}).catch(function(e){toast('删除失败:'+e.message);});}
function preview(){if(!cur||!cur.tpl_code){toast('请先保存模板');return;}var doc=document.getElementById('pv-doc').value.trim();if(!doc){toast('请填预览单号');return;}api('/web/print_templates/'+cur.tpl_code+'/render?doc_no='+encodeURIComponent(doc)).then(function(d){var head='<thead><tr>'+d.columns.map(function(c){return '<th>'+esc(c.label)+'</th>';}).join('')+'</tr></thead>';var rows=d.rows.map(function(r){return '<tr>'+d.columns.map(function(c){return '<td>'+esc(r[c.k])+'</td>';}).join('')+'</tr>';}).join('')||'<tr><td colspan="'+d.columns.length+'">（无明细）</td></tr>';document.getElementById('pvBox').innerHTML='<div class="font-bold text-sm mb-1">'+esc(d.title)+'</div><div class="text-[11px] text-slate-500 mb-2">'+esc(d.header)+'</div><table class="pv">'+head+'<tbody>'+rows+'</tbody></table><div class="text-[11px] text-slate-500 mt-2">'+esc(d.footer)+'</div>';}).catch(function(e){toast('预览失败:'+e.message);});}
function exportX(){if(!cur||!cur.tpl_code){toast('请先保存模板');return;}var doc=document.getElementById('pv-doc').value.trim();if(!doc){toast('请填单号');return;}fetch(window.WmsAi.base+'/web/export/print.xlsx?tpl_code='+encodeURIComponent(cur.tpl_code)+'&doc_no='+encodeURIComponent(doc),{headers:{'Authorization':'Bearer '+(localStorage.getItem('wms_token')||'')}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();}).then(function(b){var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=cur.tpl_code+'-'+doc+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast('已导出 Excel');}).catch(function(e){toast('导出失败:'+e.message);});}
document.getElementById('newTpl').addEventListener('click',newTpl);
document.getElementById('saveTpl').addEventListener('click',saveTpl);
document.getElementById('delTpl').addEventListener('click',delTpl);
document.getElementById('pvBtn').addEventListener('click',preview);
document.getElementById('expBtn').addEventListener('click',exportX);
Promise.resolve(window.WmsAi?window.WmsAi.ready:null).then(function(){return api('/web/print_templates');}).then(function(d){tpls=d||[];renderList();if(tpls.length)loadTpl(tpls[0].tpl_code);}).catch(function(e){toast('加载模板失败:'+e.message);});
</script></body></html>
