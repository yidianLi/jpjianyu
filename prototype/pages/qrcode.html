<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单据中心 · 二维码中心</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #e5eaf2;border-radius:14px}.tag{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700}.t-area{background:#eff6ff;color:#1d4ed8}.t-bin{background:#f0fdf4;color:#15803d}.t-box{background:#fef3c7;color:#b45309}.t-doc{background:#ede9fe;color:#6d28d9}.t-fin{background:#fce7f3;color:#be185d}.s-ok{background:#dcfce7;color:#047857}.s-warn{background:#fef3c7;color:#b45309}.s-bad{background:#fee2e2;color:#b91c1c}.s-mut{background:#f1f5f9;color:#64748b}.qr-mini{width:34px;height:34px;border:1px solid #dbeafe;border-radius:6px;background:#fff}.qtab{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer}.qtab.on{background:#0f1e3a;border-color:#0f1e3a;color:#fff}.qr-big{width:168px;height:168px;border:1px solid #dbeafe;border-radius:10px;background:#fff}dialog::backdrop{background:rgba(15,30,58,.5)}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script></head>
<body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1 min-w-0"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">单据中心 / <b class="text-slate-700">二维码中心</b><span class="ml-2 bg-blue-50 text-blue-700 px-2 py-1 rounded">库区码·物料箱贴·单据码·成品码 统一生成/打印/核验</span></header><main class="p-6 space-y-4">
<div class="flex justify-between items-center flex-wrap gap-2"><div><h1 class="text-xl font-extrabold">二维码中心</h1></div><div class="flex gap-2 text-xs"><button onclick="toast('二维码台账已导出')" class="px-3 py-2 bg-white border rounded-lg">导出台账</button><button onclick="batchPrint()" class="px-3 py-2 bg-white border rounded-lg">批量打印</button><button onclick="openGen()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold">+ 生成二维码</button></div></div>
<div class="grid grid-cols-2 xl:grid-cols-4 gap-3 text-xs">
<div class="card p-3"><div class="text-slate-400">在用二维码</div><div class="font-extrabold text-lg" id="kTotal">—</div><div class="text-[11px] text-slate-400">库区/箱贴/单据/成品</div></div>
<div class="card p-3"><div class="text-slate-400">已绑定</div><div class="font-extrabold text-lg text-emerald-600" id="kBind">—</div><div class="text-[11px] text-slate-400">编码=实物=系统一致</div></div>
<div class="card p-3 border-orange-200 bg-orange-50/50"><div class="text-orange-600">待补打 / 异常</div><div class="font-extrabold text-lg text-orange-600" id="kWarn">—</div><div class="text-[11px] text-slate-500">破损·丢失·不一致待处理</div></div>
<div class="card p-3"><div class="text-slate-400">今日扫码</div><div class="font-extrabold text-lg" id="kScan">186 <span class="text-xs font-normal text-slate-400">成功 181 · 拦截 5</span></div><div class="text-[11px]"><button class="text-blue-600 font-bold" onclick="goScanlog()">查看设备扫码记录 →</button></div></div>
</div>
<div class="flex gap-2 flex-wrap" id="qtabs"><button class="qtab on" data-k="" onclick="swTab('',this)">全部</button><button class="qtab" data-k="库区码" onclick="swTab('库区码',this)">库区码</button><button class="qtab" data-k="物料箱贴" onclick="swTab('物料箱贴',this)">物料箱贴</button><button class="qtab" data-k="单据码" onclick="swTab('单据码',this)">单据码</button><button class="qtab" data-k="成品码" onclick="swTab('成品码',this)">成品码</button></div>
<section class="card p-4"><div class="flex gap-2 text-xs flex-wrap"><input id="q" placeholder="搜索：码值 / 关联对象 / 仓库" class="border rounded-lg px-3 py-2 w-72" oninput="doQ()"><select id="fStat" class="border rounded-lg px-2 py-2" onchange="doQ()"><option value="">全部状态</option><option>已绑定</option><option>已打印</option><option>待补打</option><option>异常</option><option>停用</option></select><span class="flex-1"></span><span class="text-slate-400 self-center" id="cnt"></span></div>
<div class="overflow-x-auto"><table class="w-full text-xs mt-3 min-w-[980px]"><thead><tr class="text-slate-400 text-left border-b"><th class="py-2">二维码</th><th>码值</th><th>类型</th><th>关联对象</th><th>状态</th><th>更新</th><th>操作</th></tr></thead><tbody id="qrBody"></tbody></table></div><div id="empty" class="hidden text-center text-slate-400 text-xs py-6">无匹配二维码</div>
</section>
</main></div></div>
<dialog id="prevDlg" class="rounded-2xl p-0 w-[380px] max-w-[94vw]"><div class="p-5 text-center"><div class="flex justify-between items-center"><b id="pvTitle" class="text-sm">二维码预览</b><button onclick="document.getElementById('prevDlg').close()" class="text-slate-400" aria-label="关闭"><i class="fa-solid fa-xmark text-lg"></i></button></div><img id="pvImg" class="qr-big mx-auto mt-3" alt="二维码预览"><div id="pvCode" class="mt-2 font-mono text-sm font-bold text-blue-700"></div><div id="pvSub" class="text-xs text-slate-500 mt-1"></div><div class="flex gap-2 mt-4 text-xs"><button onclick="toast('已发送到标签打印机')" class="flex-1 border rounded-lg py-2">打印</button><button onclick="toast('扫码核验通过：编码一致 ✓')" class="flex-1 bg-blue-600 text-white rounded-lg py-2 font-bold">扫码核验</button></div></div></dialog>
<dialog id="genDlg" class="rounded-2xl p-0 w-[500px] max-w-[94vw]"><div class="p-5"><div class="flex justify-between items-center"><b class="text-sm">生成二维码</b><button onclick="document.getElementById('genDlg').close()" class="text-slate-400" aria-label="关闭"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="mt-3 flex gap-2" id="gTypeTabs"><button type="button" class="qtab on" data-t="area" onclick="genType('area',this)">库区码</button><button type="button" class="qtab" data-t="mat" onclick="genType('mat',this)">物料码</button><button type="button" class="qtab" data-t="fin" onclick="genType('fin',this)">成品码</button></div><p id="gTypeHint" class="mt-2 text-xs text-slate-500">库区码 = AQ-仓库-库区，与现场张贴一致，扫码自动定位库区。</p><div id="gPaneArea" class="grid grid-cols-2 gap-2 mt-3 text-xs"><label>仓库*<select id="gWh" class="border rounded-lg px-2 py-2 w-full mt-1" onchange="genAreaCode()"><option value="WHA">外仓 WH-A</option><option value="WHB">内仓1 WH-B</option><option value="WHC">内仓2 WH-C</option></select></label><label>库区*<input id="gArea" value="A-05区" class="border rounded-lg px-2 py-2 w-full mt-1" oninput="genAreaCode()"></label><label class="col-span-2">库区码（自动生成 · 可改）<input id="gAreaCode" value="AQ-WHA-A05" class="border rounded-lg px-2 py-2 w-full mt-1 font-mono"></label><label class="col-span-2">备注<input id="gAreaNote" value="48托" class="border rounded-lg px-2 py-2 w-full mt-1"></label></div><div id="gPaneMat" class="hidden"><p class="mt-3 text-xs text-slate-500">可先不绑定物料：只绑客户或OCR记录，移动端扫码时再对应物料并自动建批；不填每箱数量。</p><div class="grid grid-cols-2 gap-2 mt-2 text-xs"><label>绑定物料（可选）<select id="gMat" class="border rounded-lg px-2 py-2 w-full mt-1" onchange="genMatChg()"><option value="">暂不绑定 · 移动端扫码时对应</option><option>HD-OXF-001 牛津布 · 米</option><option>HD-ZP-011 拉链 · 件</option><option>HD-NK-005 纽扣 · 个</option></select></label><label id="gQtyWrap">每箱数量（绑物料才填）<input id="gQty" type="number" value="50" min="1" class="border rounded-lg px-2 py-2 w-full mt-1"></label><label>生成张数*<input id="gN" type="number" value="4" min="1" max="50" class="border rounded-lg px-2 py-2 w-full mt-1"></label><div><span class="block mb-1">绑定对象*（二选一）</span><div class="flex gap-3"><label class="flex items-center gap-1"><input type="radio" name="gSrc" value="cust" checked onchange="genSrcChg()">客户</label><label class="flex items-center gap-1"><input type="radio" name="gSrc" value="ocr" onchange="genSrcChg()">OCR记录</label></div></div><label id="gCustWrap">客户<select id="gCust" class="border rounded-lg px-2 py-2 w-full mt-1"><option>恒达服饰</option><option>宏远纺织</option><option>单位本部</option></select></label><label id="gOcrWrap" class="hidden">OCR记录<select id="gOcr" class="border rounded-lg px-2 py-2 w-full mt-1"><option>OCR2026091201 · 送货单识别结果</option><option>OCR2026091202 · 物料箱贴</option></select></label></div></div><div id="gPaneFin" class="hidden"><p class="mt-3 text-xs text-slate-500">成品码绑定成品档案，移动端扫码直接对应成品并建批入成品库。</p><div class="grid grid-cols-2 gap-2 mt-2 text-xs"><label>成品*<select id="gFin" class="border rounded-lg px-2 py-2 w-full mt-1"><option>CP-JK-001 · HD-JK-24秋 工装夹克 · 件</option><option>CP-TX-002 · HD-TX-24夏 工作T恤 · 件</option></select></label><label>每箱数量<input id="gFinQty" type="number" value="10" min="1" class="border rounded-lg px-2 py-2 w-full mt-1"></label><label>生成张数*<input id="gFinN" type="number" value="4" min="1" max="50" class="border rounded-lg px-2 py-2 w-full mt-1"></label><label>客户<select id="gFinCust" class="border rounded-lg px-2 py-2 w-full mt-1"><option>恒达服饰</option><option>宏远纺织</option><option>单位本部</option></select></label></div></div><button onclick="genOk()" class="mt-3 w-full bg-blue-600 text-white py-2.5 rounded-lg text-xs font-bold">生成并加入台账</button></div></dialog>
<div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full"></div>
<script>
var CUR_TAB='';
var ROWS=[
['AQ-WHA-A05','库区码','外仓 WH-A · A-05区','已绑定','08:28'],
['AQ-WHA-A06','库区码','外仓 WH-A · A-06区','已绑定','09-10'],
['AQ-WHA-D01','库区码','外仓 · 待检区D01','已绑定','08:10'],
['AQ-WHA-G01','库区码','外仓 · 隔离区G01','已绑定','09-11'],
['BX2026091003-02','物料箱贴','HD-ZP-011 拉链 · 500件/箱','已绑定','08:28'],
['SB20260910003-01','物料箱贴','HD-OXF-001 牛津布 · 200米','已绑定','08:31'],
['BX2026090901-01','物料箱贴','HD-OXF-001 牛津布 · 破损待补打','待补打','09-11'],
['SL2026091209','单据码','恒达服饰 · 送货单 · 牛津布1200米','已打印','08:31'],
['DJ20260916004','单据码','物料登记 · 单位本部','已打印','09-16'],
['CP-JK-001-B01','成品码','HD-JK-24秋 工装夹克 · 10件/箱','已绑定','09-15']];
var TCLS={'库区码':'t-area','物料箱贴':'t-box','单据码':'t-doc','成品码':'t-fin'};
var SCLS={'已绑定':'s-ok','已打印':'s-ok','待补打':'s-warn','异常':'s-bad','停用':'s-mut'};
function qrSrc(code){return 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(code);}
function toast(t){var d=document.getElementById('t');d.textContent=t;d.classList.remove('hidden');clearTimeout(d._t);d._t=setTimeout(function(){d.classList.add('hidden')},2200);}
function render(){var b=document.getElementById('qrBody');b.innerHTML=ROWS.map(function(r){return '<tr class="border-b hover:bg-blue-50" data-type="'+r[1]+'" data-stat="'+r[3]+'"><td class="py-2"><img loading="lazy" class="qr-mini" alt="'+r[0]+'二维码" src="'+qrSrc(r[0])+'"></td><td class="font-mono font-bold text-blue-700">'+r[0]+'</td><td><span class="tag '+(TCLS[r[1]]||'')+'">'+r[1]+'</span></td><td>'+r[2]+'</td><td><span class="tag '+(SCLS[r[3]]||'s-mut')+'">'+r[3]+'</span></td><td class="text-slate-400">'+r[4]+'</td><td class="whitespace-nowrap"><button class="text-blue-600 font-bold" onclick="preview(\''+r[0]+'\')">预览</button> <button class="text-slate-500" onclick="toast(\'已发送打印：'+r[0]+'\')">打印</button> <button class="text-slate-500" onclick="toast(\'核验通过：'+r[0]+' 编码一致 ✓\')">核验</button></td></tr>';}).join('');doQ();updKpi();}
function updKpi(){var ok=ROWS.filter(function(r){return r[3]==='已绑定'||r[3]==='已打印';}).length,warn=ROWS.length-ok;document.getElementById('kTotal').textContent='共 '+ROWS.length+' 枚';document.getElementById('kBind').textContent=ok+' 枚';document.getElementById('kWarn').textContent=(ROWS.filter(function(r){return r[3]==='待补打'||r[3]==='异常';}).length)+' 枚待处理';}
function swTab(k,btn){CUR_TAB=k;document.querySelectorAll('#qtabs .qtab').forEach(function(x){x.classList.remove('on')});btn.classList.add('on');doQ();}
function doQ(){var kw=(document.getElementById('q').value||'').trim().toLowerCase(),st=document.getElementById('fStat').value,vis=0;document.querySelectorAll('#qrBody tr').forEach(function(tr){var ok=(!CUR_TAB||tr.dataset.type===CUR_TAB)&&(!st||tr.dataset.stat===st)&&(!kw||tr.innerText.toLowerCase().indexOf(kw)>-1);tr.style.display=ok?'':'none';if(ok)vis++;});document.getElementById('cnt').textContent='共 '+vis+' 枚';document.getElementById('empty').classList.toggle('hidden',vis>0);}
function preview(code){var r=ROWS.filter(function(x){return x[0]===code;})[0]||[code,'','', '', ''];document.getElementById('pvTitle').textContent='二维码预览 · '+r[1];document.getElementById('pvImg').src=qrSrc(code);document.getElementById('pvImg').alt=code+'二维码';document.getElementById('pvCode').textContent=code;document.getElementById('pvSub').textContent=r[2]+' · '+r[3];document.getElementById('prevDlg').showModal();}
function batchPrint(){var n=document.querySelectorAll('#qrBody tr:not([style*=none])').length;toast('已批量打印当前筛选 '+n+' 枚');}
function openGen(){genType('area');document.getElementById('genDlg').showModal();}
var G_TYPE='area';
var G_HINTS={area:'库区码 = AQ-仓库-库区，与现场张贴一致，扫码自动定位库区。',mat:'物料码可先不绑物料：只绑客户或OCR记录，移动端扫码对应并自动建批。',fin:'成品码绑定成品档案，扫码直接对应成品并建批入成品库。'};
function genType(t,btn){G_TYPE=t||'area';document.querySelectorAll('#gTypeTabs .qtab').forEach(function(x){x.classList.toggle('on',x.dataset.t===G_TYPE)});document.getElementById('gPaneArea').classList.toggle('hidden',G_TYPE!=='area');document.getElementById('gPaneMat').classList.toggle('hidden',G_TYPE!=='mat');document.getElementById('gPaneFin').classList.toggle('hidden',G_TYPE!=='fin');document.getElementById('gTypeHint').textContent=G_HINTS[G_TYPE];if(G_TYPE==='mat'){genSrcChg();genMatChg();}}
function genAreaCode(){var wh=document.getElementById('gWh').value,area=(document.getElementById('gArea').value||'').replace(/区$/,'');document.getElementById('gAreaCode').value='AQ-'+wh+'-'+area;}
function genSrcChg(){var v=(document.querySelector('input[name=gSrc]:checked')||{}).value||'cust';document.getElementById('gCustWrap').classList.toggle('hidden',v!=='cust');document.getElementById('gOcrWrap').classList.toggle('hidden',v!=='ocr');}
function genMatChg(){var bound=!!document.getElementById('gMat').value;document.getElementById('gQtyWrap').style.opacity=bound?'1':'.45';document.getElementById('gQty').disabled=!bound;}
function genSub(){var v=(document.querySelector('input[name=gSrc]:checked')||{}).value||'cust';return v==='ocr'?('OCR '+document.getElementById('gOcr').value.split(' ')[0]):document.getElementById('gCust').value;}
function genOk(){
if(G_TYPE==='area'){var code=document.getElementById('gAreaCode').value.trim();if(!code){toast('请填写库区码',1);return}var whTxt=document.getElementById('gWh').selectedOptions[0].textContent;ROWS.unshift([code,'库区码',whTxt+' · '+document.getElementById('gArea').value+' · '+document.getElementById('gAreaNote').value,'已打印','刚刚']);document.getElementById('genDlg').close();render();toast('已生成库区码：'+code);return}
if(G_TYPE==='fin'){var n2=Math.max(1,Math.min(50,parseInt(document.getElementById('gFinN').value||'1',10)));var fin=document.getElementById('gFin').value.split(' · ')[0];var fq=document.getElementById('gFinQty').value;for(var k=0;k<n2;k++){ROWS.unshift([fin+'-B'+String(Math.floor(10+Math.random()*89))+k,'成品码',document.getElementById('gFin').value+' · '+fq+'件/箱 · '+document.getElementById('gFinCust').value,'已打印','刚刚']);}document.getElementById('genDlg').close();render();toast('已生成 '+n2+' 枚成品码：'+fin);return}
var n=Math.max(1,Math.min(50,parseInt(document.getElementById('gN').value||'1',10)));var base='BX20260916'+String(Math.floor(100+Math.random()*900));var mv=document.getElementById('gMat').value;var qty=document.getElementById('gQty').disabled?'':(' · '+document.getElementById('gQty').value+'/箱');for(var i=0;i<n;i++){ROWS.unshift([base+'-'+(i+1),'物料箱贴',(mv||'未绑定物料 · 移动端扫码对应')+' · '+genSub()+qty,'已打印','刚刚']);}try{window.__WMS_BOXES=window.__WMS_BOXES||[];for(var j=0;j<n;j++){window.__WMS_BOXES.push({box_code:base+'-'+(j+1),material_code:mv?mv.split(' ')[0]:'UNBOUND',customer:genSub(),src:(document.querySelector('input[name=gSrc]:checked')||{}).value||'cust'});}}catch(e){}document.getElementById('genDlg').close();render();toast('已生成 '+n+' 枚物料码：'+base+'-01 起（'+genSub()+'）');}
function goScanlog(){if(window.WMSView&&WMSView.navigateFile){WMSView.navigateFile('scanlog.html');return;}if(window.goPage){goPage('scanlog');return;}location.href='scanlog.html';}
render();
</script></body></html>
