<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>异常与审计 · 操作审计</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.card{background:#fff;border:1px solid #dbeafe;border-radius:8px;box-shadow:0 8px 24px rgba(30,117,171,.06)}
.audit-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.audit-ok{background:#dcfce7;color:#166534}.audit-warn{background:#fef3c7;color:#92400e}.audit-info{background:#dbeafe;color:#1d4ed8}
.audit-table th{font-size:11px;color:#4e7da1;font-weight:600;background:#eaf7ff;text-align:left;white-space:nowrap}
.audit-table th,.audit-table td{padding:10px 9px;vertical-align:top;border-bottom:1px solid #e8f0f7}
.audit-table th:nth-child(2),.audit-table td:nth-child(2){text-align:center}
.audit-table tr:last-child td{border-bottom:0}
.audit-table td{font-size:12px;color:#334155}
.audit-action{color:#0875d2;font-weight:700;white-space:nowrap}
</style>
<script src="../assets/store.js"></script>
<script src="../assets/link.js"></script>
<script src="../assets/nav.js"></script>
</head>
<body class="bg-[#f2f5fa]">
<div class="flex min-h-screen">
  <aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside>
  <div class="flex-1 min-w-0">
    <header class="bg-white border-b px-6 py-3 text-xs text-slate-400">异常与审计 / <b class="text-slate-700">操作审计</b><span class="ml-2 bg-amber-50 text-amber-700 px-2 py-1 rounded">只读留痕 · 不可删除</span></header>
    <main id="audit-main" class="p-6 space-y-4">
      <div class="flex justify-between items-start flex-wrap gap-3">
        <div><h1 class="text-xl font-extrabold">操作审计</h1></div>
        <button type="button" class="px-3 py-2 bg-white border rounded-lg text-xs font-bold" onclick="exportAudit()"><i class="fa-solid fa-download mr-1" aria-hidden="true"></i>导出审计记录</button>
      </div>

      <section class="grid grid-cols-2 xl:grid-cols-4 gap-3" aria-label="审计摘要">
        <div class="card p-3"><div class="text-xs text-slate-400">记录总数</div><div id="auTotal" class="text-xl font-extrabold mt-1 text-slate-800">–</div><div class="text-[11px] text-slate-400 mt-1">近 30 天</div></div>
        <div class="card p-3"><div class="text-xs text-slate-400">今日新增</div><div id="auToday" class="text-xl font-extrabold mt-1 text-blue-700">–</div><div id="auUsers" class="text-[11px] text-slate-400 mt-1">–</div></div>
        <div class="card p-3"><div class="text-xs text-slate-400">需复核</div><div id="auWarn" class="text-xl font-extrabold mt-1 text-amber-600">–</div><div class="text-[11px] text-slate-400 mt-1">数量修改与异常签名</div></div>
        <div class="card p-3"><div class="text-xs text-slate-400">最近同步</div><div class="text-xl font-extrabold mt-1 text-emerald-600">08:31</div><div class="text-[11px] text-slate-400 mt-1">审计服务正常</div></div>
      </section>

      <section class="card p-4" aria-labelledby="audit-list-title">
        <div class="flex justify-between items-center gap-3 flex-wrap">
          <div><h2 id="audit-list-title" class="text-sm font-bold">审计记录列表</h2></div>
          <span id="audit-count" class="text-xs text-slate-400" role="status" aria-live="polite"></span>
        </div>
        <div class="flex items-end gap-2 flex-wrap mt-4" role="search" aria-label="筛选审计记录">
          <label class="grid gap-1 text-[11px] text-slate-500">关键词<input id="audit-q" type="search" class="border rounded-lg px-3 py-2 w-56" placeholder="单号 / 操作 / 设备" aria-label="搜索单号、操作或设备"></label>
          <label class="grid gap-1 text-[11px] text-slate-500">操作人<select id="audit-user" class="border rounded-lg px-2 py-2" aria-label="按操作人筛选"><option value="">全部操作人</option><option>张建国</option><option>李小明</option><option>王芳</option></select></label>
          <label class="grid gap-1 text-[11px] text-slate-500">业务类型<select id="audit-type" class="border rounded-lg px-2 py-2" aria-label="按业务类型筛选"><option value="">全部业务类型</option><option>入库</option><option>调拨</option><option>退料</option><option>权限</option></select></label>
          <label class="grid gap-1 text-[11px] text-slate-500">结果<select id="audit-result" class="border rounded-lg px-2 py-2" aria-label="按结果筛选"><option value="">全部结果</option><option>已完成</option><option>需复核</option></select></label>
          <label class="grid gap-1 text-[11px] text-slate-500">开始日期<input id="audit-from" type="date" value="2026-09-01" class="border rounded-lg px-2 py-2" aria-label="审计开始日期"></label>
          <label class="grid gap-1 text-[11px] text-slate-500">结束日期<input id="audit-to" type="date" value="2026-09-12" class="border rounded-lg px-2 py-2" aria-label="审计结束日期"></label>
          <button type="button" id="audit-reset" class="border bg-white rounded-lg px-3 py-2 text-xs" onclick="resetAudit()">重置</button>
        </div>
        <div class="overflow-x-auto mt-3">
          <table class="audit-table w-full min-w-[980px]">
            <thead><tr><th>时间</th><th>操作人 / 设备</th><th>业务类型</th><th>关联单据</th><th>操作内容</th><th>前值 → 后值</th><th>结果</th><th>操作</th></tr></thead>
            <tbody id="audit-body"><tr><td colspan="6" class="text-center text-slate-400 py-6">加载中…</td></tr></tbody>
          </table>
        </div>
        <div id="audit-empty" hidden class="text-center text-slate-400 text-xs py-8">暂无匹配的审计记录，请调整筛选条件。</div>
      </section>
    </main>
  </div>
</div>
<div id="audit-toast" class="wms-toast hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
function toast(message){var el=document.getElementById('audit-toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(el._timer);el._timer=setTimeout(function(){el.classList.add('hidden');},2200);}
function filterAudit(){var q=(document.getElementById('audit-q').value||'').trim().toLowerCase(),user=document.getElementById('audit-user').value,type=document.getElementById('audit-type').value,result=document.getElementById('audit-result').value,from=document.getElementById('audit-from').value,to=document.getElementById('audit-to').value,visible=0;document.querySelectorAll('#audit-body tr').forEach(function(row){var text=row.innerText.toLowerCase(),date=row.dataset.date,ok=(!q||text.indexOf(q)>-1)&&(!user||row.dataset.user===user)&&(!type||row.dataset.type===type)&&(!result||row.dataset.result===result)&&(!from||date>=from)&&(!to||date<=to);row.hidden=!ok;if(ok)visible++;});document.getElementById('audit-count').textContent='当前显示 '+visible+' 条';document.getElementById('audit-empty').hidden=visible>0;}
function resetAudit(){['audit-q','audit-user','audit-type','audit-result'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('audit-from').value='2026-09-01';document.getElementById('audit-to').value='2026-09-12';filterAudit();toast('筛选条件已重置');}
function viewAudit(button){var row=button.closest('tr');toast('审计详情：'+row.cells[3].textContent.trim()+' · '+row.cells[4].textContent.trim());}
function exportAudit(){toast('审计记录已导出（当前筛选结果）');}
['audit-q','audit-user','audit-type','audit-result','audit-from','audit-to'].forEach(function(id){document.getElementById(id).addEventListener('input',filterAudit);document.getElementById(id).addEventListener('change',filterAudit);});
filterAudit();
</script>
<script src="../assets/ai-gateway.js"></script>
<script>
/* 审计真数据:拉audit_logs重建tbody,原筛选函数照用data属性 */
document.addEventListener('DOMContentLoaded', function(){
  if(!window.WmsAi) return;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  window.WmsAi.ready.then(function(){
    return fetch(window.WmsAi.base + '/system/audit_logs?page_size=100',
      {headers: {'Authorization': 'Bearer ' + (localStorage.getItem('wms_token') || '')}});
  }).then(function(r){ if(!r.ok) throw new Error('no backend'); return r.json(); })
  .then(function(j){
    var rows = (j && j.data) || [];
    if(!rows.length){var tb0=document.getElementById('audit-body');if(tb0)tb0.innerHTML='<tr><td colspan="6" class="text-center text-slate-400 py-6">暂无数据</td></tr>';return;}
    var tb = document.getElementById('audit-body');
    if(!tb) return;
    tb.innerHTML = rows.map(function(x){
      var at = String(x.at || ''), d = at.slice(0, 10), t = at.slice(11, 16);
      var warn = /需|驳|失败|退回/.test(String(x.result || ''));
      return '<tr data-user="' + esc(x.by_user) + '" data-type="' + esc(x.biz_type) + '" data-result="' + esc(x.result) + '" data-date="' + esc(d) + '">'
        + '<td><b>' + esc(d.slice(5)) + '</b><br><span class="text-slate-400">' + esc(t) + '</span></td>'
        + '<td>' + esc(x.by_user) + '<br><span class="text-slate-400">' + esc(x.device || '') + '</span></td>'
        + '<td><span class="audit-tag audit-info">' + esc(x.biz_type || '') + '</span></td>'
        + '<td class="font-bold text-blue-700">' + esc(x.doc_no || '') + '</td>'
        + '<td>' + esc(x.action || '') + '</td>'
        + '<td>' + (x.o_val != null && String(x.o_val) !== '' ? '<s>' + esc(x.o_val) + '</s> → <b>' + esc(x.n_val) + '</b>' : esc(x.n_val == null ? '' : x.n_val)) + '</td>'
        + '<td><span class="audit-tag ' + (warn ? 'audit-warn' : '') + '">' + esc(x.result || '') + '</span></td>'
        + '<td><button type="button" class="audit-action" onclick="viewAudit(this)">查看</button></td></tr>';
    }).join('');
    (function paintAuStats(list){function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
     var today=new Date(),tstr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
     var users={},tn=0,wn=0;
     (list||[]).forEach(function(x){var at=String(x.at||'');if(at.slice(0,10)===tstr){tn++;if(x.by_user)users[x.by_user]=1;}if(/需|驳|失败|退回/.test(String(x.result||'')))wn++;});
     set('auTotal',list.length);set('auToday',tn);set('auUsers','涉及 '+Object.keys(users).length+' 位操作人');set('auWarn',wn);})(rows);
    if(typeof filterAudit === 'function') filterAudit();
  }).catch(function(){var tb=document.getElementById('audit-body');if(tb)tb.innerHTML='<tr><td colspan="6" class="text-center text-slate-400 py-6">后端不可达</td></tr>';});
});
</script>
</body>
</html>
