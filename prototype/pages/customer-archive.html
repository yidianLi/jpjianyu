<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础资料 · 客户档案</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #cde8f7;border-radius:8px}.field{min-height:40px;border:1px solid #9bcbe7;border-radius:8px;padding:8px 10px;font-size:12px}</style><script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/menu-config.js"></script><script src="../assets/nav.js"></script></head><body class="bg-[#f2f5fa]"><div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1"><header class="bg-white border-b px-6 py-3 text-xs text-slate-400">基础资料 / <b class="text-slate-700">客户档案</b></header><main class="p-6 space-y-4"><div class="flex justify-between gap-3 flex-wrap"><div><h1 class="text-xl font-extrabold">客户档案</h1><p class="text-xs text-slate-500">维护客户编码、名称、联系人、联系方式和业务状态</p></div><button class="bg-blue-600 text-white rounded-lg px-4 py-2 text-xs font-bold" onclick="addCustomer()">+ 新增客户</button></div><div class="card p-4"><div class="flex gap-2 flex-wrap"><input id="q" class="field w-64" placeholder="搜索：客户编码 / 名称 / 联系人"><select id="status" class="field"><option value="">全部状态</option><option>启用</option><option>停用</option><option>草稿</option></select><span class="flex-1"></span><span id="count" class="text-xs text-slate-400 self-center"></span></div><div class="overflow-x-auto"><table class="w-full min-w-[780px] text-xs mt-3"><thead><tr class="text-left border-b"><th class="py-2">客户编码 / 名称</th><th>客户类型</th><th>联系人</th><th>联系电话</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></div></main></div></div><div id="t" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full"></div><script>var rows=[['KH001','恒达服饰','成衣客户','陈总','138****8800','启用'],['KH002','宏远纺织','面料客户','周经理','139****2618','启用'],['KH003','新远服饰','成衣客户','待补充','—','草稿']];function toast(s){var t=document.getElementById('t');t.textContent=s;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},1800)}function render(){var q=document.getElementById('q').value.trim(),st=document.getElementById('status').value,list=rows.filter(function(r){return(!q||r.join(' ').indexOf(q)>-1)&&(!st||r[5]===st)});document.getElementById('body').innerHTML=list.map(function(r){return'<tr class="border-b hover:bg-blue-50"><td class="py-2"><b class="text-blue-700">'+r[0]+'</b> · '+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td><button class="text-blue-600 font-bold" onclick="toast(\'查看 '+r[0]+'\')">详情</button> <button class="text-slate-500" onclick="toast(\'编辑 '+r[0]+'\')">编辑</button></td></tr>'}).join('');document.getElementById('count').textContent='共 '+list.length+' 个客户'}function addCustomer(){rows.unshift(['KH'+String(rows.length+1).padStart(3,'0'),'新建客户','待选择','待填写','—','草稿']);render();toast('已新增客户草稿')}q.oninput=render;status.onchange=render;render();</script></body></html>
