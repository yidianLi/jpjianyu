:root{--ink:#13293f;--muted:#6b7d8f;--line:#dbe5ef;--blue:#1677c8;--navy:#0b4770}

body{margin:0;background:#f2f6fa;color:var(--ink);font:13px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.workbench-shell{display:flex;min-height:100vh}
.standalone-nav{width:272px;position:sticky;top:0;height:100vh;overflow-y:auto}
.workbench-content{flex:1;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{padding:24px 24px 32px;max-width:1680px;margin:0 auto}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.h1{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.h1 h1{margin:0;font-size:19px;font-weight:800}
.h1 p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:1080px}
.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);background:#e9eff5}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);padding:9px 14px;font-weight:700;white-space:nowrap;border-radius:6px 6px 0 0;margin-bottom:-1px}

.bar{display:none;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(30,70,100,.04)}
.bar.has-content{display:flex}
.b{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-weight:700;font-size:12px;color:#31506b;min-height:36px}

.b.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.b.danger{color:#b42318;border-color:#f0c8c4}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(30,70,100,.035);overflow:hidden}
.pad{padding:12px 14px}
.mut{color:var(--muted)}.sm{font-size:11px}
.tblwrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{background:#f8fafc;color:#5f7488;font-weight:700;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid #eef3f8;white-space:nowrap;vertical-align:middle}
.t tr:hover td{background:#f7fbff}
.t .num{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;border:1px solid transparent}
.g1{background:#eef2f6;color:#5b6f82;border-color:#dde5ec}
.g2{background:#e8f2fc;color:#125d97;border-color:#cbe2f6}
.g3{background:#fff4e0;color:#96590a;border-color:#f6dfb8}
.g4{background:#e7f6ee;color:#116d4b;border-color:#c6e9d7}
.g5{background:#fdeceb;color:#a9271f;border-color:#f5cfcb}
.g6{background:#f1eafe;color:#6b3fa0;border-color:#e0d2f6}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:12px;min-height:40px}
.f:focus{outline:2px solid #8ec4ea;outline-offset:1px}
.f[readonly]{background:#f4f7fa;color:#5f7488}
.hd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#42586c}.fl-label{display:block;line-height:1.35}.fl-label i{display:inline;margin-left:3px}
.fl.wide{grid-column:1/-1}
.fl i{color:#c0392b;font-style:normal;margin-left:2px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:16px;align-items:start}
.split>.work-order-info{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.split>.work-order-info .fl{color:#42586c!important}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#42586c;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.note{background:#f4f9fd;border:1px solid #d7e9f7;border-radius:10px;padding:11px 12px;font-size:12px;color:#3c5a72}
.link{color:var(--blue);font-weight:700;cursor:pointer}
.link:hover{text-decoration:underline}
.ops{white-space:nowrap;text-align:left}.ops .link{margin-right:2px}
/* 弹窗形态已收敛为共享 .wms-dialog（assets/theme.css），此处只保留本页面板宽度 */
.dlg{width:min(860px,100%)}
.dlg h3{margin:0;font-size:15px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.x{border:0;background:transparent;font-size:20px;color:var(--muted);line-height:1}
.errs{margin:0;padding-left:18px;color:#a9271f;font-size:12px;line-height:1.9}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{position:relative;min-height:82px;background:#fff;border:1px solid var(--line);border-left:4px solid #3b82f6;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(30,70,100,.035);display:flex;flex-direction:column;justify-content:center}
.kpi:nth-child(2){border-left-color:#f59e0b}.kpi:nth-child(3){border-left-color:#ef4444}.kpi:nth-child(4){border-left-color:#10b981}
.kpi small{display:block;color:var(--muted);font-size:11px}
.kpi b{display:block;font-size:20px;margin-top:3px;color:#0f4f82}
.kpi:nth-child(2) b{color:#c06b00}.kpi:nth-child(3) b{color:#dc2626}.kpi:nth-child(4) b{color:#12805a}
.kpi .sm{margin-top:2px;color:#94a3b8}
.main-toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(30,70,100,.035)}
#bar:empty{display:none}
.main-toolbar:has(+ .card){}
.card>.tblwrap{min-height:64px}
.tblwrap{scrollbar-width:thin}
.tblwrap::-webkit-scrollbar{height:8px}.tblwrap::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
.multi{line-height:1.8;white-space:nowrap}

.source-record{display:inline-flex;align-items:center;max-width:180px;min-height:36px;padding:7px 10px;border:1px solid #d7e6f1;border-radius:10px;background:#f7fbfe;color:#31506b;font-weight:600;white-space:normal;line-height:1.35}
.qty-value,.qty-unit{display:inline-block}.qty-value{margin-right:4px}.qty-unit{color:#5f7488;font-weight:600}
.t .num,.t .num .qty-value{font-variant-numeric:tabular-nums}
.t thead th:nth-child(n+9):nth-child(-n+17){text-align:right}
.t th.column-center,.t td.column-center{text-align:center!important}
/* 操作列（末列）表头与内容一律左对齐，避免数字列右对齐规则误伤 */
.t thead th:last-child:not(.column-center){text-align:left}
.ops{white-space:nowrap;text-align:left}.ops .link{margin-right:2px}
.t th:nth-child(9),.t td:nth-child(9){min-width:92px}
.t th:nth-child(10),.t td:nth-child(10){min-width:82px}
.t th:nth-child(11),.t td:nth-child(11){min-width:96px}
.t th:nth-child(12),.t td:nth-child(12),.t th:nth-child(13),.t td:nth-child(13),.t th:nth-child(14),.t td:nth-child(14),.t th:nth-child(15),.t td:nth-child(15){min-width:76px}
.t th:nth-child(17),.t td:nth-child(17){min-width:88px}
.qr-preview{width:42px;height:42px;border:1px solid var(--line);border-radius:5px;background:#fff;vertical-align:middle;margin-right:6px}
.empty-add{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px dashed #8fbfe0;border-radius:8px;background:#f5faff;color:var(--blue);font-size:25px;line-height:1}
.empty-add:hover{background:#eaf5fd;border-style:solid}
.picker-kind{display:flex;gap:6px;margin-bottom:12px}
.picker-kind button{flex:1}
.picker-kind button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.picker-target{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px}
.card>.pad[style*="border-bottom"]{padding:14px 16px!important}
.subtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.subtab{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;color:#4d6479}
.subtab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.batch-row td{background:#eef6fd!important;border-top:1px solid #cfe4f5;border-bottom:1px solid #cfe4f5;color:#125d97;font-weight:800;padding:9px 10px}
.region-row td{background:#fafcff!important;color:#5f7488;font-weight:700;padding:7px 10px;border-bottom:1px solid #e8f0f6}
.batch-mark{display:inline-flex;align-items:center;gap:6px}.batch-mark i{color:#1677c8}.region-mark{display:inline-flex;align-items:center;gap:6px;color:#42586c}
.hide{display:none!important}
.red{color:#b42318}.org{color:#96590a}.grn{color:#116d4b}
@media(max-width:1100px){.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hd{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function post(d){
  var e=validate(d);

  if(d.type==='reject'){
    /* 拒收：只登记凭证 + 锁定来源可入量，绝不写 stock_ledger / inventory_stock */
    audit(d,'拒收确认（不产生库存变动）',unitSum(d.lines)+' · 来源 '+(d.source||'—'));
    return {ok:true,quiet:true};
  }
  if(d.type==='request'){
    /* 申请领料：进仓前的需求意向，审批只做需求确认，绝不写 stock_ledger / inventory_stock */
    audit(d,'申请确认（不产生库存变动）',unitSum(d.lines)+' · 期望 '+(d.date||'—'));

      writeLedger(d,l,s,'入',q,'avail',before,after,'物料登记入账'+(m.mode==='一物一码'?' · 生成条码':''));
    }
    if(d.type==='inbound'){
      if(!l.batch)l.batch=nextBatch();
      s=stOrNew(d.wh,l.loc||d.loc,l.code,l.batch,m.unit);
      before=s.on;s.on+=q;
      if(l.qc==='待检'){var pb=s.pending;s.pending+=q;writeLedger(d,l,s,'入',q,'pending',pb,s.pending,'待检，不计可用'+(d.src_dj?' · 关联登记 '+d.src_dj:''))}
      else{var ab=s.avail;s.avail+=q;writeLedger(d,l,s,'入',q,'avail',ab,s.avail,(d.src_dj?'关联登记 '+d.src_dj:''))}
      s.at=now();

    }

      s=st(d.wh,l.code,l.batch);
      if(!s)return {ok:false,errors:['第1行：提交时未找到库存行（'+d.wh+' / '+(l.batch||'无批次')+'），请重新选择批次后再审批']};
      var ob=s.on,oav=s.avail;
      s.on-=q;s.avail-=q;s.at=now();
      var flowTag=d.issue_flow||'车间自提（入车间账）';
      writeLedger(d,l,s,'出',q,'avail',oav,s.avail,'领用人 '+(d.receiver||'—')+' · '+(d.dept||'—')+' · '+flowTag+(d.vehicle?' · 车辆 '+d.vehicle:''));
      if(m.mode==='一物一码'){var left=q;DB.item.forEach(function(it){if(left>0&&it.code===l.code&&it.status==='在库'){it.status='已领用';it.holder=(d.dept||'')+' / '+(d.receiver||'');it.wh='直送车间（不入仓）'===(d.issue_flow||'')?(d.dept||'车间直送'):it.wh;it.at=now();left--}})}
    }
    if(d.type==='wreturn'){
      /* 车间退料：方向=回仓进项。车间自报状态 + 外仓判定后回增到对应分量 */
      s=stOrNew(d.wh,l.loc||d.loc,l.code,l.batch,m.unit);
      s.on+=q;s.at=now();
      var finalState=l.ret_state||d.judge_state||'可用';
      if(finalState==='待检'){var p0=s.pending;s.pending+=q;writeLedger(d,l,s,'入',q,'pending',p0,s.pending,'车间退料回仓转待检 · 原领用单 '+d.src_ly+(d.judge_by?' · 判定 '+d.judge_by:''))}
      else if(finalState==='隔离'){var q0=s.qua;s.qua+=q;writeLedger(d,l,s,'入',q,'qua',q0,s.qua,'车间退料回仓转隔离 · 原领用单 '+d.src_ly+(d.judge_by?' · 判定 '+d.judge_by:''))}
      else{var a0=s.avail;s.avail+=q;writeLedger(d,l,s,'入',q,'avail',a0,s.avail,'车间退料回仓 · 原领用单 '+d.src_ly+(d.judge_by?' · 判定 '+d.judge_by:''))}
      if(m.mode==='一物一码')DB.item.forEach(function(it){if(it.code===l.code&&it.status==='已领用'&&num(q)>0){it.status='已退库';it.holder='—';it.wh=d.wh;it.loc=l.loc||d.loc;it.at=now()}});

        var rb=s.on,ra=s.avail;

        var os=docBy(d.src_rk);if(os){os.reversed=num(os.reversed)+q;if(os.lines)os.lines.forEach(function(x){if(x.code===l.code)x.reversed=num(x.reversed)+q})}
      }
      if(d.ret_type==='损坏退还供应商'){
        s=st(d.wh,l.code,l.batch);
        if(!s)return {ok:false,errors:['第1行：提交时未找到库存行（'+d.wh+' / '+(l.batch||'无批次')+'），退还必须对应已有批次']};
        var db0=s.on,da=s.avail,dq=s.qua;
        s.on-=q;
        if(l.ret_state==='隔离'&&s.qua>=q){s.qua-=q;writeLedger(d,l,s,'出',q,'qua',dq,s.qua,'损坏退还供应商 · '+(d.reason||''))}
        else{s.avail-=q;writeLedger(d,l,s,'出',q,'avail',da,s.avail,'损坏退还供应商 · '+(d.reason||''))}
        s.at=now();
      }
      if(d.ret_type==='待检转合格'){
        s=st(d.wh,l.code,l.batch);
        if(!s)return {ok:false,errors:['第1行：提交时未找到库存行（'+d.wh+' / '+(l.batch||'无批次')+'）']};
        var tb=s.pending,ta=s.avail;
        s.pending-=q;s.avail+=q;s.at=now();
        writeLedger(d,l,s,'转',q,'avail',ta,s.avail,'待检 → 可用（账面数量不变）');
      }
      if(d.ret_type==='隔离报废待核'){
        s=st(d.wh,l.code,l.batch);
        if(!s)return {ok:false,errors:['第1行：提交时未找到库存行（'+d.wh+' / '+(l.batch||'无批次')+'）']};
        var sb=s.avail,sq=s.qua;
        s.avail-=q;s.qua+=q;s.at=now();
        writeLedger(d,l,s,'转',q,'qua',sq,s.qua,'可用 → 隔离待核（等待处置审批）');
      }
    }
  });
  audit(d,'审批过账',unitSum(d.lines));

}

function normalizeRegisterBatches(d){
  if(!d||d.type!=='register')return;
  if(!d.batchRegions||typeof d.batchRegions!=='object')d.batchRegions={};
  (d.lines||[]).forEach(function(l){
    if(l.batch&&l.region&&!d.batchRegions[l.batch])d.batchRegions[l.batch]=l.region;
    if(l.batch&&(l.region||l.loc)&&!d.batchRegions[l.batch])d.batchRegions[l.batch]=l.region||l.loc;
    if(!l.region)l.region=l.loc||d.batchRegions[l.batch]||d.loc||'';
  });
  if(!d.activeBatch){
    var first=(d.lines||[]).filter(function(l){return l.batch})[0];
    d.activeBatch=first?first.batch:'';
  }
}
function registerBatchOrder(d){
  var order=[],seen={};
  function push(b){b=String(b||'待分配批次');if(!seen[b]){seen[b]=1;order.push(b)}}
  if(d.activeBatch)push(d.activeBatch);
  Object.keys(d.batchRegions||{}).forEach(push);
  (d.lines||[]).forEach(function(l){push(l.batch||'待分配批次')});
  return order;
}
function registerBatchRegion(d,batch){
  if(d.batchRegions&&d.batchRegions[batch])return d.batchRegions[batch];
  var f=(d.lines||[]).filter(function(l){return String(l.batch||'待分配批次')===String(batch)})[0];
  return f?(f.region||f.loc||d.loc||''):(d.loc||'');
}
function registerBatchStats(d,batch){
  var rows=(d.lines||[]).filter(function(l){return String(l.batch||'待分配批次')===String(batch)});
  var regions={};rows.forEach(function(l){var r=l.region||l.loc||d.loc||'未分配区域';regions[r]=1});
  return {n:rows.length,regions:Object.keys(regions),sum:unitSum(rows)};
}

function renderRegisterGroupedLines(d,cols){

  var order=registerBatchOrder(d);
  var pos={};order.forEach(function(b,ix){pos[String(b)]=ix});
  indexed.sort(function(a,b){
    var pa=pos[String(a.l.batch||'待分配批次')],pb=pos[String(b.l.batch||'待分配批次')];
    if(pa===undefined)pa=999;if(pb===undefined)pb=999;

  });

  if(!m.code||m.status!=='启用')return null;
  var l={code:m.code,name:m.name,unit:m.unit,qty:d.type==='register'?1:'',qty_src:'',price:m.price||0,loc:d.type==='register'?'':(d.loc||''),region:d.type==='register'?'':(d.loc||''),batch:'',pack:m.pack,sub:m.sub};
  if(d.type==='register'&&d.activeBatch){l.batch=d.activeBatch;l.region=registerBatchRegion(d,d.activeBatch)||d.loc||'';l.loc=l.region||l.loc}
  if(d.type==='inbound')l.qc='合格';
  if(d.type==='reject'){l.reason='质量问题';l.qty_src=0;l.qty_bad=0;l.qty=0}
  if(d.type==='request'){l.ref='手动添加';l.batch='';l.region='';l.loc=''}
  if(d.type==='wreturn')l.ret_state=d.judge_state||'可用';
  if(d.type==='issue'){var bs=DB.stock.filter(function(s){return s.wh===d.wh&&s.code===l.code&&num(s.avail)>0});l.batch=bs[0]?bs[0].batch:'';l.loc=bs[0]?bs[0].loc:l.loc}
  else if(d.type==='register'&&d.activeBatch){}
  else if(d.type!=='request'&&d.type!=='register'&&m.mode==='按量（批次数量）')l.batch=nextBatch();
  else l.batch='';
  if(qty!==''&&qty!=null){l.qty=num(qty);if(d.type==='inbound'||d.type==='reject')l.qty_src=num(qty)}
  if(ref&&d.type==='request')l.ref=ref;
  return l;
}

function pickerTargets(kind){
  if(kind==='ocr'){
    var records=(DB.ocr||[]).map(function(record){
      var preset=OCR_PRESETS.filter(function(item){return item.no===record.no})[0]||OCR_PRESETS[0];
      return{no:record.no,name:record.no+' · '+(record.status||'待复核')+(record.created?' · '+record.created:''),customer:record.customer||preset.customer,items:preset.items};
    });
    OCR_PRESETS.forEach(function(item){if(!records.some(function(record){return record.no===item.no}))records.push(item)});
    return records;
  }
  if(kind==='history'){
    var query=String((window._materialPicker&&window._materialPicker.query)||'').toLowerCase();
    return DB.doc.filter(function(doc){
      if(doc.type!=='request'||doc.status==='已作废')return false;
      var text=[doc.no,doc.date,doc.dept,doc.receiver,doc.unit,doc.listCustomer].concat((doc.lines||[]).map(function(line){var material=mat(line.code);return [line.code,material.name,material.customer].join(' ')})).join(' ').toLowerCase();
      return !query||text.indexOf(query)>=0;
    }).map(function(doc){return{no:doc.no,name:doc.no+' · '+(doc.date||'')+' · '+(doc.dept||doc.receiver||doc.unit||'—'),customer:doc.listCustomer||'',items:(doc.lines||[]).filter(function(line){return !!mat(line.code).code}).map(function(line){return[line.code,num(line.qty)||1]})}});
  }
  if(kind==='customer'){
    var names=[];DB.material.forEach(function(m){if(m.status==='启用'&&m.customer&&names.indexOf(m.customer)<0)names.push(m.customer)});
    return names.map(function(name){return{name:name,items:DB.material.filter(function(m){return m.status==='启用'&&m.customer===name}).map(function(m){return[m.code,1]})}});
  }
  return ADD_PRESETS[kind]||[];
}
function pickerAvailability(d,code){
  if(d.type!=='issue'&&d.type!=='return')return null;
  return DB.stock.filter(function(s){return s.wh===d.wh&&s.code===code&&num(d.type==='issue'?s.avail:s.on)>0}).reduce(function(sum,s){return sum+num(d.type==='issue'?s.avail:s.on)},0);
}

  if(k==='src_dj'&&d.type==='inbound'&&v){
    var r=docBy(v);
    if(r&&r.type==='register'){
      if(r.unit&&(!String(d.unit||'').trim()||d.unit==='单位本部'))d.unit=r.unit;
      if(r.dept&&(!String(d.dept||'').trim()||d.dept==='办公室'))d.dept=r.dept;
      if(r.handler)d.handler=d.handler||r.handler;
      if(r.date)d.date=r.date;
      if(r.wh)d.wh=r.wh;
      if(r.source&&!String(d.source||'').trim())d.source=r.source;
      if(r.remark&&!String(d.remark||'').trim())d.remark=r.remark;
      toast('已关联 '+r.no+' · 单头已自动填写，可点“从登记单带入清单”');
    }
  }
  save();render();
};
function setHead(d,k,v){d[k]=v}
function fillFromRequest(d,sq){
  if(!sq||sq.type!=='request')return;
  d.unit=sq.unit||d.unit;
  d.dept=sq.dept||d.dept;
  d.handler=sq.handler||d.handler;
  if(!d.date||d.date===today())d.date=sq.date||d.date;
  if(!String(d.source||'').trim()&&String(sq.no||'').trim())d.source=sq.no;
  if(!d.remark&&sq.remark)d.remark=sq.remark;
  if(d.type==='register'){
    if(!d.wh||d.wh==='成品仓A'){
      var loc=String(sq.dept||'');
      if(loc&&OPT.WH.indexOf(loc)>=0)d.wh=loc;
      else if(/缝制一车间/.test(loc))d.wh='缝制一车间';
      else if(/裁剪车间/.test(loc))d.wh='裁剪车间';
      else if(/缝制二车间/.test(loc))d.wh='缝制二车间';
    }
  }
}
function fillIssueFromRequest(d,sq){
  if(!sq||sq.type!=='request')return;
  d.unit=sq.unit||d.unit;
  d.dept=sq.dept||d.dept;
  d.receiver=sq.receiver||d.receiver;
  d.handler=sq.handler||sq.receiver||d.handler;
  if(sq.material_type&&sq.material_type.length)d.issue_type=sq.material_type[0]==='生产领料'?'常规领用':d.issue_type;
  if(!d.date||d.date===today())d.date=sq.date||d.date;
  if(sq.remark&&!String(d.remark||'').trim())d.remark=sq.remark;
  if(!String(d.src_rk||'').trim()){
    var cands=(DB.doc||[]).filter(function(x){return x.type==='inbound'&&x.status==='已审批'});
    var hit=null;
    (sq.lines||[]).forEach(function(l){
      if(hit)return;
      cands.forEach(function(x){
        if(hit)return;
        (x.lines||[]).forEach(function(r){if(r.code===l.code)hit=x});
      });
    });
    if(hit)d.src_rk=hit.no;
  }
  if(sq.lines&&sq.lines.length&&(!d.lines||!d.lines.length||d.lines.every(function(l){return !num(l.qty)}))){
    d.lines=(sq.lines||[]).map(function(x){
      var mm=mat(x.code);
      var stocks=(DB.stock||[]).filter(function(s){return s.code===x.code&&num(s.avail)>0});
      var first=stocks[0]||null;
      return {code:x.code,name:mm.name||x.code,unit:x.unit||mm.unit,qty:num(x.qty)||'',price:mm.price||0,batch:first?first.batch:'',loc:first?first.loc:(d.loc||'')};
    });
    if(d.lines.length)toast('已关联 '+sq.no+' · 带入 '+d.lines.length+' 行申请数量，可用批次已预选');
  }
}
function fillIssueFromInbound(d,ib){
  if(!ib||ib.type!=='inbound')return;
  d.wh=ib.wh||d.wh;
  if(ib.unit&&(!String(d.unit||'').trim()||d.unit==='一监区'))d.unit=ib.unit;
  if(ib.remark&&!String(d.remark||'').trim())d.remark=ib.remark;
  if(ib.lines&&ib.lines.length&&(!d.lines||!d.lines.length||d.lines.every(function(l){return !num(l.qty)}))){
    d.lines=(ib.lines||[]).map(function(x){
      var mm=mat(x.code);
      var stocks=(DB.stock||[]).filter(function(s){return s.code===x.code&&num(s.avail)>0});
      var first=stocks[0]||null;
      return {code:x.code,name:mm.name||x.code,unit:x.unit||mm.unit,qty:num(x.qty)||'',price:mm.price||0,batch:first?first.batch:(x.batch||''),loc:first?first.loc:(x.loc||'')};
    });
    if(d.lines.length)toast('已关联 '+ib.no+' · 带入 '+d.lines.length+' 行，请核对实发数量与可用量');
  }
}
document.addEventListener('change',function(e){
  var el=e.target;if(!el.dataset)return;
  var multiBox=el.closest('.multi-select');
  if(multiBox&&el.matches('.multi-select-menu input[type="checkbox"]')){
    var d0=cur();if(!d0)return;var values=[].slice.call(multiBox.querySelectorAll('input:checked')).map(function(input){return input.value});
    d0[multiBox.dataset.multi]=values;save();refreshMultiSelect(multiBox,values);return;
  }
  if(el.dataset.role==='pick-target'){
    if(window._materialPicker){window._materialPicker.index=Number(el.value)||0;renderMaterialPicker()}
    return;
  }
  if(el.dataset.l!==undefined){
    var d=cur();if(!d)return;var i=Number(el.dataset.i),l=d.lines[i],k=el.dataset.l,v=el.value;
    if(k==='code'){var m=mat(v);l.code=v;l.unit=m.unit;l.price=m.price;l.name=m.name;l.pack=m.pack;l.sub=m.sub;
      if(d.type==='register'&&!l.barcode)l.barcode='QR-'+d.no+'-'+String(i+1).padStart(2,'0');
      if(d.type==='register'&&d.activeBatch){l.batch=d.activeBatch;l.region=registerBatchRegion(d,d.activeBatch);l.loc=l.region||l.loc}
      else if(m.mode==='一物一码')l.batch='';else if(!l.batch)l.batch=nextBatch();
      if(d.type==='issue'){var bs=DB.stock.filter(function(s){return s.wh===d.wh&&s.code===v&&num(s.avail)>0});l.batch=bs[0]?bs[0].batch:'';l.loc=bs[0]?bs[0].loc:l.loc}}
    else if(['qty','qty_src','qty_bad','price','pack','sub'].indexOf(k)>=0)l[k]=num(v);
    else{
      l[k]=v;
      if(d.type==='register'&&k==='batch'&&d.batchRegions&&typeof d.batchRegions==='object'){
        if(v&&!(d.batchRegions[v]))d.batchRegions[v]=l.region||l.loc||d.loc||'';
      }
      if(d.type==='register'&&k==='loc'&&l.batch){l.region=v;if(d.batchRegions)d.batchRegions[l.batch]=v}
    }
    save();render();return;
  }
  if(el.dataset.h){
    var d2=cur();if(!d2)return;setHead(d2,el.dataset.h,el.multiple?[].slice.call(el.selectedOptions).map(function(option){return option.value}):el.value);
    if(el.dataset.h==='wh')d2.lines.forEach(function(l){var s=st(d2.wh,l.code,l.batch);if(s)l.loc=s.loc});
    if(el.dataset.h==='src_sq'&&(d2.type==='register'||d2.type==='issue')){
      if(el.value){
        var sq=docBy(el.value);
        if(d2.type==='issue'&&sq){d2.src_sq=sq.no;fillIssueFromRequest(d2,sq)}
        else fillFromRequest(d2,sq);
      }
      save();render();return;
    }
    if(el.dataset.h==='src_rk'&&d2.type==='issue'){
      if(el.value){var ib=docBy(el.value);fillIssueFromInbound(d2,ib)}
      save();render();return;
    }
    if(el.dataset.h==='src_rk'&&d2.type==='wreturn'&&el.value){
      var wib=docBy(el.value);
      if(wib&&wib.type==='inbound'){
        if(!d2.wh||d2.wh==='成品仓A')d2.wh=wib.wh||d2.wh;
        if(wib.unit&&(!String(d2.dept||'').trim()||d2.dept==='办公室'))d2.dept=wib.unit;
        if(wib.lines&&wib.lines.length&&!d2.lines.length){
          d2.lines=wib.lines.map(function(x){var mm=mat(x.code);return newMaterialLine(d2,x.code,'',x.batch||'')||{code:x.code,batch:x.batch||'',qty:'',unit:x.unit||mm.unit,loc:x.loc||''}});
          toast('已关联 '+wib.no+' · 预填 '+d2.lines.length+' 行，请填本次退库数量');
        }
      }
      save();render();return;
    }
    if(el.dataset.h==='src_kc'&&d2.type==='return'&&el.value){
      var parts=String(el.value).split('|');
      if(parts.length>=4&&!d2.lines.length){
        var sk=DB.stock.filter(function(s){return s.wh===parts[0]&&s.code===parts[2]&&s.batch===parts[3]})[0];
        if(sk){var mm2=mat(sk.code);d2.lines=[{code:sk.code,batch:sk.batch,qty:'',unit:mm2.unit||sk.unit}];d2.wh=sk.wh;toast('已带入库存行，请填本次退库数量')}
      }
      save();render();return;
    }
    save();render();
  }
});
render();
enhanceSharedActions();
})();
</script>
</body></html>
