<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>仓库管理 · 物料码管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body{font-family:"PingFang SC","Microsoft YaHei"}.card{background:#fff;border:1px solid #cde8f7;border-radius:10px}.field{width:100%;min-height:40px;border:1px solid #9bcbe7;border-radius:8px;padding:8px 10px;font-size:12px;background:#fff}.qr-img{width:58px;height:58px;border:1px solid #cde8f7;border-radius:6px;background:#fff}.toggle{width:16px;height:16px;accent-color:#2563eb}.batch-print-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}.batch-print-button:disabled{cursor:not-allowed;opacity:.45}.generate-dialog{width:min(1120px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:12px;background:transparent}.generate-dialog::backdrop{background:rgba(15,30,58,.42)}.generate-panel{max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 70px rgba(15,30,58,.24)}@media(max-width:760px){.material-code-filters{align-items:flex-start}.material-code-filters>.field{width:100%!important}.batch-print-bar{display:grid;width:100%;grid-template-columns:minmax(0,1fr) minmax(0,1fr);justify-content:stretch}.batch-print-bar .field,.batch-print-bar label{grid-column:1/-1}.batch-print-button{width:100%}.generate-dialog{width:calc(100vw - 20px);max-height:calc(100vh - 20px)}.generate-panel{max-height:calc(100vh - 20px)}}
  </style>
  <script src="../assets/store.js"></script><script src="../assets/link.js"></script><script src="../assets/nav.js"></script>
</head>
<body class="bg-[#f2f5fa]">
<div class="flex"><aside class="w-52 bg-[#0f1e3a] text-slate-300 p-4 text-[13px] min-h-screen"></aside><div class="flex-1 min-w-0">
  <header class="bg-white border-b px-6 py-3 text-xs text-slate-400">仓库管理 / <b class="text-slate-700">物料码管理</b></header>
  <main class="p-6 space-y-4">
    <div><h1 class="text-xl font-extrabold text-slate-900">物料码管理</h1><p class="text-xs text-slate-500 mt-1">按“主批次-次批次-物料名（可选）-序号（可选）”生成二维码，并跟踪绑定和使用情况</p></div>
    <dialog id="generateDialog" class="generate-dialog" aria-labelledby="generateTitle" aria-describedby="generateHelp">
    <section class="generate-panel card p-4" aria-labelledby="generateTitle">
      <div class="flex items-start justify-between gap-3"><div><h2 id="generateTitle" class="text-sm font-extrabold text-slate-800">生成物料二维码</h2><p id="generateHelp" class="text-[11px] text-slate-400 mt-1">填写批次规则并生成二维码，生成后自动返回记录列表</p></div><div class="flex items-start gap-2"><span id="codePreview" class="max-w-full break-all rounded-lg bg-blue-50 px-3 py-2 text-xs font-mono font-bold text-blue-800" role="status" aria-live="polite">MB20260914-01-牛津布-001</span><button type="button" onclick="closeGenerateDialog()" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 hover:bg-slate-50" aria-label="关闭生成二维码窗口"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3 mt-4 text-xs">
        <label>主批次*<input id="mainBatch" class="field mt-1" value="MB20260914" required></label>
        <label>次批次*<input id="subBatch" class="field mt-1" value="01" required></label>
        <label>生成数量*<input id="generateCount" class="field mt-1" type="number" min="1" max="100" value="3" required></label>
        <label>初始序号<input id="serialStart" class="field mt-1" type="number" min="1" value="1"></label>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3 text-xs">
        <div class="rounded-xl border border-blue-100 bg-blue-50 p-3"><label class="flex items-center gap-2 font-bold text-blue-900"><input id="includeMaterial" class="toggle" type="checkbox" checked>编码中加入物料名</label><label class="block mt-2">物料名<select id="materialName" class="field mt-1"><option>牛津布</option><option>里布</option><option>拉链</option><option>纽扣</option><option>松紧带</option></select></label></div>
        <div class="rounded-xl border border-blue-100 bg-blue-50 p-3"><label class="flex items-center gap-2 font-bold text-blue-900"><input id="includeSerial" class="toggle" type="checkbox" checked>编码中加入序号</label><p class="mt-2 text-slate-500">批量生成时序号自动递增并补足三位，例如 001、002、003。</p></div>
      </div>
      <div id="generateError" class="hidden mt-3 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700" role="alert"></div>
      <div class="flex justify-end gap-2 mt-4"><button type="button" onclick="closeGenerateDialog()" class="min-h-[40px] rounded-lg border border-slate-200 bg-white px-5 py-2 text-xs text-slate-600">取消</button><button type="button" onclick="generateCodes()" class="min-h-[40px] rounded-lg bg-blue-600 px-5 py-2 text-xs font-bold text-white">自动生成二维码</button></div>
    </section>
    </dialog>
    <section class="card p-4" aria-labelledby="listTitle">
      <div class="flex items-center justify-between gap-3 flex-wrap"><div><h2 id="listTitle" class="text-sm font-extrabold text-slate-800">物料码记录</h2><p class="text-[11px] text-slate-400 mt-1">查看二维码是否已绑定物料箱、是否已被业务单据使用</p></div><span id="recordCount" class="text-xs text-slate-400" role="status"></span></div>
      <div class="material-code-filters flex items-start gap-2 flex-wrap mt-3 text-xs"><input id="search" class="field w-64" aria-label="搜索物料码" placeholder="搜索：编码 / 批次 / 物料"><select id="usageFilter" class="field w-auto" aria-label="使用状态筛选"><option value="">全部使用状态</option><option>未使用</option><option>已绑定</option><option>已使用</option></select><button id="generateTrigger" type="button" onclick="openGenerateDialog(this)" aria-haspopup="dialog" class="min-h-[40px] rounded-lg bg-blue-600 px-4 py-2 font-bold text-white"><i class="fa-solid fa-plus mr-1" aria-hidden="true"></i>生成</button><div class="batch-print-bar"><select id="batchFilter" class="field w-auto" aria-label="批次筛选"><option value="">全部批次</option></select><label class="flex min-h-[40px] items-center gap-2 rounded-lg border border-blue-200 bg-blue-50 px-3 font-bold text-blue-800"><input id="selectVisible" type="checkbox" class="toggle" aria-controls="codeBody">选择当前批次</label><span id="selectedCount" class="min-w-[64px] self-center text-slate-500" role="status" aria-live="polite">已选 0 个</span><button id="batchPrint" type="button" disabled aria-describedby="selectedCount" onclick="printSelected()" class="batch-print-button min-h-[40px] rounded-lg bg-blue-600 px-4 py-2 font-bold text-white"><i class="fa-solid fa-print mr-1" aria-hidden="true"></i>批量打印（0）</button></div></div>
      <div class="overflow-x-auto"><table class="w-full min-w-[980px] text-xs mt-3"><thead><tr class="text-left text-slate-400 border-b"><th class="py-2">选择</th><th>二维码</th><th>物料码</th><th>批次结构</th><th>生成时间</th><th>使用情况</th><th>关联信息</th><th>操作</th></tr></thead><tbody id="codeBody"></tbody></table></div>
      <div id="empty" class="hidden py-8 text-center text-xs text-slate-400">暂无匹配的物料码</div>
    </section>
  </main>
</div></div>
<div id="toast" class="hidden fixed z-50 bottom-6 left-1/2 -translate-x-1/2 rounded-full bg-slate-900 px-4 py-2.5 text-xs text-white" role="status" aria-live="polite"></div>
<script>
var rows=[
 {code:'MB20260912-01-牛津布-001',main:'MB20260912',sub:'01',material:'牛津布',serial:'001',time:'2026-09-12 08:25',status:'已使用',relation:'入库单 RK2026091209 · 箱贴 BX-01'},
 {code:'MB20260912-01-牛津布-002',main:'MB20260912',sub:'01',material:'牛津布',serial:'002',time:'2026-09-12 08:25',status:'已绑定',relation:'物料箱 BX-02 · 尚未入库'},
 {code:'MB20260912-02-拉链-001',main:'MB20260912',sub:'02',material:'拉链',serial:'001',time:'2026-09-12 09:10',status:'未使用',relation:'—'}
];
var selectedCodes=new Set();
var generateLastFocus=null;
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(function(){el.classList.add('hidden')},2000)}
function openGenerateDialog(source){generateLastFocus=source||document.activeElement;generateDialog.showModal();setTimeout(function(){mainBatch.focus()},0)}
function closeGenerateDialog(){if(generateDialog.open)generateDialog.close()}
function codeParts(serial){var parts=[mainBatch.value.trim(),subBatch.value.trim()];if(includeMaterial.checked)parts.push(materialName.value.trim());if(includeSerial.checked)parts.push(String(serial).padStart(3,'0'));return parts.filter(Boolean).join('-')}
function updatePreview(){codePreview.textContent=codeParts(Number(serialStart.value||1))||'请填写主批次和次批次';materialName.disabled=!includeMaterial.checked;serialStart.disabled=!includeSerial.checked}
function generateCodes(){var main=mainBatch.value.trim(),sub=subBatch.value.trim(),count=Number(generateCount.value),start=Number(serialStart.value||1),error=document.getElementById('generateError');error.classList.add('hidden');if(!main||!sub){error.textContent='主批次和次批次不能为空';error.classList.remove('hidden');mainBatch.focus();return}if(!Number.isInteger(count)||count<1||count>100){error.textContent='生成数量应为 1—100';error.classList.remove('hidden');generateCount.focus();return}var made=0;for(var i=0;i<count;i++){var serial=start+i,code=codeParts(serial);if(rows.some(function(r){return r.code===code}))continue;rows.unshift({code:code,main:main,sub:sub,material:includeMaterial.checked?materialName.value:'—',serial:includeSerial.checked?String(serial).padStart(3,'0'):'—',time:new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-'),status:'未使用',relation:'—'});made++}render();closeGenerateDialog();toast('已生成 '+made+' 个物料二维码')}
function statusClass(status){return status==='已使用'?'bg-emerald-100 text-emerald-700':status==='已绑定'?'bg-blue-100 text-blue-700':'bg-slate-100 text-slate-600'}
function batchKey(r){return r.main+'|'+r.sub}
function visibleRows(){var q=search.value.trim().toLowerCase(),status=usageFilter.value,batch=batchFilter.value;return rows.filter(function(r){return(!q||[r.code,r.main,r.sub,r.material,r.relation].join(' ').toLowerCase().indexOf(q)>-1)&&(!status||r.status===status)&&(!batch||batchKey(r)===batch)})}
function syncBatchOptions(){var current=batchFilter.value,keys=[];rows.forEach(function(r){var key=batchKey(r);if(keys.indexOf(key)===-1)keys.push(key)});batchFilter.innerHTML='<option value="">全部批次</option>'+keys.map(function(key){var p=key.split('|');return'<option value="'+esc(key)+'">主批次 '+esc(p[0])+' · 次批次 '+esc(p[1])+'</option>'}).join('');if(keys.indexOf(current)>-1)batchFilter.value=current}
function syncSelection(){var list=visibleRows(),visibleSelected=list.filter(function(r){return selectedCodes.has(r.code)}).length;selectVisible.checked=list.length>0&&visibleSelected===list.length;selectVisible.indeterminate=visibleSelected>0&&visibleSelected<list.length;selectedCount.textContent='已选 '+selectedCodes.size+' 个';batchPrint.disabled=!selectedCodes.size;batchPrint.innerHTML='<i class="fa-solid fa-print mr-1" aria-hidden="true"></i>批量打印（'+selectedCodes.size+'）'}
function toggleCode(input){if(input.checked)selectedCodes.add(input.value);else selectedCodes.delete(input.value);syncSelection()}
function toggleVisible(checked){visibleRows().forEach(function(r){if(checked)selectedCodes.add(r.code);else selectedCodes.delete(r.code)});render()}
function render(){syncBatchOptions();var list=visibleRows();codeBody.innerHTML=list.map(function(r){return'<tr class="border-b hover:bg-blue-50"><td class="py-2"><input type="checkbox" class="toggle" value="'+esc(r.code)+'" '+(selectedCodes.has(r.code)?'checked ':'')+'onchange="toggleCode(this)" aria-label="选择物料码 '+esc(r.code)+'"></td><td><img class="qr-img" alt="物料二维码 '+esc(r.code)+'" src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&margin=3&data='+encodeURIComponent(r.code)+'"></td><td><div class="font-mono font-bold text-blue-700 break-all max-w-[260px]">'+esc(r.code)+'</div></td><td><div>主：'+esc(r.main)+' · 次：'+esc(r.sub)+'</div><div class="text-slate-400 mt-1">物料：'+esc(r.material)+' · 序号：'+esc(r.serial)+'</div></td><td class="text-slate-500">'+esc(r.time)+'</td><td><span class="rounded-full px-2 py-1 '+statusClass(r.status)+'">'+esc(r.status)+'</span></td><td>'+esc(r.relation)+'</td><td><button type="button" class="text-red-600 font-bold" aria-label="删除物料码 '+esc(r.code)+'" onclick="deleteCode(\''+esc(r.code)+'\')">删除</button></td></tr>'}).join('');recordCount.textContent='共 '+list.length+' 条';empty.classList.toggle('hidden',list.length>0);syncSelection()}
function printSelected(){var list=rows.filter(function(r){return selectedCodes.has(r.code)});if(!list.length){toast('请先选择需要打印的二维码');return}var win=window.open('','_blank','width=920,height=720');if(!win){toast('浏览器阻止了打印窗口，请允许弹出窗口');return}var labels=list.map(function(r){var qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=5&data='+encodeURIComponent(r.code);return'<article class="label"><img src="'+qr+'" alt=""><div><h2>'+esc(r.material==='—'?'物料批次码':r.material)+'</h2><div class="code">'+esc(r.code)+'</div><dl><dt>主批次</dt><dd>'+esc(r.main)+'</dd><dt>次批次</dt><dd>'+esc(r.sub)+'</dd><dt>物料名称</dt><dd>'+esc(r.material)+'</dd><dt>序号</dt><dd>'+esc(r.serial)+'</dd><dt>使用状态</dt><dd>'+esc(r.status)+'</dd></dl></div></article>'}).join('');win.document.write('<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>物料二维码批量打印</title><style>@page{margin:10mm}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;color:#173b5d}.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm}.label{break-inside:avoid;display:grid;grid-template-columns:38mm 1fr;gap:5mm;align-items:center;min-height:58mm;padding:5mm;border:1px solid #9bcbe7;border-radius:3mm}.label img{width:38mm;height:38mm}.label h2{margin:0 0 2mm;font-size:15px}.code{font:700 10px Consolas,monospace;overflow-wrap:anywhere;color:#075985}.label dl{display:grid;grid-template-columns:18mm 1fr;gap:1.2mm 2mm;margin:3mm 0 0;font-size:10px}.label dt{color:#64748b}.label dd{margin:0;font-weight:700}@media print{.label{border-color:#94a3b8}}</style></head><body><main class="sheet">'+labels+'</main><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>');win.document.close();toast('已打开 '+list.length+' 个二维码的打印预览')}
function deleteCode(code){var row=rows.find(function(r){return r.code===code});if(!row)return;if(row.status==='已使用'){toast('已使用的物料码不能删除');return}if(!confirm('确认删除物料码 '+code+'？'))return;rows=rows.filter(function(r){return r.code!==code});selectedCodes.delete(code);render();toast('物料码已删除')}
[mainBatch,subBatch,generateCount,serialStart,materialName,includeMaterial,includeSerial].forEach(function(el){el.addEventListener('input',updatePreview);el.addEventListener('change',updatePreview)});search.addEventListener('input',render);usageFilter.addEventListener('change',render);batchFilter.addEventListener('change',render);selectVisible.addEventListener('change',function(){toggleVisible(this.checked)});generateDialog.addEventListener('close',function(){if(generateLastFocus)setTimeout(function(){generateLastFocus.focus()},0)});updatePreview();render();
</script>
</body></html>
