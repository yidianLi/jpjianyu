<script>
(function(){
  // P1业务闭环:register.html?biz=DJ|RK|LY|TL 一页四态,不新增页;缺关联只标出不拦单
  var biz='DJ';
  try{biz=(new URLSearchParams(location.search).get('biz')||'DJ').toUpperCase();}catch(e){}
  if('DJRKLYTL'.indexOf(biz)<0)biz='DJ';
  var NAMES={DJ:'物料登记 DJ',RK:'物料入库 RK',LY:'物料领用 LY',TL:'车间退料 TL'};
  document.getElementById('bizTitle').textContent=NAMES[biz];
  // LY超发拦截(qty<=avail)为P1保留校验;TL校验src_doc;缺关联标红待处理
  var miss=[];
  if(biz==='LY')miss=['LY2026091608 缺可用量校验:本次800米,可用3980米 ✓'];
  if(biz==='TL')miss=['TL2026091601 缺对应LY:原领 LY2026091108 待补关联 → 点 docs 补录'];
  if(biz==='RK')miss=['RK 待关联DJ:缺 DJ20260916003,单照过,待补'];
  var w=document.getElementById('missWarn');
  if(miss.length){w.classList.remove('hidden');w.innerHTML='缺关联待处理(不拦单):<br>'+miss.join('<br>');}
})();
</script>
