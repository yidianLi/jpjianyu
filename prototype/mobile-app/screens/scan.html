<div class="h-[54px] bg-[#10233f] text-white flex justify-between items-end px-7 pb-2 text-[13px] font-semibold shrink-0"><span>09:41</span><span class="flex gap-1.5 items-center text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
<div class="flex items-center px-4 py-3 bg-white border-b border-slate-200 shrink-0"><a href="home.html" class="text-slate-500 mr-2"><i class="fa-solid fa-chevron-left"></i></a><b class="text-[15px]">扫码作业</b><span class="ml-auto text-[11px] text-slate-400">一维码/二维码 · 按扫描键</span></div>
<div class="flex-1 overflow-y-auto p-3 space-y-3">
<div class="rounded-2xl h-[240px] relative flex items-center justify-center overflow-hidden" style="background:radial-gradient(120% 90% at 50% 30%,#12263f 0%,#050b14 100%)"><img src="https://images.unsplash.com/photo-1587293852726-70cdb56c2866?w=600&q=60&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-20"><div class="relative w-[200px] h-[200px]"><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-r-0 border-b-0 rounded-tl-lg left-0 top-0"></div><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-l-0 border-b-0 rounded-tr-lg right-0 top-0"></div><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-r-0 border-t-0 rounded-bl-lg left-0 bottom-0"></div><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-l-0 border-t-0 rounded-br-lg right-0 bottom-0"></div><div class="laser"></div></div><p class="absolute bottom-3 text-emerald-200 font-mono text-[11px]">先扫库位码，再扫物料码</p><span class="absolute top-2.5 right-2.5 w-9 h-9 rounded-full bg-white/10 text-amber-200 grid place-items-center"><i class="fa-solid fa-bolt"></i></span></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">第0步 · 关联单据（可选，不填只存证）</p><div class="flex gap-2"><input id="docNo" value="" class="flex-1 h-[46px] border-[1.5px] border-slate-200 rounded-xl px-3 font-mono font-bold text-center" placeholder="如 LY2026091608"><button class="border-[1.5px] border-slate-200 rounded-xl px-4 font-bold text-[13px]" id="toReg">转入登记 →</button></div><p class="text-[10px] text-slate-400 mt-1" id="docTip">扫码将绑定该单据；转入登记把已扫条码带进登记页</p></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">第1步 · 库位码（先扫库位）</p><div class="flex gap-2"><input id="locCode" value="WH-A-01" class="flex-1 h-[46px] border-[1.5px] border-emerald-300 rounded-xl px-3 font-mono font-bold text-center" placeholder="如 WH-A-01"><button class="bg-emerald-600 text-white font-bold rounded-xl px-5" id="locGo">定位</button></div><p class="text-[10px] text-slate-400 mt-1" id="locTip">当前库位：WH-A-01（外仓）</p></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">第2步 · 物料条码</p><div class="flex gap-2"><input id="scanCode" data-scan-input value="SB20260910003-01" class="flex-1 h-[46px] border-[1.5px] border-slate-200 rounded-xl px-3 font-mono font-bold text-center"><button class="bg-[#2f6fe4] text-white font-bold rounded-xl px-5" id="scanGo">识别</button></div><div class="grid grid-cols-3 gap-2 mt-2"><button class="border-[1.5px] border-slate-200 rounded-xl py-2 text-[12px] font-bold" data-demo-scan="SB20260910003-01">SB-01 正常</button><button class="border-[1.5px] border-slate-200 rounded-xl py-2 text-[12px] font-bold" data-demo-scan="SB20260910003-01DUP">重复码</button><button class="border-[1.5px] border-slate-200 rounded-xl py-2 text-[12px] font-bold" data-demo-scan="BADCODE">无效码</button></div></div>
<div class="flex justify-between items-baseline px-1"><h2 class="font-bold text-[15px]">本次扫码记录</h2><span class="text-[11px] text-slate-500" id="scanCount">2 条</span></div>
<div id="scanList">
<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px]"><span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 grid place-items-center"><i class="fa-solid fa-check"></i></span><b class="font-mono">SB20260910003-01</b><span class="text-slate-500">牛津布 200米</span><a class="ml-auto text-[11px] text-blue-600 font-bold" href="data.html?code=SB20260910003-01">查看溯源 →</a></div>
<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px]"><span class="w-6 h-6 rounded-lg bg-red-100 text-red-500 grid place-items-center"><i class="fa-solid fa-xmark"></i></span><b class="font-mono">BADCODE</b><span class="text-slate-500">无效码</span><span class="ml-auto text-[10px] text-slate-400">09:40</span></div>
</div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">业务类型（决定建单方向）</p><div class="flex gap-2"><select id="bizSel" class="flex-1 h-[46px] border-[1.5px] border-slate-200 rounded-xl px-2 font-bold text-[13px]"></select><span class="text-[10px] text-slate-400 self-center">扫码即按此类型建单</span></div></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><div class="flex justify-between font-bold text-[13px]"><b>提交确认摘要</b><span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">待办</span></div><p class="text-[11px] text-slate-500 mt-1" id="scanSummary">扫码0 · 库位WH-A-01 · 业务类型RK</p><div class="grid grid-cols-2 gap-2 mt-2"><button id="draftBtn" class="border-[1.5px] border-slate-200 rounded-xl py-2.5 font-bold text-[13px]">弱网存草稿</button><button id="submitBtn" class="bg-[#2f6fe4] text-white rounded-xl py-2.5 font-bold text-[13px]">提交</button></div></div>
<script src="../pda-scan.js"></script>
<script src="../app-data.js"></script>
<script src="../api-client.js"></script>
<script>

(function(){
  /* 扫码作业:PDA 硬扫(广播/键盘楔)→ 查码 → 数量/业务类型 → 真提交建单
   * 关键点:提交体用 lines[{code,material_code,qty,unit,loc,batch_no}],
   * 后端 /app/submit 按条码解析物料/批次/单位,缺数量按 1 件计(扫一件记一件)。*/
  var BIZ=[{k:'RK',n:'入库 RK'},{k:'DJ',n:'登记 DJ'},{k:'LY',n:'领用 LY'},{k:'TK',n:'退库 TK'},{k:'TL',n:'调仓领用 TL'}];
  var list=[];            // {code,ok,msg,material,batch,unit,qty,loc,t}
  var loc='WH-A-01';
  var biz='RK';

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function toast(m){var t=el('toast');if(!t)return;t.textContent=m;t.classList.remove('hidden');if(toast._t)clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add('hidden');},2600);}
  function nowT(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function docNo(){return String(el('docNo').value||'').trim();}
  function validRows(){return list.filter(function(s){return s.ok;});}

  function paintBiz(){
    el('bizSel').innerHTML=BIZ.map(function(b){return '<option value="'+b.k+'"'+(b.k===biz?' selected':'')+'>'+b.n+'</option>';}).join('');
  }
  function paint(){
    var rows=validRows();
    el('scanCount').textContent=list.length+' 条';
    el('scanList').innerHTML=list.map(function(s,i){
      if(!s.ok){
        return '<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px]"><span class="w-6 h-6 rounded-lg bg-red-100 text-red-500 grid place-items-center"><i class="fa-solid fa-xmark"></i></span><b class="font-mono">'+esc(s.code)+'</b><span class="text-slate-500">'+esc(s.msg)+'</span><span class="ml-auto text-[10px] text-slate-400">'+esc(s.t||'')+'</span></div>';
      }
      return '<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px] flex-wrap"><span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 grid place-items-center"><i class="fa-solid fa-check"></i></span><b class="font-mono">'+esc(s.code)+'</b><span class="text-slate-500">'+esc(s.msg)+'</span>'
        +'<span class="ml-auto flex items-center gap-1"><button class="w-7 h-7 rounded-lg border border-slate-200 font-bold" data-qty-min="'+i+'">−</button>'
        +'<input class="w-14 h-8 text-center border border-slate-200 rounded-lg font-extrabold" data-qty="'+i+'" value="'+esc(String(s.qty||1))+'">'
        +'<button class="w-7 h-7 rounded-lg border border-slate-200 font-bold" data-qty-plus="'+i+'">＋</button>'
        +'<span class="text-[11px] text-slate-400">'+esc(s.unit||'')+'</span></span></div>';
    }).join('');
    el('scanList').querySelectorAll('[data-qty]').forEach(function(inp){
      inp.onchange=function(){var i=+inp.getAttribute('data-qty');var v=parseFloat(inp.value);list[i].qty=(isNaN(v)||v<=0)?1:v;paint();};
    });
    el('scanList').querySelectorAll('[data-qty-min]').forEach(function(b){
      b.onclick=function(){var i=+b.getAttribute('data-qty-min');list[i].qty=Math.max(1,(list[i].qty||1)-1);paint();};
    });
    el('scanList').querySelectorAll('[data-qty-plus]').forEach(function(b){
      b.onclick=function(){var i=+b.getAttribute('data-qty-plus');list[i].qty=(list[i].qty||1)+1;paint();};
    });
    var bizName=(BIZ.filter(function(b){return b.k===biz;})[0]||{}).n||biz;
    el('scanSummary').textContent=bizName+' · 库位'+loc+' · 扫码'+rows.length+' · 合计'+rows.reduce(function(a,s){return a+(Number(s.qty)||1);},0)+' 件';
  }

  /* 扫码:先库位后物料;查码用 /app/lookup(无副作用,不判重) */
  function setLoc(code){
    var c=String(code||'').trim();if(!c)return;
    loc=c;
    el('locCode').value=c;
    el('locTip').textContent='当前库位：'+c+'（扫码头已定位）';
    paint();
  }
  function handle(code){
    code=String(code||'').trim();
    if(!code)return;
    if(list.some(function(s){return s.code===code&&s.ok;})){list.unshift({code:code,ok:false,msg:'重复码已拦截',t:nowT()});paint();return;}
    if(!window.AppApi){list.unshift({code:code,ok:false,msg:'未登录/离线，无法查码',t:nowT()});paint();return;}
    AppApi.lookup(code).then(function(r){
      var j=r&&r.data?r.data:null;
      if(!r||!r.ok||!j){list.unshift({code:code,ok:false,msg:(r&&r.msg)||'无效码',t:nowT()});paint();return;}
      if(j.kind==='DOC'){
        el('docNo').value=j.doc_no;
        list.unshift({code:code,ok:true,msg:'单据 '+j.doc_no+'（'+j.doc_type+' '+j.biz_status+'）',t:nowT()});
        paint();toast('已绑定单据 '+j.doc_no);return;
      }
      if(j.kind==='LOC'){setLoc(j.loc||code);list.unshift({code:code,ok:true,msg:'库位 '+(j.loc||code)+'（'+(j.wh||'')+'）',t:nowT()});paint();return;}
      list.unshift({code:code,ok:true,msg:(j.name||j.material)+' · '+(j.batch||'无批次'),material:j.material,batch:j.batch||'',unit:j.unit||'',qty:1,t:nowT()});
      paint();
    }).catch(function(){list.unshift({code:code,ok:false,msg:'查码失败（网络）',t:nowT()});paint();});
  }
  el('scanGo').onclick=function(){handle(el('scanCode').value);};
  el('locGo').onclick=function(){setLoc(el('locCode').value);};
  if(window.PdaScan){
    PdaScan.bind('#scanCode',handle);
    PdaScan.bind('#locCode',setLoc);
  }

  /* 提交:组装 lines(条码+数量+单位+库位)→ 真实建单 → 照片挂附件 */
  function payload(draft){
    var lines=validRows().map(function(s){
      return {code:s.code,material_code:s.material||'',batch_no:s.batch||'',qty:Number(s.qty||1),unit:s.unit||'',loc:loc};
    });
    return {biz:biz,doc:docNo(),loc:loc,lines:lines,draft:!!draft,at:new Date().toISOString()};
  }
  el('submitBtn').onclick=function(){
    var rows=validRows();
    if(!rows.length){toast('还没有有效扫码');return;}
    var btn=this;btn.disabled=true;btn.textContent='提交中…';
    AppApi.submit(payload(false)).then(function(r){
      btn.disabled=false;btn.textContent='提交';
      var d=(r&&r.data)||{};
      if(r&&r.ok&&!r.queued&&d.doc_no){
        toast('提交成功 ✓ 单号 '+(d.biz_name||biz)+' '+d.doc_no);
        el('docNo').value=d.doc_no;
      }else if(r&&r.ok&&r.queued){
        toast('资料不全已暂存待补全(需物料/数量/单位)');
      }else{
        toast('提交失败：'+((r&&r.msg)||'未知'));
      }
    }).catch(function(){btn.disabled=false;btn.textContent='提交';toast('网络异常');});
  };
  el('draftBtn').onclick=function(){
    var rows=validRows();
    if(!rows.length){toast('还没有有效扫码');return;}
    AppApi.submit(payload(true)).then(function(r){
      var d=(r&&r.data)||{};
      if(r&&r.ok){toast(d.doc_no?('已存草稿 '+d.doc_no):'已存草稿，待同步');}
      else toast('存草稿失败：'+((r&&r.msg)||'未知'));
    }).catch(function(){toast('网络异常');});
  };
  el('toReg').onclick=function(){
    var oks=validRows().map(function(s){return s.code;});
    if(!oks.length){toast('还没有有效扫码');return;}
    try{localStorage.setItem('wms_scan_handoff',JSON.stringify({biz:biz,loc:loc,doc:docNo(),codes:oks,ts:Date.now()}));}catch(e){}
    location.href='register.html?biz='+biz;
  };
  el('bizSel').onchange=function(){biz=this.value;paint();};

  try{var qd=new URLSearchParams(location.search).get('doc');if(qd){el('docNo').value=qd;}}catch(e){}
  try{var qb=new URLSearchParams(location.search).get('biz');if(qb&&BIZ.some(function(b){return b.k===qb.toUpperCase();})){biz=qb.toUpperCase();}}catch(e){}
  paintBiz();
  paint();
})();


</script>


</div>
