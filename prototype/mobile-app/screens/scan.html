<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫码作业 · 现场作业APP</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{font-family:"PingFang SC","Microsoft YaHei",system-ui;background:#eef2f7;margin:0}.laser{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,#35d08c,transparent);box-shadow:0 0 12px #35d08c;animation:lz 2.1s ease-in-out infinite}@keyframes lz{0%,100%{top:22%}50%{top:76%}}</style></head><body class="w-full max-w-[393px] h-[100dvh] mx-auto flex flex-col overflow-hidden bg-[#eef2f7]">
<div class="h-[54px] bg-[#10233f] text-white flex justify-between items-end px-7 pb-2 text-[13px] font-semibold shrink-0"><span>09:41</span><span class="flex gap-1.5 items-center text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
<div class="flex items-center px-4 py-3 bg-white border-b border-slate-200 shrink-0"><a href="home.html" class="text-slate-500 mr-2"><i class="fa-solid fa-chevron-left"></i></a><b class="text-[15px]">扫码作业</b><span class="ml-auto text-[11px] text-slate-400">先库位后物料+振动</span></div>
<div class="flex-1 overflow-y-auto p-3 space-y-3">
<div class="rounded-2xl h-[240px] relative flex items-center justify-center overflow-hidden" style="background:radial-gradient(120% 90% at 50% 30%,#12263f 0%,#050b14 100%)"><img src="https://images.unsplash.com/photo-1587293852726-70cdb56c2866?w=600&q=60&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-20"><div class="relative w-[200px] h-[200px]"><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-r-0 border-b-0 rounded-tl-lg left-0 top-0"></div><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-l-0 border-b-0 rounded-tr-lg right-0 top-0"></div><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-r-0 border-t-0 rounded-bl-lg left-0 bottom-0"></div><div class="absolute w-[30px] h-[30px] border-[3.5px] border-emerald-400 border-l-0 border-t-0 rounded-br-lg right-0 bottom-0"></div><div class="laser"></div></div><p class="absolute bottom-3 text-emerald-200 font-mono text-[11px]">先扫库位码，再扫物料码</p><span class="absolute top-2.5 right-2.5 w-9 h-9 rounded-full bg-white/10 text-amber-200 grid place-items-center"><i class="fa-solid fa-bolt"></i></span></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">第0步 · 关联单据（可选，不填只存证）</p><div class="flex gap-2"><input id="docNo" value="" class="flex-1 h-[46px] border-[1.5px] border-slate-200 rounded-xl px-3 font-mono font-bold text-center" placeholder="如 LY2026091608"><button class="border-[1.5px] border-slate-200 rounded-xl px-4 font-bold text-[13px]" id="toReg">转入登记 →</button></div><p class="text-[10px] text-slate-400 mt-1" id="docTip">扫码将绑定该单据；转入登记把已扫条码带进登记页</p></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">第1步 · 库位码（先扫库位）</p><div class="flex gap-2"><input id="locCode" value="WH-A-01" class="flex-1 h-[46px] border-[1.5px] border-emerald-300 rounded-xl px-3 font-mono font-bold text-center" placeholder="如 WH-A-01"><button class="bg-emerald-600 text-white font-bold rounded-xl px-5" id="locGo">定位</button></div><p class="text-[10px] text-slate-400 mt-1" id="locTip">当前库位：WH-A-01（外仓）</p></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">第2步 · 物料条码</p><div class="flex gap-2"><input id="scanCode" data-scan-input value="SB20260910003-01" class="flex-1 h-[46px] border-[1.5px] border-slate-200 rounded-xl px-3 font-mono font-bold text-center"><button class="bg-[#2f6fe4] text-white font-bold rounded-xl px-5" id="scanGo">识别</button></div><div class="grid grid-cols-3 gap-2 mt-2"><button class="border-[1.5px] border-slate-200 rounded-xl py-2 text-[12px] font-bold" data-demo-scan="SB20260910003-01">SB-01 正常</button><button class="border-[1.5px] border-slate-200 rounded-xl py-2 text-[12px] font-bold" data-demo-scan="SB20260910003-01DUP">重复码</button><button class="border-[1.5px] border-slate-200 rounded-xl py-2 text-[12px] font-bold" data-demo-scan="BADCODE">无效码</button></div></div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-bold text-slate-500 mb-1.5">现场照片（PDA 拍照自动回传 · 存证）</p><div id="photoStrip" class="flex gap-2 overflow-x-auto"></div><p class="text-[10px] text-slate-400 mt-1" id="photoTip">扫码头拍照后自动回传；提交时随单据上传并挂为附件</p></div>
<div class="flex justify-between items-baseline px-1"><h2 class="font-bold text-[15px]">本次扫码记录</h2><span class="text-[11px] text-slate-500" id="scanCount">2 条</span></div>
<div id="scanList">
<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px]"><span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 grid place-items-center"><i class="fa-solid fa-check"></i></span><b class="font-mono">SB20260910003-01</b><span class="text-slate-500">牛津布 200米</span><a class="ml-auto text-[11px] text-blue-600 font-bold" href="data.html?code=SB20260910003-01">查看溯源 →</a></div>
<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px]"><span class="w-6 h-6 rounded-lg bg-red-100 text-red-500 grid place-items-center"><i class="fa-solid fa-xmark"></i></span><b class="font-mono">BADCODE</b><span class="text-slate-500">无效码</span><span class="ml-auto text-[10px] text-slate-400">09:40</span></div>
</div>
<div class="bg-white border border-slate-200 rounded-2xl p-3"><div class="flex justify-between font-bold text-[13px]"><b>提交确认摘要</b><span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">待办</span></div><p class="text-[11px] text-slate-500 mt-1" id="scanSummary">照片3 · 扫码1 · 登录账号+照片存证 · PDA-03</p><div class="grid grid-cols-2 gap-2 mt-2"><button id="draftBtn" class="border-[1.5px] border-slate-200 rounded-xl py-2.5 font-bold text-[13px]">弱网存草稿</button><button id="submitBtn" class="bg-[#2f6fe4] text-white rounded-xl py-2.5 font-bold text-[13px]">提交</button></div></div>
<script src="../pda-scan.js"></script>
<script src="../app-data.js"></script>
<script src="../api-client.js"></script>
<script>
(function(){
  var list=[{code:'SB20260910003-01',ok:true,msg:'牛津布 200米',t:'09:41'},{code:'BADCODE',ok:false,msg:'无效码',t:'09:40'}];
  var photos=[];
  var box=FieldDB.get().barcodes||{};
  var loc='WH-A-01';
  try{var qd=new URLSearchParams(location.search).get('doc');if(qd){document.getElementById('docNo').value=qd;}}catch(e){}
  function docNo(){return String(document.getElementById('docNo').value||'').trim();}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function paint(){
    document.getElementById('scanCount').textContent=list.length+' 条';
    document.getElementById('scanList').innerHTML=list.map(function(s){
      return '<div class="bg-white border border-slate-200 rounded-xl p-2.5 flex gap-2 items-center text-[12px]"><span class="w-6 h-6 rounded-lg '+(s.ok?'bg-emerald-100 text-emerald-600':'bg-red-100 text-red-500')+' grid place-items-center"><i class="fa-solid '+(s.ok?'fa-check':'fa-xmark')+'"></i></span><b class="font-mono">'+esc(s.code)+'</b><span class="text-slate-500">'+esc(s.msg)+'</span>'+(s.ok?'<a class="ml-auto text-[11px] text-blue-600 font-bold" href="data.html?code='+encodeURIComponent(s.code)+'">查看溯源 →</a>':'<span class="ml-auto text-[10px] text-slate-400">'+esc(s.t)+'</span>')+'</div>';
    }).join('');
    document.getElementById('scanSummary').textContent='库位'+loc+' · 扫码'+list.filter(function(s){return s.ok;}).length+' · 照片'+photos.length+' · 登录账号+照片存证 · PDA-03';
    paintPhotos();
  }
  // 照片:PDA 壳拍照广播回传(PdaPhotoFeed → PdaPhoto.on),提交时上传并挂为单据附件
  function paintPhotos(){
    var strip=document.getElementById('photoStrip');
    if(!strip)return;
    if(!photos.length){strip.innerHTML='<span class="text-[11px] text-slate-400">暂无照片</span>';return;}
    strip.innerHTML=photos.map(function(p){
      return '<div class="relative shrink-0"><img src="'+p.dataUrl+'" class="w-16 h-16 object-cover rounded-lg border border-slate-200"><span class="absolute -top-1 -right-1 min-w-4 h-4 px-1 rounded-full bg-white text-[9px] text-slate-500 grid place-items-center">'+esc(p.st)+'</span></div>';
    }).join('');
  }
  function onPhoto(dataUrl,meta){
    if(!dataUrl)return;
    photos.unshift({dataUrl:dataUrl,meta:meta||{},st:photos.length+1});
    paint();
  }
  if(window.PdaPhoto&&PdaPhoto.on){PdaPhoto.on(onPhoto);}
  else{document.addEventListener('pdaPhoto',function(e){onPhoto(e.detail&&e.detail.dataUrl,e.detail&&e.detail.meta);});}
  function uploadPhotos(docNo){
    if(!docNo||!photos.length)return;
    photos.filter(function(p){return p.st!=='已传';}).forEach(function(p){
      AppApi.uploadPhoto(p.dataUrl).then(function(u){
        if(u&&u.ok&&u.data&&u.data.url){
          return AppApi.addAttachment(docNo,u.data.url,'照片').then(function(a){if(a&&a.ok)p.st='已传';});
        }
      }).catch(function(){}).then(function(){paint();});
    });
  }
  document.getElementById('locGo').onclick=function(){
    loc=String(document.getElementById('locCode').value||'').trim()||loc;
    document.getElementById('locTip').textContent='当前库位：'+loc;
    paint();
  };
  function handle(code){
    code=String(code||'').trim();
    if(!code)return;
    if(!loc){list.push({code:code,ok:false,msg:'请先扫库位码',t:'now'});paint();return;}
    if(list.some(function(s){return s.code===code&&s.ok;})){list.push({code:code,ok:false,msg:'重复码已拦截',t:'now'});paint();return;}
    if(window.AppApi){AppApi.scan(code,docNo(),loc).then(function(r){paint();});}
    var hit=box[code];
    if(!hit){list.push({code:code,ok:false,msg:'无效码',t:'now'});paint();return;}
    list.unshift({code:code,ok:true,msg:hit.name+' '+hit.qty+hit.unit+' · '+loc,t:'now'});paint();
  }
  document.getElementById('scanGo').onclick=function(){handle(document.getElementById('scanCode').value);};
  document.querySelectorAll('[data-demo-scan]').forEach(function(b){b.onclick=function(){document.getElementById('scanCode').value=b.getAttribute('data-demo-scan');handle(b.getAttribute('data-demo-scan'));};});
  PdaScan.bind('#scanCode',handle);
  PdaScan.bind('#locCode',function(code){document.getElementById('locCode').value=code;document.getElementById('locGo').onclick();});
  document.getElementById('toReg').onclick=function(){
    var oks=list.filter(function(s){return s.ok;}).map(function(s){return s.code;});
    if(!oks.length){alert('还没有有效扫码');return;}
    try{localStorage.setItem('wms_scan_handoff',JSON.stringify({biz:'DJ',loc:loc,doc:docNo(),codes:oks,ts:Date.now()}));}catch(e){}
    location.href='register.html?biz=DJ';
  };
  paint();
  // 提交/草稿:把已扫有效码作为存证提交(支持离线队列)
  function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.remove('hidden');if(toast._t)clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add('hidden');},2400);}
  function payload(){ return {biz:'SCAN', doc:docNo(), loc:loc, codes:list.filter(function(s){return s.ok;}).map(function(s){return s.code;}), at:new Date().toISOString()}; }
  document.getElementById('submitBtn').onclick=function(){
    var oks=list.filter(function(s){return s.ok;});
    if(!oks.length){toast('还没有有效扫码');return;}
    var btn=this; btn.disabled=true;
    AppApi.submit(payload()).then(function(r){
      btn.disabled=false;
      if(r&&r.ok){
        uploadPhotos((r.data&&r.data.doc_no)||'');
        toast(r.queued||(r.data&&r.data.queued)?'已存草稿，待同步':'提交成功 ✓');
      }
      else toast('提交失败：'+((r&&r.msg)||'未知'));
    }).catch(function(){ btn.disabled=false; toast('网络异常'); });
  };
  document.getElementById('draftBtn').onclick=function(){
    AppApi.submit(Object.assign(payload(),{draft:true})).then(function(r){
      toast(r&&r.ok?(r.queued?'已存草稿，待同步':'已存草稿 ✓'):'存草稿失败');
    }).catch(function(){ toast('网络异常'); });
  };
})();
</script>
</div>
