<script src="../api-client.js"></script>
<script>
(function(){
  function tok(){return localStorage.getItem('wms_app_token')||localStorage.getItem('wms_token')||'';}
  function api(path,opt){
    var base=(window.AppApi&&AppApi.cfg.baseUrl)||(location.protocol+'//'+location.host+'/api/v1');
    opt=opt||{};
    return fetch(base+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok(),'X-Device-Id':'PDA-03'},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
  }
  function qlen(){try{return JSON.parse(localStorage.getItem('wms_app_offline_q_v1')||'[]').length;}catch(e){return 0;}}
  function paintQ(){document.getElementById('meQueue').textContent='离线队列 '+qlen()+' 条';}
  function load(){
    paintQ();
    api('/web/auth/me').then(function(j){
      var m=(j&&j.data)||{};
      document.getElementById('meName').textContent=(m.name||m.username||'未知')+' · '+(m.username||'');
      document.getElementById('meScope').textContent='范围 '+(m.data_scope||'—')+' · 角色 '+((m.roles||[]).join(',')||'—');
    }).catch(function(){document.getElementById('meName').textContent='离线 · 未登录';});
  }
  document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){
    api('/web/auth/login',{method:'POST',body:{username:b.dataset.role}}).then(function(j){
      var t=j&&j.data&&j.data.token;
      if(t){localStorage.setItem('wms_app_token',t);if(window.AppApi)AppApi.cfg.token=t;load();}
    }).catch(function(){});
  };});
  document.getElementById('meSync').onclick=function(){
    if(window.AppApi&&AppApi.flushQueue){AppApi.flushQueue().then(function(){paintQ();});}
    else paintQ();
  };
  load();
})();
</script>
</body></html>
