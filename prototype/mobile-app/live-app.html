<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10233f">
<title>现场作业APP · 原型</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --navy:#10233f;--navy2:#1b3557;--blue:#2f6fe4;--teal:#0d9488;--amber:#d97706;--red:#dc2626;
  --bg:#eef2f7;--card:#ffffff;--line:#dde5ee;--ink:#152338;--mut:#68798e;--grn:#0f8a4d;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#0b1626;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
/* 设备框（桌面演示） */
#frame{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center}
@media(min-width:521px){
  #frame{padding:22px}
  #app{width:400px;height:min(852px,calc(100dvh - 44px));border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 10px #05090f,0 0 0 12px #1d2a3c}
}
#app{width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
/* 状态栏 */
.statusbar{height:calc(26px + var(--safe-t));padding:var(--safe-t) 16px 0;background:var(--navy);color:#cfe0f5;font-size:11px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.statusbar .sigs{display:flex;gap:6px;align-items:center}
.offline .sigs .net{color:#f59e0b}
/* 头部 */
.apphead{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:10px 16px 12px;flex-shrink:0}
.apphead .row1{display:flex;align-items:center;gap:10px}
.apphead .who{flex:1;min-width:0}
.apphead .who b{font-size:15px;display:block}
.apphead .who span{font-size:10.5px;color:#9fb4d0;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.on{background:#0d9488;color:#fff}.pill.off{background:#f59e0b;color:#fff}
.iconbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.10);color:#dbe7f7;display:grid;place-items:center;font-size:16px;position:relative}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 3px}
/* 快捷宫格 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.quick button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 2px 7px;color:#eaf1fb;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px}
.quick button:active{transform:scale(.96);background:rgba(47,111,228,.35)}
.quick i{font-size:17px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#eaf1ff;color:var(--blue);font-style:normal}
.quick button.q-amber i{background:#fdeed7;color:var(--amber)}
.quick button.q-teal i{background:#d8f3ef;color:var(--teal)}
.quick button.q-red i{background:#fde3e3;color:var(--red)}
/* 主内容 */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px}
.sect h2{margin:0;font-size:15px}
.sect span{font-size:11px;color:var(--mut)}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.card.tappro{border-left:4px solid var(--amber)}
.card.tblue{border-left:4px solid var(--blue)}
.card.tgrn{border-left:4px solid var(--grn)}
.card.tred{border-left:4px solid var(--red)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .top b{font-size:13.5px}
.tag{font-size:10px;font-weight:800;padding:2.5px 9px;border-radius:99px;white-space:nowrap}
.tag.g-blue{background:#e8f0fe;color:#1d5fd0}.tag.g-amber{background:#fdeed7;color:#b45309}
.tag.g-grn{background:#dff5ea;color:#0f8a4d}.tag.g-red{background:#fde3e3;color:#b91c1c}
.tag.g-mut{background:#edf1f6;color:#64748b}
.sub{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed #edf2f8}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mut)}
/* 按钮 */
.btn{min-height:46px;border-radius:13px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 16px}
.btn.big{width:100%}
.btn.pri{background:var(--blue);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{border:1.5px solid var(--line);background:#fff;color:#33455c}
.btn.dark{background:#182f4e;color:#fff}
.btn.sm{min-height:38px;font-size:12.5px;padding:0 13px;border-radius:11px}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.95)}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
/* 表单 */
.f{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.f:focus{outline:2px solid #9dc0f5;outline-offset:0}
.f.big{font-size:17px;font-weight:800;letter-spacing:.5px}
.flab{font-size:11.5px;font-weight:800;color:#42586c;margin:10px 2px 5px;display:flex;justify-content:space-between}
.flab i{color:var(--red);font-style:normal}
/* 数字键盘行 */
.qtyrow{display:flex;gap:8px;align-items:center}
.qtyrow .f{flex:1;text-align:center}
.step{width:52px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:#33455c}
/* 扫码取景框 */
.scanbox{background:radial-gradient(120% 90% at 50% 30%,#12263f 0%,#050b14 100%);border-radius:18px;height:240px;position:relative;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.scanbox .frame{width:200px;height:200px;position:relative}
.scanbox .c{position:absolute;width:30px;height:30px;border:3.5px solid #35d08c}
.scanbox .c.tl{left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.scanbox .c.tr{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.scanbox .c.bl{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.scanbox .c.br{right:0;bottom:border:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scanbox .laser{position:absolute;left:12px;right:12px;top:50%;height:2px;background:linear-gradient(90deg,transparent,#35d08c,transparent);box-shadow:0 0 12px #35d08c;animation:laser 2.1s ease-in-out infinite}
@keyframes laser{0%,100%{top:22%}50%{top:76%}}
.scanbox .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#8fd9bd;font-size:11px;font-family:Consolas,monospace}
.scanbox .bigcode{color:#e9fff5;font-size:15px;font-weight:800;font-family:Consolas,monospace;letter-spacing:1px;text-align:center}
.scanbox .torch{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#ffe9a8;display:grid;place-items:center}
/* 扫码记录 */
.scanlog{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.slog{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:12px;background:#fff}
.slog i{font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.slog.ok i{background:#dff5ea;color:var(--grn)}
.slog.bad i{background:#fde3e3;color:var(--red)}
.slog .code{font-family:Consolas,monospace;font-weight:700}
.slog .t{margin-left:auto;color:var(--mut);font-size:10.5px}
/* 清单行 */
.li{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px;background:#fff}
.li.done{border-color:#bfe7d2;background:#f4fcf7}
.li.miss{border-color:#f3c8c8;background:#fef5f5}
.li .ck{width:24px;height:24px;border-radius:8px;border:2px solid #c3cfdd;display:grid;place-items:center;color:#fff;font-size:12px;flex-shrink:0}
.li.done .ck{background:var(--grn);border-color:var(--grn)}
.li .nm{flex:1;min-width:0}
.li .nm b{font-size:13px;display:block}
.li .nm span{font-size:10.5px;color:var(--mut);display:block;margin-top:1px}
.li input{width:74px;height:40px;text-align:center;border:1.5px solid var(--line);border-radius:10px;font-weight:800;font-size:14px}
.li.done input{background:#f0faf4;border-color:#bfe7d2}
/* 进度条 */
.pgw{height:8px;background:#e6ecf4;border-radius:99px;overflow:hidden;margin:8px 0}
.pgw>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#57a0f5);border-radius:99px;transition:width .3s}
/* 步骤条 */
.stepper{display:flex;gap:4px;margin-bottom:12px}
.stepper span{flex:1;height:5px;border-radius:99px;background:#dbe3ee}
.stepper span.on{background:var(--blue)}
.stepper span.done{background:var(--grn)}
/* 底部导航 */
.tabbar{background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + var(--safe-b));flex-shrink:0}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#8393a7;font-weight:700;padding:5px 0;border-radius:12px;position:relative}
.tabbar button i{font-size:19px;font-style:normal}
.tabbar button.on{color:var(--blue)}
.tabbar button .bdg{position:absolute;top:0;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
/* Toast / 弹层 */
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#0f1c30;color:#fff;font-size:12px;padding:10px 16px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:86%;text-align:center}
#toast.on{opacity:1}
#toast.bad{background:var(--red)}
.mask{position:absolute;inset:0;background:rgba(8,18,32,.45);display:none;align-items:flex-end;z-index:60}
.mask.on{display:flex}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:82%;overflow:auto;padding:16px 16px calc(16px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:4.5px;border-radius:99px;background:#d7dfeb;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:16px}
/* 签名板 */
.signpad{border:2px dashed #b9c6d6;border-radius:14px;background:#fbfdff;height:150px;position:relative;overflow:hidden}
.signpad canvas{width:100%;height:100%;touch-action:none}
.signpad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0c2;font-size:12px;pointer-events:none}
/* 同步队列 */
.syncbar{display:flex;align-items:center;gap:8px;background:#fff7ea;border:1px solid #f5ddb2;color:#92600a;font-size:11px;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.syncbar i{font-style:normal}
/* 清单来源条 / 行内链接 */
.srcbar{display:flex;align-items:center;gap:6px;font-size:11px;color:#5b6f86;background:#f2f7fd;border:1px solid #dfeaf6;border-radius:12px;padding:8px 12px;margin:6px 0}
.srcbar b{color:#125d97}
.srcbar .lnk{margin-left:auto}
.lnk{color:var(--blue);font-weight:800;background:none;padding:0 2px}
/* 小取景框（登记页扫箱码用） */
.scanbox.mini{height:164px;margin-top:8px}
.li>.btn{margin-left:4px;flex-shrink:0}
.li .tag{flex-shrink:0}
/* 快捷选择：分类 chips / 清单行 / 数量行 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:800;color:#4d6479;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.linecard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.linecard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linecard .top b{font-size:13.5px}
.qrow{display:flex;gap:6px;align-items:center;margin-top:8px}
.qrow .f{flex:1;min-width:0;text-align:center}
.step.sm{width:42px;height:40px;font-size:17px;border-radius:10px}
.numbadge{font-size:11.5px;color:#42586c;background:#f4f8fd;border:1px solid #e2ecf7;border-radius:10px;padding:7px 12px;margin:8px 0}
.numbadge b{color:var(--blue)}
/* 空态/骨架 */
.empty{text-align:center;padding:36px 12px;color:#93a3b6}
.empty i{font-size:34px;display:block;margin-bottom:10px;color:#c3cfdd}
.skel{background:linear-gradient(90deg,#e9eef5 25%,#f5f8fb 50%,#e9eef5 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:56px;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
/* 视图切换 */
.view{display:none}.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
/* 徽标统计 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{font-size:19px;display:block}
.stat span{font-size:10px;color:var(--mut)}
.stat.warn b{color:var(--amber)}.stat.bad b{color:var(--red)}.stat.ok b{color:var(--grn)}
/* 时间线 */
.tl{position:relative;padding-left:18px;font-size:11.5px;color:var(--mut);line-height:1.9}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#e2e9f2}
.tl .ti{position:relative}
.tl .ti:before{content:"";position:absolute;left:-16.5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl .ti.done:before{background:var(--grn)}
.tl .ti b{color:var(--ink);font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="frame"><main id="app">
  <div class="statusbar"><span>09:41</span><span class="sigs"><i class="fa-solid fa-signal"></i><i class="net fa-solid fa-wifi"></i><span style="font-size:10px">PDA-03</span><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <header class="apphead">
    <div class="row1">
      <div class="who"><b id="hName">李小明 · 车间领料员</b><span id="hScope">一监区 · 缝制一车间 / 王班组 · 设备 PDA-03</span></div>
      <button class="iconbtn" id="syncBtn" aria-label="同步队列"><i class="fa-solid fa-cloud-arrow-up"></i><span class="dot" id="syncBadge">0</span></button>
      <button class="iconbtn" aria-label="消息通知"><i class="fa-regular fa-bell"></i><span class="dot">3</span></button>
    </div>
    <div class="quick" id="quickGrid"></div>
  </header>

  <section class="content" id="content"></section>

  <nav class="tabbar" id="tabbar"></nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <div class="mask" id="mask"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</main></div>

<script src="app-data.js"></script>
<script src="app-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
