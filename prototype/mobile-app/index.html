<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鐜板満浣滀笟绉诲姩宸ヤ綔鍙?/title><style>
:root{--navy:#10233f;--blue:#3d7df4;--teal:#18a98b;--bg:#f4f7fa;--line:#dfe7ef}*{box-sizing:border-box}body{margin:0;background:#dfe6ef;font-family:Arial,"Microsoft YaHei",sans-serif;color:#10233f}#app{width:min(402px,100vw);height:min(860px,100dvh);margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:28px}@media(max-width:420px){#app{width:100vw;height:100dvh;border-radius:0}}header{background:var(--navy);color:#fff;padding:18px 16px 14px}.eyebrow{font-size:10px;color:#a9b8cc;letter-spacing:1px}h1{font-size:21px;margin:6px 0 3px}header p{font-size:11px;color:#c5d0df;margin:0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.quick button{height:64px;border:1px solid #385474;border-radius:14px;background:#203b5e;color:#fff;font-size:11px;font-weight:700;box-shadow:0 4px 10px #08182c40}.quick button:active{background:var(--blue);transform:translateY(1px)}.quick i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:10px;background:#e8f0ff;color:#2160d0;font-style:normal;font-size:19px;font-weight:900}.quick button:nth-child(2) i{background:#fff1df;color:#d77b12}.quick button:nth-child(3) i{background:#ddf7ef;color:#058365}.quick button:nth-child(4) i{background:#efe8ff;color:#7652cb}.content{flex:1;overflow:auto;padding:14px}.view{display:none}.view.on{display:block}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title h2{font-size:16px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.summary{font-size:12px;color:#6d7d92}.btn{height:42px;border:0;border-radius:11px;font-weight:bold}.primary{background:var(--teal);color:#fff}.field{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 10px;width:100%}.scanbox{height:210px;border-radius:18px;background:#0c1b31;color:#bdeadc;display:grid;place-items:center}.scanbox i{font-size:42px}.row{display:flex;gap:8px}nav{height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px}nav button{border:0;background:none;color:#8492a4;font-size:10px}nav button i{display:block;font-size:18px;margin-bottom:4px;font-style:normal}nav button.on{color:var(--blue)}#toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#10233f;color:#fff;padding:9px 14px;border-radius:20px;font-size:11px;display:none;z-index:5}
 .task-action{margin-top:12px;background:#eef4ff;color:#2d66d5;width:100%}.task-action.receive{background:#e8f8f3;color:#08785e}</style></head><body><main id="app"><header><div class="eyebrow">WAREHOUSE MOBILE</div><h1>鐜板満浣滀笟宸ヤ綔鍙?/h1><p>鏉庢檽鏄?路 缂濆埗涓€杞﹂棿 / 鐜嬬彮缁?/p><div class="quick"><button onclick="show('scan')"><i>鈫?/i>鍏ュ簱</button><button onclick="show('scan')"><i>鈫?/i>鍑哄簱</button><button onclick="show('scan')"><i>鈻?/i>鎺ユ敹</button><button onclick="show('scan')"><i>鈬?/i>璋冩嫧</button></div></header><section class="content"><div id="todo" class="view on"><div class="title"><h2>浠婂ぉ鐨勫伐浣?/h2><span class="summary">3 椤瑰緟鍔?/span></div><div class="card"><b>閫佽揣鍗曟竻鍗曢獙鏀?/b><p class="summary">SL2026091209 路 鎭掕揪鏈嶉グ</p><button class="btn primary" style="width:100%" onclick="show('check')">缁х画楠屾敹娓呭崟 鈫?/button></div><div class="card"><b>閫€鏂欏緟鎻愪氦</b><p class="summary">TL2026091201 路 鐗涙触甯?120 绫?/p></div><div class="card"><b>鐩撮€佸緟鎺ユ敹</b><p class="summary">ZS2026091204 路 閲屽竷 800 绫?/p></div></div><div id="scan" class="view"><div class="title"><h2>鎵爜浣滀笟</h2><span class="summary">璁㈠崟 LY2026091108</span></div><div class="scanbox"><div style="text-align:center"><i>鈻?/i><div>鐐瑰嚮鎸夐挳寮€鍚憚鍍忓ご</div><button class="btn primary" style="margin-top:12px;padding:0 18px" onclick="camera()">寮€鍚憚鍍忓ご</button></div></div><div class="card"><div class="summary">鎵嬪姩杈撳叆鐗╂枡鐮?/div><div class="row" style="margin-top:8px"><input id="code" class="field" value="SB20260910003-01"><button class="btn primary" style="padding:0 16px" onclick="scan()">璇嗗埆</button></div><div id="result" class="summary" style="margin-top:10px"></div></div></div><div id="check" class="view"><div class="title"><h2>楠屾敹娓呭崟</h2><span class="summary">2/3 宸叉牳瀵?/span></div><div class="card"><b>鈽?HD-OXF-001 路 鐗涙触甯?/b><span style="float:right">瀹炴敹 <input class="field" style="width:64px;height:32px" value="1200"></span><div class="summary">鎵规 MB2026091003 路 绫?路 閫佽揣 1200</div></div><div class="card"><b>鈽?HD-ZP-011 路 鎷夐摼</b><span style="float:right">瀹炴敹 <input class="field" style="width:64px;height:32px" value="2000"></span><div class="summary">鎵规 MB2026090901 路 浠?路 閫佽揣 2000</div></div><div class="card"><b>鈻?HD-NK-005 路 绾芥墸</b><span style="float:right">瀹炴敹 <input class="field" style="width:64px;height:32px" value="500"></span><div class="summary">鎵规 MB2026090905 路 浠?路 閫佽揣 500</div></div><button class="btn primary" style="width:100%" onclick="toast('楠屾敹宸叉彁浜?)">纭楠屾敹</button></div><div id="mine" class="view"><div class="title"><h2>鎴戠殑</h2></div><div class="card"><b>鏉庢檽鏄?/b><p class="summary">杞﹂棿棰嗘枡鍛?路 PDA-03</p></div></div></section><nav><button class="on" onclick="show('todo')"><i>鈱?/i>宸ヤ綔鍙?/button><button onclick="show('scan')"><i>鈼?/i>鎵弿</button><button onclick="show('mine')"><i>鈼?/i>鎴戠殑</button></nav><div id="toast"></div></main><script>function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',(id==='todo'&&i===0)||(id==='scan'&&i===1)||(id==='mine'&&i===2)))}function toast(s){var t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function camera(){toast('璇峰厑璁告祻瑙堝櫒璁块棶鎽勫儚澶?)}function scan(){document.getElementById('result').textContent='璇嗗埆鎴愬姛 路 鐗涙触甯?200 绫?;toast('鎵爜鎴愬姛')}</script></body></html>
