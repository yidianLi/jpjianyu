function renderMenu(){

// 手风琴：只展开当前选中/当前路由的一级，其它全部收缩

  h+='<div id="nav-group-'+g.id+'-panel" class="nav-group-panel" style="display:'+(shut?'none':'grid')+'">';

function buildRouteUrl(id, tab, view, subParam, extra){
  var params=new URLSearchParams();
  params.set('page',id);params.set('from','app');
  if(view)params.set('view',view);
  if(subParam)params.set('sub',subParam);
  if(!view&&tab)params.set('tab',tab);
  Object.keys(extra||{}).forEach(function(key){if(extra[key]!==undefined&&extra[key]!==null)params.set(key,extra[key]);});
  return location.pathname+'?'+params.toString();
}

  var r0=ROUTES[id];
  if(r0&&r0.baseTab!==undefined){var bt=r0.baseTab;tab=bt;contextTab=bt;cur=id;curTab=bt;v='';
    window.navUserSelected='g5';navSetOpen('g5');

    try{localStorage.setItem('jm_wms_last',id);}catch(e){}
    var nextUrl0=buildRouteUrl(id,bt,'','',options.extra);
    if(options.history!==false){if(options.replace)history.replaceState({page:id,tab:bt},'',nextUrl0);else if(location.href!==new URL(nextUrl0,location.href).href)history.pushState({page:id,tab:bt},'',nextUrl0);}
    renderMenu();markMenu();
    if(window.WMSView)window.WMSView.load({file:r0.file,id:id,contextTab:bt,extra:options.extra||{},iframe:0});return;}
  var r=ROUTES[id],file=r.file,v='',subParam='',fullTab='',contextTab=tab||'';
  if(WB_FILE[id]){
    fullTab=WB_DEFAULT_TAB[id]||tab||'request';
    v=fullTab; 
    if(fullTab.indexOf(':')>=0){var _p=fullTab.split(':');v=_p[0];subParam=_p[1]||'';}
    else if(fullTab==='onhand'||fullTab==='ledger'){v='stock';subParam=fullTab;}
    r.title=id==='inventoryOnhand'?'仓储作业 / 仓库库存':id==='inventoryLedger'?'仓储作业 / 库存记录':r.title;
    contextTab=v;
    curTab=id==='materialCode'?'detail':(fullTab.indexOf(':')>=0?fullTab:(v==='stock'&&subParam?(v+':'+subParam):v));
  }else{
    var FINISHED_TAB={finishedSign:'deliver',finishedOut:'register',finishedDetail:'detail',finishedRegister:'register',finishedInbound:'inbound',finishedReturn:'wreturn',finishedDeliver:'deliver',finished:'register'};
    if(FINISHED_TAB[id])tab=FINISHED_TAB[id];
    if(id==='location'&&!tab)tab='';
    contextTab=tab||'';
    v=id==='finished'||id.indexOf('finished')===0?(tab||'register'):'';
    curTab=tab||'';
  }
  window.navUserSelected='';
  cur=id;
  (function(){var gid='';GROUPS.forEach(function(g){if(g.children.some(function(c){return c[0]===id;}))gid=g.id;});if(gid){window.navUserSelected=gid;navSetOpen(gid);}})();
  var dashboardMode=id==='dashboard';
  document.body.classList.toggle('ai-route',id==='ai');
  document.body.classList.toggle('dashboard-mode',dashboardMode);
  /* 全屏由驾驶舱页内按钮主动触发，路由不再自动抢全屏 */
  document.getElementById('crumb').textContent=r.title;
  document.title=r.title+' · 物料管理系统';
  try{localStorage.setItem('jm_wms_last',id);}catch(e){}
  var nextUrl=buildRouteUrl(id,tab,v,subParam,options.extra);
  if(options.history!==false){
    if(options.replace)history.replaceState({page:id,tab:tab||''},'',nextUrl);
    else if(location.href!==new URL(nextUrl,location.href).href)history.pushState({page:id,tab:tab||''},'',nextUrl);
  }
  renderMenu();
  markMenu();
  if(window.WMSView)window.WMSView.load({file:file,id:id,contextTab:contextTab,extra:options.extra||{},iframe:r.iframe?1:0});
}
