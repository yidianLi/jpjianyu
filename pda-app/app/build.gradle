plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jianyu.pda'
    compileSdk 33

    defaultConfig {
        applicationId 'com.jianyu.pda'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 扫描头 SDK 以本地 jar 引入(app/libs/*.jar)
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}