plugins {
    id 'com.android.application'
}

// 发布签名:读 keystore.properties(该文件不入库,见 .gitignore);缺省则用 debug 签名
def ksPropsFile = rootProject.file("keystore.properties")
def ksProps = new Properties()
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.jianyu.pda'
    compileSdk 33

    defaultConfig {
        applicationId 'com.jianyu.pda'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (ksProps['storeFile']) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    // 扫描头 SDK 以本地 jar 引入(app/libs/*.jar)
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}