services:
  mysql:
    image: mysql:5.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wms
      MYSQL_USER: wms
      MYSQL_PASSWORD: wms
    volumes:
      - ./sql/wms.sql:/docker-entrypoint-initdb.d/01-wms.sql
    ports:
      - "3307:3306"
  wms-api:
    build: .
    env_file:
      - ./config/.env
    environment:
      DB_URL: mysql+pymysql://wms:wms@mysql:3306/wms?charset=utf8mb4
    volumes:
      - ../prototype:/prototype:ro
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
