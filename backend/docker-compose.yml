services:
  mysql:
    image: mysql:5.6
    restart: always
    environment:
      # 生产务必通过环境变量覆盖默认弱口令(见 config/.env.example 与部署文档)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: wms
      MYSQL_USER: ${MYSQL_USER:-wms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wms}
      SEED_DEMO: ${SEED_DEMO:-0}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/wms.sql:/docker-entrypoint-initdb.d/01-wms.sql
      - ./sql/seed_demo.sh:/docker-entrypoint-initdb.d/02-seed-demo.sh:ro
      - ./sql/seeds/seed_demo.sql:/opt/seeds/seed_demo.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  wms-api:
    build: .
    image: backend-wms-api:formal1
    restart: always
    env_file:
      - ./config/.env
    environment:
      DB_URL: mysql+pymysql://${MYSQL_USER:-wms}:${MYSQL_PASSWORD:-wms}@mysql:3306/wms?charset=utf8mb4
    volumes:
      - ../prototype:/prototype:ro
      - ./app:/srv/app:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080

volumes:
  mysql_data:
